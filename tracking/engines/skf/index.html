<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKF · DnB Engine</title>
<style>
/* ===================================================================
   ONE PRODUCT, ONE LOOK.
   The palette, the shell and the components below are the planning
   engine's (src/styles.css), token for token. The two apps are two
   halves of one job — a programme is authored in one and watched in the
   other — and a person crossing between them should not have to
   re-learn what a panel, a chip or a status colour means.

   The token NAMES are unchanged on purpose. There are ~800 var(--x)
   uses across this file; renaming them to match the planning engine's
   spelling would have touched every one of those and risked a typo in
   a screen nobody opened that day. The values move, the names stay.
   =================================================================== */
:root{
  --bg:#f4f6fa;        /* planning: --bg     */
  --card:#ffffff;      /* planning: --panel  */
  --card2:#f7f9fc;     /* planning: --panel2 */
  --ink:#14181f;       /* planning: --text   */
  --mut:#66717f;       /* planning: --muted  */
  --fnt:#98a2b1;       /* planning: --faint  */
  --line:#e2e7ee;
  --line2:#eef1f6;
  --acc:#0f6fff;
  --acc-soft:#e8f1ff;
  --ok:#12805c;      --ok-soft:#d9f5e9;
  --warn:#b54708;    --warn-soft:#fdf0d5;
  --bad:#d92d20;     --bad-soft:#fee4e2;
  --ext:#6941c6;     --ext-soft:#f0eafc;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --r:12px}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);-webkit-font-smoothing:antialiased;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* The shell is the planning engine's: a sticky header, a horizontal tab
   strip under it, then the page. The left rail is gone. Twenty-five steps
   do not fit a tab strip at any font size, so the strip scrolls sideways
   exactly as the planning engine's does with eleven. */
.app{display:flex;flex-direction:column;min-height:100vh}
/* The markup is <rail><main><top><wrap>>: the rail comes first because it used
   to be a left column. `display:contents` on .main lifts top and wrap into the
   same flex context, and order puts them in the planning engine's sequence —
   header, tab strip, page — without moving anything in the DOM. */
.top{order:1}
.rail{order:2}
.wrap{order:3}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px;
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  box-shadow:var(--shadow)}
.top h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.top p{margin:1px 0 0;font-size:11px;color:var(--fnt)}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* sticks directly under the header. The offset is the header's real height —
   it wraps its status chips on a narrow window, so this is set from a measured
   value at runtime too (see render), not trusted to stay 65px. */
/* THE STRIP MUST SHOW THAT IT SCROLLS.
   Twenty-five steps do not fit any window, so this always overflows. The first
   cut hid the scrollbar (height:0) to keep the bar looking clean, which left no
   handle to drag and — worse — no sign that steps 13 to 24 existed at all. The
   bar is visible, and the arrows either side appear only when there is
   something in that direction to reach. */
.railwrap{order:2;position:relative;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:65px;z-index:15}
.rail{display:flex;gap:2px;padding:0 18px 0 18px;background:var(--card);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#c4ccd8 var(--card2)}
.rail::-webkit-scrollbar{height:9px}
.rail::-webkit-scrollbar-track{background:var(--card2)}
.rail::-webkit-scrollbar-thumb{background:#c4ccd8;border-radius:5px}
.rail::-webkit-scrollbar-thumb:hover{background:#a6b1c2}
/* the edge fades say "there is more this way" before the arrow is even noticed */
.railwrap::before,.railwrap::after{content:"";position:absolute;top:0;bottom:9px;width:34px;
  pointer-events:none;opacity:0;transition:opacity .15s;z-index:2}
.railwrap::before{left:0;background:linear-gradient(90deg,var(--card),rgba(255,255,255,0))}
.railwrap::after{right:0;background:linear-gradient(270deg,var(--card),rgba(255,255,255,0))}
.railwrap.moreL::before{opacity:1}
.railwrap.moreR::after{opacity:1}
.railar{position:absolute;top:0;height:calc(100% - 9px);width:30px;border:0;cursor:pointer;
  background:var(--card);color:var(--mut);font-size:15px;line-height:1;z-index:3;display:none;
  align-items:center;justify-content:center;padding:0}
.railar:hover{color:var(--acc);background:var(--card2)}
.railar.l{left:0;border-right:1px solid var(--line)}
.railar.r{right:0;border-left:1px solid var(--line)}
.railwrap.moreL .railar.l{display:flex}
.railwrap.moreR .railar.r{display:flex}

/* ---- THE SAME STEPS DOWN THE SIDE ----
   Twenty-five tabs in a strip means most of them are always off-screen, however
   good the scrolling is. Down the left they all fit at once and the numbers line
   up, which is the better shape for picking a step you have not been to. Neither
   is right for everyone, so it is a choice and it is remembered.
   The DOM does not change between the two: only which axis the shell runs on. */
.app.vnav{display:grid;grid-template-columns:246px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);min-height:100vh}
.app.vnav .top{grid-column:2;grid-row:1}
.app.vnav .railwrap{grid-column:1;grid-row:1/3;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--line);border-bottom:0;overflow:hidden;
  display:flex;flex-direction:column}
.app.vnav .rail{flex-direction:column;gap:1px;padding:12px 10px 18px;overflow-y:auto;overflow-x:hidden;
  align-items:stretch;flex:1}
.app.vnav .rail::-webkit-scrollbar{width:9px;height:9px}
.app.vnav .brand{border-right:0;border-bottom:1px solid var(--line);margin:0 0 8px;
  padding:4px 8px 12px;width:100%}
.app.vnav .nav{border-bottom:0;border-left:2px solid transparent;border-radius:0 8px 8px 0;
  padding:8px 11px;width:100%;justify-content:flex-start}
.app.vnav .nav:hover{background:var(--card2)}
.app.vnav .nav.on{background:var(--acc-soft);border-left-color:var(--acc);border-bottom-color:transparent}
/* the group headings earn their place again once there is a column to hold them */
.app.vnav .lg{display:block;font-size:9.5px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--fnt);padding:14px 11px 5px}
.app.vnav .railar{display:none!important}
.app.vnav .railwrap::before,.app.vnav .railwrap::after{display:none}
.app.vnav .wrap{grid-column:2;grid-row:2}
/* the toggle itself */
.navtog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  box-shadow:var(--shadow)}
.navtog button{border:0;background:var(--card);color:var(--mut);cursor:pointer;padding:6px 9px;
  font:inherit;font-size:12px;line-height:1}
.navtog button.on{background:var(--acc);color:#fff}
.navtog button:hover:not(.on){background:var(--card2);color:var(--acc)}

/* ---- WHAT HAS NOT BEEN SENT YET ----
   Sits above everything, because the one thing worse than an unpushed change is
   an unpushed change nobody can see. It is deliberately not a toast: it stays
   until the changes are dealt with one way or the other. */
.pendbar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:70;
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--acc);
  border-radius:12px;padding:11px 15px;box-shadow:0 8px 28px rgba(16,24,40,.16);font-size:12.8px;
  max-width:calc(100vw - 40px)}
.pendbar b{font-weight:700}
.pendbar .pmsg{color:var(--mut)}
.pendbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:7px 12px;font:inherit;font-size:12.4px;cursor:pointer;white-space:nowrap}
.pendbar button.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.pendbar button.go:hover{background:#0a5ad6}
.pendbar button:hover:not(.go){border-color:var(--acc);color:var(--acc)}
.pendbar button:disabled{opacity:.55;cursor:default}
.pendbar .perr{color:var(--bad)}
/* a cell holding an unsent change reads differently from one already shared:
   dashed while it is only yours, solid once the other app has it */
.peinp.pepend{border-color:var(--warn);background:var(--warn-soft);border-style:dashed;font-weight:600}
.brand{display:flex;gap:9px;align-items:center;padding:7px 14px 7px 0;margin-right:6px;
  border-right:1px solid var(--line);flex:0 0 auto}
.brand .m{width:26px;height:26px;border-radius:7px;background:var(--acc);display:grid;
  place-items:center;font-weight:700;font-size:10px;color:#fff}
.brand b{display:block;font-size:13px;line-height:1.2;white-space:nowrap}
.brand span{font-size:10.5px;color:var(--fnt);white-space:nowrap}
/* the group headings the rail used ("Portfolio", "The engine") have no place
   in a tab strip; they are kept in the DOM and hidden, so the rail builder
   did not have to be rewritten for a purely visual change */
.lg{display:none}
.nav{display:inline-flex;gap:7px;align-items:center;border:0;background:transparent;
  color:var(--mut);border-bottom:2px solid transparent;padding:11px 13px;white-space:nowrap;
  font-size:13px;cursor:pointer;flex:0 0 auto}
.nav:hover{color:var(--acc)}
.nav.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.nav .n{width:17px;height:17px;border-radius:5px;background:var(--card2);font-size:9.5px;
  display:grid;place-items:center;flex:0 0 17px;color:var(--fnt);border:1px solid var(--line)}
.nav.on .n{background:var(--acc);color:#fff;border-color:var(--acc)}
/* the built/not-built dot: a full-width rail could afford it on the right,
   a tab cannot, so it rides beside the number */
.nav .d{width:5px;height:5px;border-radius:50%;background:transparent}
.nav .d.ok{background:var(--ok)}.nav .d.warn{background:var(--warn)}.nav .d.bad{background:var(--bad)}
.main{display:contents}
.wrap{padding:22px;flex:1;max-width:1700px;width:100%;margin:0 auto}
/* ONE PAGE, ONE SCROLLBAR, AND IT IS THE CHART'S. A programme you have to
   scroll the whole page to read loses its own header the moment you look
   past July. On this step the page is pinned to the viewport and the box
   inside it does all the scrolling. */
.app.fit{height:100vh;overflow:hidden}
.app.fit .main{height:100vh;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.app.fit .wrap{flex:1;min-height:0;max-width:none;padding:16px 22px 0;display:flex;flex-direction:column;overflow:hidden}
.schpage{display:flex;flex-direction:column;min-height:0;flex:1}
.schpage .p:last-child{display:flex;flex-direction:column;min-height:0;flex:1;margin-bottom:14px}
.schpage .p:last-child>.pb:first-child{flex:1;min-height:0;display:flex}
.schpage .schbox{flex:1;min-height:0;max-height:none;width:100%}
h2{margin:0 0 4px;font-size:19px;letter-spacing:-.2px}
.sub{margin:0 0 16px;font-size:12.8px;color:var(--mut);max-width:76ch}
/* Panels are the planning engine's cards: white, hairline border, 12px radius
   and the same one-pixel shadow. On a light ground a borderless panel simply
   disappears, which is why the shadow is not decoration here. */
.p{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.ph{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ph h3{margin:0;font-size:13px;font-weight:600}
.ph p{margin:3px 0 0;font-size:11.8px;color:var(--mut);max-width:80ch}
.ph .r{margin-left:auto;font-size:11.5px;color:var(--fnt);text-align:right}
.pb{padding:14px 16px}
/* The stat strip is the planning engine's .cards/.card: separate tiles with a
   gap, not cells divided by rules. The old one drew 1px gaps in --line and let
   the background show through, which on white is an invisible divider. */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;
  background:transparent;padding:14px 16px}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;box-shadow:var(--shadow)}
.g .v{font-size:21px;font-weight:700;letter-spacing:-.4px;margin-top:3px;
  font-variant-numeric:tabular-nums}
.g .k{color:var(--fnt);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.g .v+.k{color:var(--mut);font-size:11px;text-transform:none;letter-spacing:0;font-weight:400;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
/* ---- the programme ---- */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;box-shadow:var(--shadow)}
.seg button{background:var(--card);border:0;color:var(--ink);font:inherit;font-size:12px;
  padding:7px 12px;cursor:pointer;border-radius:0}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.seg button:hover:not(.on):not(:disabled){background:var(--card2);color:var(--acc)}
/* STICKY CELLS DO NOT HOLD IN A COLLAPSED-BORDER TABLE. The global table rule
   sets border-collapse:collapse, under which a sticky <td> drifts with the
   scroll instead of pinning — the names column slid 60px out of the box. The
   row borders are drawn per cell below, so nothing is lost by separating. */
table.gantt{table-layout:fixed;border-collapse:separate;border-spacing:0}
table.gantt td{padding:3px 8px;vertical-align:middle;border-bottom:1px solid #ffffff08}
table.gantt th{padding:5px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fnt);text-align:left}
table.gantt th.n,table.gantt td.n{text-align:right}
/* THREE LEVELS HAVE TO LOOK LIKE THREE LEVELS. Two shades of almost-black
   apart is not a hierarchy — a PM scanning this could not tell a phase from
   a package from a room. Each level gets its own weight, its own indent and
   its own colour bar down the left, so the shape reads before the words do. */
tr.lv0>td{background:var(--acc-soft);border-top:1px solid var(--line);padding-top:7px;padding-bottom:7px}
tr.lv0 td.nm{border-left:3px solid var(--acc);font-size:12.8px;background:var(--acc-soft)}
tr.lv0 td.nm b{font-weight:700;letter-spacing:.1px}
tr.lv1>td{background:var(--card2)}
tr.lv1 td.nm{border-left:3px solid #7aa7e8;background:var(--card2);font-size:12.2px}
tr.lv2>td{background:var(--card);color:var(--mut);font-size:11.5px}
tr.lv2 td.nm{border-left:3px solid var(--line);background:var(--card)}
tr.lv0:hover>td,tr.lv0:hover td.nm{background:#d9e8ff}
tr.lv1:hover>td,tr.lv1:hover td.nm{background:var(--line2)}
tr.lv2:hover>td,tr.lv2:hover td.nm{background:var(--card2)}
.tw{display:inline-block;width:13px;color:var(--fnt);font-size:9px}
/* THE TRADE TAG IS THE POINT OF THE ROW. A civil package with two electrical
   steps in it is the single most useful thing this breakdown says, and it
   only says it if you can see it at a glance. */
/* Trade tags keep their hues — a PM reads civil green and electrical amber at
   a glance — but inverted for a light ground: soft tint behind, saturated ink. */
.tg{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  padding:1px 5px;border-radius:4px;margin-right:7px;vertical-align:1px;background:var(--card2);color:var(--mut)}
.tg-electrical{background:#fdf0d5;color:#8a6510}
.tg-civil{background:#e8f2dc;color:#4f7031}
.tg-drywall{background:#e6eefb;color:#2f5d99}
.tg-hvac{background:#d9f2f0;color:#12706b}
.tg-plumbing{background:#e2eefb;color:#215f8c}
.tg-elv{background:#f0eafc;color:#6941c6}
.tg-fire{background:#442628;color:#e8918e}
.tg-painting{background:#3d2f3f;color:#d3a3d0}
.tg-joinery{background:#3b3324;color:#d4bc8a}
.tg-ceiling{background:#26333d;color:#8fc0d0}
.tg-flooring{background:#2e3630;color:#9fc2a8}
/* the chart column: bars flush to its edges so they line up with the axis */
/* THE PROGRAMME LIVES IN A FIXED BOX AND SCROLLS INSIDE IT. A five-month
   chart at week resolution is wider than any screen and taller than any
   screen; letting the page grow to fit it loses the header and the numbers
   the moment you look at September. */
.pick{cursor:pointer;text-decoration:none;color:inherit;white-space:nowrap;
  border-bottom:1px solid transparent;padding-bottom:1px}
.pick:hover{border-bottom-color:currentColor}
.wt{font-size:10px;color:var(--mut);margin-left:6px;padding:1px 4px;border:1px solid var(--line);
  border-radius:4px;white-space:nowrap;cursor:help}
.asm{color:var(--warn)}
.cfm{color:var(--ok)}
/* the manpower chart: a dot has to answer before it is clicked ------------ */
/* THE SCALE DOES NOT SCROLL AWAY. Three months of days is wider than any
   panel, and a chart whose numbers leave the screen the moment you look at
   August is a chart you have to keep scrolling back to read. The axis sits
   in its own gutter outside the scrolling area. */
.mpouter{position:relative}
.mpaxis{position:absolute;left:0;top:0;z-index:6;pointer-events:none}
.mpwrap{position:relative;overflow-x:auto;overflow-y:hidden}
.mpwrap svg g[data-mpday]{cursor:pointer}
.mpwrap svg g[data-mpday] .halo{opacity:0;transition:opacity .08s}
.mpwrap svg g[data-mpday]:hover .halo,.mpwrap svg g.on .halo{opacity:1}
.mpwrap svg g[data-mpday]:hover .hit,.mpwrap svg g.on .hit{fill:#ffffff0a}
.mptip{position:absolute;pointer-events:none;display:none;z-index:20;background:var(--card2);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:10.8px;line-height:1.45;
  white-space:nowrap;color:var(--fnt);box-shadow:0 4px 12px #0006}
.ovl{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:560px;width:92%;
  padding:18px 20px;box-shadow:0 18px 50px #000a;max-height:86vh;overflow:auto}
.dlg h3{margin:0 0 4px;font-size:15px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
  color:var(--fg);border-radius:9px;padding:9px 11px;margin-top:7px;cursor:pointer;font-size:12.5px}
.opt:hover{border-color:var(--acc)}
.opt b{display:block;font-size:12.5px}
.opt span{color:var(--mut);font-size:11.2px}
.schbox{max-height:70vh;overflow:auto;position:relative}
table.gantt td.gz,table.gantt th.gz{padding-left:0;padding-right:0}
/* the names column: sticky, so scrolling into next month keeps the task in
   view, and resizable, because "Modular glass partition & doors" does not
   fit in the width that suits "Paint". */
/* WITH table-layout:fixed THE WIDTHS COME FROM THE FIRST ROW — and the first
   row here is the month band, whose cells are empty. Declaring them on a
   <colgroup> instead is what that element is for, and it is why the Start
   column had collapsed to nothing. */
col.cnm{width:var(--c1,260px)}
table.gantt th.nm,table.gantt td.nm{position:sticky;left:0;z-index:2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.gantt thead th{position:sticky;top:0;z-index:3;background:var(--card)}
table.gantt thead tr.mrow th{top:0}
table.gantt thead tr:not(.mrow) th{top:20px}
table.gantt thead th.nm{z-index:4}
/* A HANDLE NOBODY CAN SEE IS NOT A HANDLE. The divider is drawn all the time
   and brightens under the cursor, and the names column carries the same line
   down the whole chart so the two panes read as two panes. */
.rsz{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:col-resize;z-index:6}
.rsz:after{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:#3a4152}
.rsz:hover:after,.rsz.on:after{background:var(--acc);width:2px;left:3px}
table.gantt th.nm,table.gantt td.nm{border-right:1px solid #3a4152}
/* the chart surface */
.gcell{position:relative;height:15px}
.gbar{position:absolute;top:50%;transform:translateY(-50%);border:1px solid;border-radius:3px;overflow:hidden}
.gbar span{position:absolute;left:0;top:0;bottom:0;opacity:.92}
.rl{position:absolute;top:-3px;bottom:-3px;width:1px;opacity:.85;pointer-events:none}
.mb{position:absolute;top:0;font-size:9.5px;color:var(--mut);border-left:1px solid var(--line);
  line-height:15px;overflow:hidden;white-space:nowrap;text-align:center;letter-spacing:.4px}
.tk{position:absolute;top:0;font-size:9px;color:var(--fnt);border-left:1px solid #ffffff0f;
  line-height:14px;text-align:center;overflow:hidden}
.tk.dim{color:#3d4351}
.sw{display:inline-block;width:15px;height:8px;border-radius:2px;margin-right:5px}
.svr{display:inline-block;width:2px;height:10px;margin-right:5px;vertical-align:-1px}
tr.lv0,tr.lv1{cursor:pointer}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--fnt);font-weight:600;padding:0 8px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.f{color:var(--fnt)}.m{color:var(--mut)}
.src{font-size:10.5px;color:var(--fnt);margin-top:2px;font-family:ui-monospace,SFMono-Regular,monospace}
/* Chips are the planning engine's .tag: soft tint, no border, coloured text.
   The dark build tinted them near-black (#0e3a2a and friends), which on white
   is a dark badge with dark text inside it — 1.4:1, unreadable. Defined once
   here; an earlier pass added a second copy ABOVE the original and lost, which
   is why this is one block and not an override. */
.c{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:var(--card2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.c.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

<script>
// ===================================================================
// DnB-OS . platform/ingest/spaces.js . WHICH LABELS ARE ROOMS
// A GFC drawing carries a few hundred pieces of text and only some of
// them name a place. The rest are the title block, the door schedule,
// the flooring legend, ceiling specs, furniture and sheet names. Reading
// them all as rooms is how a 26,000 sqft floor turns into a 60,000 sqft
// plan.
//
//   classify(label)       room | notRoom(reason) | unknown
//   normalise(label)      the canonical name for a room said three ways
//   rooms(facts)          the room schedule, with what was rejected
//
// THE LAWS
//   . THE VOCABULARY IS DECLARED, NOT LEARNED. Every word that makes a
//     label a room, and every word that rules one out, is written here
//     where a person can read and argue with it. Nothing is inferred
//     from shape, size or position.
//   . RULING OUT BEATS RULING IN. "PHONE BOOTH TABLE" contains PHONE
//     BOOTH; it is furniture. A label that matches both lists is NOT a
//     room, because the cost of inventing a room is a whole trade's
//     quantities against a place that does not exist.
//   . A LABEL THE VOCABULARY DOES NOT KNOW IS REPORTED. Never guessed
//     into a room, never silently dropped. It comes back as unknown with
//     its measured area, so a person decides once and the word joins the
//     vocabulary.
//   . ONE ROOM SAID THREE WAYS IS ONE ROOM. "BOARD ROOM", "BOARDROOM -
//     20 PAX" and "BOARD ROOM- 20 PAX" are the same place. They collapse
//     to one canonical name . but if their AREAS differ, that is a
//     conflict and it is raised, never averaged.
//
// Pure: labels in, a classification out. No clock, no I/O.
// ===================================================================

;(function (root) {

// ---- what makes a label a place --------------------------------------
// Read off the real SKF GFC drawing. Adding a word is one line here.
const ROOM_WORDS = [
  "reception", "waiting", "boardroom", "board room", "cabin", "meeting room", "mr-",
  "cafeteria", "pantry", "dishwash", "dish wash", "handwash", "hand wash",
  "collab", "breakout", "library", "phone booth", "focus pod", "workstation",
  "washroom", "restroom", "wellness", "wc", "toilet",
  "server room", "ups", "battery room", "ahu", "electrical room", "ele./ ups",
  "compactor", "storage", "repro", "payroll", "manager cabin", "visiting",
  "passage", "lobby", "corridor", "circulation", "refuge", "balcony", "ramp",
  "elevator", "lift", "staircase", "shaft", "duct room", "hub room",
  "serving counter", "coffee station",
];

// ---- what rules a label OUT, whatever else it contains -----------------
// Ruling out beats ruling in: "PHONE BOOTH TABLE" is furniture.
const NOT_ROOM = [
  // title block and sheet metadata
  { re: /^(client|date|scale|version|dwg|drawing|project prefix|path|location|north|purpose|designed by|changed by|check(ed)? by|revision|rev\b|sheet)\b/i, why: "title block" },
  { re: /^(for approval|for execution|for construction|as built)$/i, why: "issue stamp" },
  { re: /^d:[\\/]/i, why: "a file path in the title block" },
  { re: /^v\d+$/i, why: "a version number" },
  { re: /^skf .*floor$/i, why: "the sheet's own project name" },
  // legends and schedules
  { re: /\b(legend|schedule|indication|hatch|layout|type|particulars|description)\b/i, why: "a legend or schedule heading" },
  { re: /^(qty|nos\.?|total|required|achieved|areas?|sq\.?m|carpet area|note)\s*:?$/i, why: "a schedule column heading" },
  { re: /^size\s*[\(:]/i, why: "a schedule column heading" },
  { re: /^type\s*\d+\s*:/i, why: "a door or window schedule row" },
  // materials, finishes and ceilings . these describe a surface, not a place
  { re: /\b(tile|tiles|carpet|epoxy|terrazzo|vitrified|lvt|micro concrete|screed)\b/i, why: "a floor finish" },
  { re: /\b(paneling|panelling|wallpaper|laminate|veneer|lacquered|fluted|fabric|rubber wood|mdf|duco)\b/i, why: "a wall finish" },
  { re: /\bceiling\b/i, why: "a ceiling specification" },
  { re: /\b(paint|wall finish(es)?)\b/i, why: "a finish note" },
  { re: /^start tile$/i, why: "a tile-setting-out note" },
  // furniture, fittings and equipment
  { re: /\b(table|counter|credenza|planter|vending|dispenser|machine|light|luminaire|partition|door|furniture|modular)\b/i, why: "furniture, a fitting or a light" },
  { re: /^(sugar|sugar free|stirrer|tea bag|coffee vending|high counter)$/i, why: "a pantry consumable on the furniture layout" },
  // service abbreviations and matrix codes
  { re: /^(ap|fa|fp|pe|phe|sp|lp|lg|l g|chws|matrix|m p d|rw p|l\.h\.s\.|d\d+)$/i, why: "a services abbreviation or grid code" },
];

// a legend cell that lists several rooms is not one room
const MULTI = /(,| & | and )/i;

function classify(label) {
  const s = String(label == null ? "" : label).trim();
  if (!s) return { verdict: "notRoom", why: "empty" };
  const low = s.toLowerCase();

  // RULING OUT BEATS RULING IN . checked first, on purpose
  for (const r of NOT_ROOM) if (r.re.test(s)) return { verdict: "notRoom", why: r.why };

  const hit = ROOM_WORDS.find(w => low.indexOf(w) !== -1);
  if (!hit) return { verdict: "unknown",
    why: "no word in the declared vocabulary makes this a place" };

  // a legend row naming several rooms is a legend row
  if (MULTI.test(s) && ROOM_WORDS.filter(w => low.indexOf(w) !== -1).length > 1)
    return { verdict: "notRoom", why: "a legend row listing several rooms, not one room" };

  return { verdict: "room", matched: hit };
}

// ---- one room said three ways ----------------------------------------
// "BOARD ROOM", "BOARDROOM - 20 PAX", "BOARD ROOM- 20 PAX" are one place.
// The pax count is kept on the canonical name where it is given, because
// it is real information . but it does not make two rooms.
function normalise(label) {
  let s = String(label || "").trim().toLowerCase()
    .replace(/\s*[-–—]\s*/g, " ")
    .replace(/\s+/g, " ")
    .replace(/\.$/, "")
    .trim();
  // the same place, spelled apart
  s = s.replace(/^board ?room/, "boardroom")
       .replace(/^mr /, "meeting room ")
       .replace(/^ele\.?\/ ?ups room$/, "ups and elec room")
       .replace(/^electrical room$/, "ups and elec room")
       .replace(/^visiting meeting room/, "visiting meeting room")
       .replace(/^reception \+ waiting area$/, "reception")
       .replace(/^reception waiting area$/, "reception")
       .replace(/^collab area \/ breakout area$/, "collab area")
       .replace(/^phone booth \/ focus pod$/, "phone booth")
       .replace(/^payroll team$/, "payroll")
       .replace(/^washroom$/, "restroom");
  // strip a trailing pax count so "boardroom 20 pax" == "boardroom"
  const pax = /(\d+)\s*pax/.exec(s);
  s = s.replace(/\s*\d+\s*pax\s*/, " ").replace(/\s+/g, " ").trim();
  return { key: s, pax: pax ? Number(pax[1]) : null };
}

// ---- the room schedule -------------------------------------------------
// facts: the area facts from the ingest. Returns rooms, rejects and the
// unknown words . every label accounted for, none dropped.
function rooms(facts) {
  const kept = {}, rejected = [], unknown = [];
  for (const f of (facts || [])) {
    if (f.kind !== "area") continue;
    const c = classify(f.subject);
    if (c.verdict === "notRoom") { rejected.push({ label: f.subject, why: c.why, sqft: f.value, source: f.source }); continue; }
    if (c.verdict === "unknown") { unknown.push({ label: f.subject, sqft: f.value, source: f.source, why: c.why }); continue; }
    const n = normalise(f.subject);
    const r = kept[n.key] = kept[n.key] || { key: n.key, name: f.subject, pax: n.pax,
      saidAs: [], readings: [] };
    if (r.saidAs.indexOf(f.subject) === -1) r.saidAs.push(f.subject);
    if (n.pax && !r.pax) r.pax = n.pax;
    r.readings.push({ sqft: f.value, conf: f.conf, source: f.source, note: f.note || null });
  }

  const out = [];
  for (const k of Object.keys(kept).sort()) {
    const r = kept[k];
    const areas = [...new Set(r.readings.map(x => x.sqft))];
    const shared = r.readings.some(x => x.conf === "inferred");
    out.push({
      key: r.key, name: title(r.key), pax: r.pax, saidAs: r.saidAs,
      sqft: areas.length === 1 ? areas[0] : null,
      // ONE ROOM SAID THREE WAYS IS ONE ROOM . but two different areas for
      // it is a conflict, raised rather than averaged or majority-voted.
      conflict: areas.length > 1 ? areas.slice().sort((a, b) => b - a) : null,
      shared,                                  // its polygon carried more than one label
      readings: r.readings,
      conf: areas.length > 1 ? "conflict" : (shared ? "ambiguous" : "measured"),
    });
  }
  return { rooms: out.sort((a, b) => (b.sqft || 0) - (a.sqft || 0)),
    rejected, unknown,
    total: out.reduce((s, r) => s + (r.sqft || 0), 0),
    settled: out.filter(r => r.conf === "measured").length,
    ask: out.filter(r => r.conf !== "measured").length };
}

const title = (s) => String(s).replace(/\b[a-z]/g, c => c.toUpperCase());

const SPACES = { ROOM_WORDS, NOT_ROOM, classify, normalise, rooms, title };
root.INGEST_SPACES = SPACES;
if (typeof module !== "undefined" && module.exports) module.exports = SPACES;

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>

// A fit-out is bought, built and handed over by discipline. Knowledge that
// is not sorted the same way cannot be handed to the person who needs it.
//
//   DISCIPLINES        the declared list, in the order a floor is built
//   of(text)           which discipline a line belongs to, or null
//   group(facts)       facts sorted into disciplines, with what did not sort
//
// THE LAWS
//   . THE LIST IS DECLARED. Every discipline and every word that puts a
//     line into it is written here where a person can argue with it.
//     Nothing is clustered, guessed or learned.

//     an unknown line under "Interior" because it has to go somewhere is
//     how a scope item disappears into a category nobody reads.
//   . THE LONGER PHRASE WINS. "fire rated door" is joinery, not fire
//     fighting; "fire alarm cable" is FA, not electrical. Matching on the
//     longest declared phrase first is what keeps those apart.

  { id:"signage",    name:"Signage & graphics",words:["signage","sign board","wayfinding","graphic","vinyl","logo","branding element","nameplate"] },

  { id:"fa",         name:"Fire alarm (FA)",  words:["fire alarm","smoke detector","heat detector","hooter","manual call point","mcp","fire panel","addressable"], codes:["fa","fas"] },
  { id:"pa",         name:"Public address (PA)", words:["public address","pa system","speaker","amplifier","ceiling speaker"], codes:["pa"] },
  { id:"acs",        name:"Access control (ACS)", words:["access control","card reader","boom barrier","flap barrier","turnstile","em lock","door controller"], codes:["acs"] },
  { id:"cctv",       name:"CCTV & surveillance", words:["cctv","surveillance","camera","nvr","dvr","video wall"] },
  { id:"novec",      name:"Gas suppression (NOVEC)", words:["novec","gas suppression","fm200","clean agent","inergen"] },

".rp-chartkey{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;font-size:11.6px;color:var(--body);}",
".rp-chartkey i{display:inline-block;width:20px;height:3px;border-radius:2px;margin-right:8px;",
"  vertical-align:middle;}",
".rp-chartkey i.dot{width:10px;height:10px;border-radius:10px;}",
".rp-chartnote{font-size:11px;color:var(--faint);margin-top:9px;line-height:1.5;}",
// ---- print ----------------------------------------------------------
"@media print{",
"  @page{size:1280px 720px;margin:0;}",
"  .rstage{background:#fff;padding:0;gap:0;display:block;overflow:visible;}",
"  .rtoolbar,.noprint{display:none !important;}",
"  .rpage{box-shadow:none;margin:0 !important;transform:none !important;",
"    break-inside:avoid;page-break-inside:avoid;}",
"  .rpage + .rpage{break-before:page;page-break-before:always;}",
"  html,body{background:#fff;}",
"  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}",
"}"
].join("\n");

// ---- builders -------------------------------------------------------

// A page. variant "cover" | "plain". foot carries the page number.
function page(o) {
  o = o || {};
  // THE NUMBERED SECTION MARKER. A gold index, the section name in small caps
  // and a short gold rule beneath — the structure that makes a deck read as
  // one document rather than a stack of unrelated pages.
  var eye = (o.no || o.eyebrow)
    ? '<div class="rp-eyebrow">' + (o.no ? '<span class="no">' + esc(o.no) + "</span>" : "") +
      (o.eyebrow ? '<span class="lb">' + esc(o.eyebrow) + "</span>" : "") + "</div>" +
      '<div class="rp-erule"></div>'
    : "";
  var head = eye +
    (o.title ? '<h1 class="rp-h1">' + headline(o.title) + "</h1>" : "") +
    (o.sub ? '<div class="rp-sub">' + esc(o.sub) + "</div>" : "");
  return '<div class="rpage">' +
    '<div class="rp-in">' + head + '<div class="rp-body">' + (o.body || "") + "</div></div>" +
    '<div class="rp-foot"><span>' + esc(o.footL || (BRAND.name + " · DnB-OS")) + "</span>" +
    '<span class="pg">' + esc(o.footR || "") + "</span></div></div>";
}

function pills(list) {
  return '<div class="rp-pills">' + (list || []).map(function (p) {
    var t = p.tone || "sky";
    return '<div class="rp-pill">' +
      esc(p.t) + "</div>";
  }).join("") + "</div>";
}

// stat cards. [{big, cap, from, tone, unit}]. `from` is the provenance line.
// A LONG VALUE IN A BIG FONT BREAKS MID-VALUE — "2026-08-22" at 31px wrapped
// to "2026-08-" and "22" across two lines, which reads as a broken date rather
// than a long one. The figure gives way, never the meaning.
function stats(cards) {
  var list = (cards || []).filter(Boolean);
  // PROVENANCE ONCE, NOT FIVE TIMES. Four cards reading "the site's daily
  // report" under four figures is the same sentence printed four times; it
  // stops being provenance and becomes noise. The distinct sources are
  // collected and stated once beneath the band, which is both quieter and
  // more honest — it shows at a glance that this band came from two files.
  // ONE SOURCE, ONE MENTION. Two cards naming "hse.json · 2026-08-10" and
  // "hse.json" are naming the same file at two granularities, and printing
  // both gives "hse.json · 2026-08-10 · hse.json". The more specific one wins.
  var srcs = [];
  list.forEach(function (c) {
    if (!c.from) return;
    var i = srcs.findIndex(function (x) {
      return x === c.from || x.indexOf(c.from) === 0 || c.from.indexOf(x) === 0; });
    if (i < 0) srcs.push(c.from);
    else if (c.from.length > srcs[i].length) srcs[i] = c.from;   // keep the specific one
  });
  var band = '<div class="rp-stats">' + list.map(function (c, i) {
    // COLOUR MARKS A STATE, NOTHING ELSE. A figure tinted because a tint was
    // available tells the reader that tints were available.
    var t = c.tone && c.tone !== "neutral" ? c.tone : null;
    var isWord = c.big != null && isNaN(Number(String(c.big).replace(/[+,%]/g, "")));
    return '<div class="rp-stat' + (i === 0 ? " lead" : "") + '">' +
      "<b" + (isWord ? ' class="word"' : "") +
        (t ? ' style="color:' + cvar(t) + '"' : "") + ">" + val(c.big, c.unit) + "</b>" +
      '<span class="cap">' + esc(c.cap) + "</span></div>";
  }).join("") + "</div>";
  return band + (srcs.length
    ? '<div class="rp-srcline">read from ' + esc(srcs.join(" · ")) + "</div>" : "");
}

function cards(items, cols) {
  return '<div class="rp-cards c' + (cols || 2) + '">' + (items || []).map(function (c) {
    return '<div class="rp-card' + (c.tone === "dark" ? " dark" : "") + '">' +
      (c.head ? "<h3>" + esc(c.head) + "</h3>" : "") +
      (c.body ? "<p>" + esc(c.body) + "</p>" : "") +
      (c.foot ? '<div class="foot">' + esc(c.foot) + "</div>" : "") + "</div>";
  }).join("") + "</div>";
}

// key/value rows. [{k, note, v, tone, from}]
function rows(list) {
  return '<div class="rp-rows">' + (list || []).map(function (r) {
    var t = TONEVAR[String(r.tone || "").toLowerCase()];
    // THE SOURCE WAS RUNNING INTO THE VALUE. .rp-src lost its rule when the
    // stylesheet was rebuilt, so it rendered inline and printed
    // "Designer ceiling 1 to 2%read off the walk" as one word.
    return '<div class="rp-row' + (t === "ok" ? " ok" : t === "bad" ? " bad" :
      t === "warn" ? " warn" : "") + '">' +
      '<div class="k">' + esc(r.k) + (r.note ? "<i>" + esc(r.note) + "</i>" : "") + "</div>" +
      '<div class="v">' + val(r.v, r.unit) +
      (r.from ? '<span class="src">' + esc(r.from) + "</span>" : "") + "</div></div>";
  }).join("") + "</div>";
}

function chip(text, tone) {
  var t = tone || toneOf(text);
  return '<span class="r-chip" style="background:' + cbg(t) + '">' +
    esc(text) + "</span>";
}

// plan against what the camera saw. [{name, note, plan, site, tone, right}]
// A CHART NEVER ADVERTISES A SERIES IT DOES NOT DRAW. Every row here used to
// get a pale "plan" lane whether or not there was a plan, and a legend naming
// it — so a manpower trend, which has no plan lane at all, printed six empty
// bars and a key explaining them. The lane and the legend now appear only
// when at least one row actually carries a plan.
function duals(list, legend) {
  var rows = list || [];
  var hasPlan = rows.some(function (r) { return Number(r.plan) > 0; });
  var body = rows.map(function (r) {
    var t = r.tone || "sky";
    var p = Math.max(0, Math.min(100, Number(r.plan) || 0));
    var v = Math.max(0, Math.min(100, Number(r.site) || 0));
    return '<div class="rp-dual' + (hasPlan ? "" : " solo") + '">' +
      '<div class="nm">' + esc(r.name) + (r.note ? "<i>" + esc(r.note) + "</i>" : "") + "</div>" +
      '<div class="rp-lanes">' +
      (hasPlan ? '<div class="rp-lane plan"><i style="width:' + p + '%"></i></div>' : "") +
      '<div class="rp-lane"><i style="width:' + v + '%;background:' + cvar(t) + '"></i></div>' +
      "</div>" +
      '<div class="rt" style="color:' + cvar(t) + '">' +
      (r.right != null ? esc(String(r.right)) : val(r.site, "%")) + "</div></div>";
  }).join("");
  // THE KEY MATCHES THE CHART. The "what was there" swatch was hardcoded blue
  // while the bars beside it were drawn in the tone each row carries — so a
  // chart of gold bars was explained by a blue dot, which is a key that is
  // simply wrong. It takes the colour the rows actually use.
  var tally = {};
  rows.forEach(function (r) { var t = r.tone || "sky"; tally[t] = (tally[t] || 0) + 1; });
  var main = Object.keys(tally).sort(function (a, b) { return tally[b] - tally[a]; })[0] || "sky";
  var leg = (legend === false || !hasPlan) ? "" :
    '<div class="rp-legend"><span><i class="plan"></i>the programme asks for</span>' +
    '<span><i class="site" style="background:' + cvar(main) + '"></i>what was there</span></div>';
  return '<div class="rp-duals">' + body + leg + "</div>";
}

// headers: ["a", {t:"b", n:true}]. rows: array of arrays; a cell may be
// {t, tone, b} for a chip, bold or tinted cell.
function table(headers, list) {
  var th = (headers || []).map(function (h) {
    var o = typeof h === "string" ? { t: h } : h;
    return '<th' + (o.n ? ' class="n"' : "") + ">" + esc(o.t) + "</th>";
  }).join("");
  var tr = (list || []).map(function (r) {
    return "<tr>" + (r || []).map(function (c) {
      var o = (c && typeof c === "object") ? c : { t: c };
      var inner = o.chip ? chip(String(o.t), o.tone)
        // {bar: 0..100} draws the figure as a proportion as well as a number
        : o.bar != null ? '<div class="rp-bar"><div class="tr"><i style="width:' +
            Math.max(0, Math.min(100, Number(o.bar) || 0)) + '%"></i></div>' +
            '<span class="n">' + val(o.t, o.unit) + "</span></div>"
        : o.b ? "<b>" + val(o.t, o.unit) + "</b>" : val(o.t, o.unit);
      return '<td' + (o.n ? ' class="n"' : "") +
        (o.tone && !o.chip ? ' style="color:' + cvar(o.tone) + '"' : "") + ">" +
        inner + (o.note ? '<div style="font-size:10.6px;color:var(--faint)">' + esc(o.note) + "</div>" : "") +
        "</td>";
    }).join("") + "</tr>";
  }).join("");
  return "<table class=\"rp-tbl\"><tr>" + th + "</tr>" + tr + "</table>";
}

// photographs. [{src, head, note}] — nothing is published that nobody shot.
// Two per band. More than two is a contact sheet, not a report page.
function shots(list) {
  var n = (list || []).slice(0, 2);
  return '<div class="rp-shots' + (n.length === 1 ? " one" : "") + '">' + n.map(function (s) {
    return '<div class="rp-shot">' +
      (s.src ? '<img src="' + esc(s.src) + '" alt="">' : '<div style="height:186px;background:#EFEDE7"></div>') +
      '<div class="cap"><b>' + esc(s.head || "") + "</b>" +
      (s.note ? "<span>" + esc(s.note) + "</span>" : "") + "</div></div>";
  }).join("") + "</div>";
}

// THE READING BEHIND A SECTION. A figure off a half walked round is a
// different figure, and the report says so rather than the reader guessing.
function reading(o) {
  o = o || {};
  var bits = [];
  if (o.day) bits.push("<b>read on</b> " + esc(o.day));
  if (o.walked != null && o.total != null)
    bits.push("<b>" + esc(o.walked) + " of " + esc(o.total) + "</b> pins");
  if (o.confidence) bits.push("<b>" + esc(o.confidence) + "</b> confidence");
  if (o.from) bits.push("from " + esc(o.from));
  if (o.note) bits.push(esc(o.note));
  return bits.length ? '<div class="rp-read">' + bits.join("<span>·</span>") + "</div>" : "";
}

// WHAT THIS REPORT COULD NOT SAY. A component, never an omission.
function couldNotSay(list, head) {
  if (!list || !list.length) return "";
  return '<div class="rp-gap"><h4>' + esc(head || "What this report could not say") + "</h4><ul>" +
    list.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
}

function sectionHead(t, note) {
  return (t ? '<div class="rp-sh">' + esc(t) + "</div>" : "") +
    (note ? '<div class="rp-note">' + esc(note) + "</div>" : "");
}


// ---- the brand ------------------------------------------------------
// NO LOGO FILE EXISTS ON THIS PROJECT, so the name is set as a wordmark
// rather than guessed at. Set BRAND.logo to a data URI and every page picks
// up the artwork instead; nothing else changes.
var BRAND = { name: "FLIPSPACES", line: "DESIGN · SUPPLY · BUILD", logo: null };

// A HEADLINE MAY CARRY ONE GOLD PHRASE. Wrap it in *asterisks* in the text
// and it is set in the accent — one emphasis per headline, never two.
function headline(t) {
  return esc(String(t == null ? "" : t)).replace(/\*([^*]+)\*/, "<em>$1</em>");
}

// ---- a content page -------------------------------------------------
// o.no + o.eyebrow give the numbered section marker and its gold rule.

// ---- the cover ------------------------------------------------------
// Dark navy, a faint grid, a gold kicker, a two weight headline and a gold
// rule. o.hero swaps the grid for a photograph under the same scrim.
function cover(o) {
  o = o || {};
  var figs = (o.figures || []).map(function (f) {
    return '<div class="rp-pill">' + esc(f.cap) + " " +
      "<b style=\"color:#fff\">" + val(f.big, f.unit) + "</b></div>"; }).join("");
  return '<div class="rpage rp-cover">' +
    (o.hero ? '<div class="rp-hero"><img src="' + esc(o.hero) + '" alt="">' +
              '<div class="scrim"></div></div>'
            : '<div class="rp-grid"></div><div class="rp-glow"></div>') +
    '<div class="rp-covtop"><span>' + esc(BRAND.name) + "</span>" +
      '<span class="r">' + esc(o.tag || BRAND.line) + "</span></div>" +
    '<div class="rp-in">' +
      (o.kick ? '<div class="rp-kick">' + esc(o.kick) + "</div>" : "") +
      "<h1>" + esc(o.title || "") +
        (o.title2 ? '<span class="thin">' + esc(o.title2) + "</span>" : "") + "</h1>" +
      '<div class="rp-covrule"></div>' +
      (o.intro ? "<p>" + esc(o.intro) + "</p>" : "") +
      (figs ? '<div class="rp-pills">' + figs + "</div>" : "") +
    "</div>" +
    '<div class="rp-foot"><span>' + esc(o.footL || "") + "</span>" +
    '<span class="gold">' + esc(o.footR || "") + "</span></div></div>";
}

// ---- stat cards -----------------------------------------------------
function stats(cards) {
  var list = (cards || []).filter(Boolean);
  // ONE SOURCE, ONE MENTION — the same file named at two granularities is
  // one source, and printing both gives "hse.json · 10 Aug · hse.json".
  var srcs = [];
  list.forEach(function (c) {
    if (!c.from) return;
    var i = -1;
    srcs.forEach(function (x, k) {
      if (x === c.from || x.indexOf(c.from) === 0 || c.from.indexOf(x) === 0) i = k; });
    if (i < 0) srcs.push(c.from);
    else if (c.from.length > srcs[i].length) srcs[i] = c.from;
  });
  var band = '<div class="rp-stats">' + list.map(function (c) {
    var t = c.tone && c.tone !== "neutral" ? c.tone : null;
    var isWord = c.big != null && isNaN(Number(String(c.big).replace(/[+,%]/g, "")));
    return '<div class="rp-stat">' +
      "<b" + (isWord ? ' class="word"' : "") +
      (t ? ' style="color:var(--' + (t === "rose" ? "bad" : t === "sage" ? "ok" :
        t === "sand" ? "warn" : "n") + ')"' : "") + ">" +
      esc(String(c.big == null ? "" : c.big)) +
      (c.unit ? '<span class="u">' + esc(c.unit) + "</span>" : "") + "</b>" +
      '<span class="cap">' + esc(c.cap) + "</span></div>";
  }).join("") + "</div>";
  return band + (srcs.length ? '<div class="rp-srcline">read from ' +
    esc(srcs.join(" · ")) + "</div>" : "");
}

// ---- the spec list: label left, value right --------------------------
// The right hand column of the reference deck. Rows of fact against value,
// separated by hairlines, value in bold navy.
function specs(list) {
  return '<div class="rp-specs">' + (list || []).filter(Boolean).map(function (r) {
    var t = r.tone === "bad" ? " bad" : r.tone === "ok" ? " ok"
          : (r.tone === "warn" || r.tone === "sand") ? " warn" : "";
    return '<div class="rp-spec"><div class="k">' + esc(r.k) +
      (r.note ? "<i>" + esc(r.note) + "</i>" : "") + "</div>" +
      '<div class="v' + t + '">' + val(r.v, r.unit) +
      (r.chip ? " " + chip(r.chip, r.chipTone) : "") + "</div></div>";
  }).join("") + "</div>";
}

// two columns, the reference deck's most used layout
function twoCol(left, right, wideLeft) {
  return '<div class="rp-two' + (wideLeft ? " wide-l" : "") + '"><div>' + (left || "") +
    "</div><div>" + (right || "") + "</div></div>";
}
function panel(inner) { return '<div class="rp-panel">' + (inner || "") + "</div>"; }




// ---- the floor, as the survey placed it -----------------------------
// EIGHTY ONE CAMERA POSITIONS ON A PLATE, coloured by what each one shows.
// This is NOT a floor plan and must never look like one: there is no wall
// data anywhere on this project, so nothing is drawn that would imply a
// room boundary. What it is, honestly, is where the survey put each camera
// and what that camera saw — which is the most a reader can be told.
//
// A pin's size is the floor it answers for. Pin 12 stands in a 23 sqft
// phone booth and pin 1 in 3,187 sqft of open plan; drawing them the same
// size says they carry the same weight, and they do not.
function plan(pins, o) {
  o = o || {};
  var list = (pins || []).filter(function (p) { return p && p.x != null && p.y != null; });
  if (!list.length) return "";
  var W = 1096, aspect = o.aspect || 4.6, H = Math.round(W / aspect);
  var PAD = 18;

  // ---- BANDED AGAINST THIS WALK, NOT AGAINST A FINISHED BUILDING -------
  // Fixed bands at 45 and 70 put all eighty one pins in one bucket on a floor
  // that reads 3 to 24 per cent, and a plate of one colour says nothing at
  // all. The cut points are the quartiles of what was actually read, and the
  // legend prints them — so the top band means FURTHEST ON, never finished.
  var got = list.map(function (p) { return p.pct; })
    .filter(function (v) { return v != null; }).sort(function (a, b) { return a - b; });
  var q = function (f) { return got.length ? got[Math.floor(f * (got.length - 1))] : 0; };
  var c1 = q(0.25), c2 = q(0.5), c3 = q(0.75);
  var col = function (p) { return p.pct == null ? "var(--muted)"
    : p.pct >= c3 ? "var(--ok)" : p.pct >= c2 ? "var(--n3)"
    : p.pct >= c1 ? "var(--warn)" : "var(--bad)"; };

  var sq = list.map(function (p) { return Math.sqrt(Math.max(1, p.sqft || 1)); });
  var loSq = Math.min.apply(null, sq), hiSq = Math.max.apply(null, sq);
  var rOf = function (p) { var v = Math.sqrt(Math.max(1, p.sqft || 1));
    return 4 + (hiSq > loSq ? (v - loSq) / (hiSq - loSq) : 0) * 10; };
  var X = function (p) { return PAD + p.x * (W - PAD * 2); };
  var Y = function (p) { return PAD + p.y * (H - PAD * 2); };

  // the biggest spaces get a name, and a name is dropped rather than printed
  // on top of another one — an unreadable label is worse than none
  var placed = [], labels = [];
  list.slice().sort(function (a, b) { return (b.sqft || 0) - (a.sqft || 0); })
    .forEach(function (p) {
      var n = p.space || p.area;
      // AN UNNAMED SPACE HAS NO NAME TO PRINT. "Unnamed Space 24" on a plate
      // is the engine's placeholder leaking onto a client page.
      if (!n || /^unnamed/i.test(n) || labels.length >= (o.labels || 8)) return;
      if (labels.some(function (l) { return l.n === n; })) return;
      var x = X(p), y = Y(p) - rOf(p) - 9;
      if (placed.some(function (q2) { return Math.abs(q2.x - x) < 130 && Math.abs(q2.y - y) < 16; }))
        return;
      placed.push({ x: x, y: y });
      labels.push({ n: n, x: x, y: y });
    });

  var dots = list.map(function (p) {
    var r = rOf(p), x = X(p), y = Y(p), c = col(p);
    var aim = (p.aim && (p.aim.dx || p.aim.dy))
      ? '<line x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' +
        (x + p.aim.dx * 42).toFixed(1) + '" y2="' + (y + p.aim.dy * 42).toFixed(1) +
        '" stroke="' + c + '" stroke-width="1.1" opacity=".38"/>' : "";
    return aim +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (r + 3.5).toFixed(1) +
        '" fill="' + c + '" opacity=".15"/>' +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) +
        '" fill="' + c + '"/>' +
      (r > 8 ? '<text x="' + x.toFixed(1) + '" y="' + (y + 3).toFixed(1) +
        '" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">' + p.no + "</text>" : "");
  }).join("");

  // a label reads over the dots because it is painted with a halo
  var names = labels.map(function (l) {
    return '<text x="' + l.x.toFixed(1) + '" y="' + l.y.toFixed(1) +
      '" text-anchor="middle" font-size="10" fill="var(--n)" font-weight="600"' +
      ' stroke="#fff" stroke-width="3" paint-order="stroke" opacity=".9">' +
      esc(String(l.n).slice(0, 28)) + "</text>"; }).join("");

  var key = '<div class="rp-plankey">' +
    '<span><i style="background:var(--ok)"></i>furthest on · ' + c3 + "% and above</span>" +
    '<span><i style="background:var(--n3)"></i>' + c2 + " to " + c3 + "%</span>" +
    '<span><i style="background:var(--warn)"></i>' + c1 + " to " + c2 + "%</span>" +
    '<span><i style="background:var(--bad)"></i>furthest behind · under ' + c1 + "%</span>" +
    "</div>";

  // THE PLATE IS SHORT — this floor is four and a half times as wide as it is
  // deep, so it uses a third of the page. The rest goes to the spaces the
  // plate cannot label: the largest rooms, what each reads, and how much floor
  // each answers for.
  var rank = "";
  if ((o.spaces || []).length) {
    var top = o.spaces.slice().sort(function (a, b) { return (b.sqft || 0) - (a.sqft || 0); })
      .slice(0, 6);
    var hi = Math.max.apply(null, top.map(function (x) { return x.pct || 0; })) || 1;
    rank = '<div class="rp-planrank">' + top.map(function (x) {
      var c = x.pct == null ? "var(--muted)" : x.pct >= c3 ? "var(--ok)"
        : x.pct >= c2 ? "var(--n3)" : x.pct >= c1 ? "var(--warn)" : "var(--bad)";
      return '<div class="rk"><div class="nm">' + esc(String(x.name).slice(0, 30)) +
        '<i>' + (x.sqft ? Math.round(x.sqft).toLocaleString("en-IN") + " sqft · " : "") +
        (x.pins ? x.pins + " position" + (x.pins === 1 ? "" : "s") : "") + "</i></div>" +
        '<div class="tr"><i style="width:' + Math.round((x.pct || 0) / hi * 100) +
        '%;background:' + c + '"></i></div>' +
        '<div class="pc" style="color:' + c + '">' + (x.pct == null ? "—" : x.pct + "%") +
        "</div></div>"; }).join("") + "</div>";
  }

  return '<div class="rp-plan"><svg viewBox="0 0 ' + W + " " + H + '" role="img">' +
    '<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) +
      '" fill="#fff" stroke="var(--rule)" rx="6"/>' + dots + names + "</svg>" + key +
    rank +
    '<div class="rp-plannote">' + esc(o.note ||
      "The coordinates are the survey's own, normalised onto a plate — this places the cameras " +
      "and what each one saw. It is not a floor plan: no wall is drawn because none is recorded. " +
      "A pin is sized by the floor it answers for, and the bands are quarters of this walk's own " +
      "readings, so the top band means furthest on and never finished.") + "</div></div>";
}



// ---- the cash curve -------------------------------------------------
// TWO CURVES AND THE GAP BETWEEN THEM. What the contract said would be
// earned by now, against what the walk says has been. The RA stages sit on
// the same axis as ticks, because a stage that fell due and was never raised
// is the whole point of the chart and belongs where the reader is looking.
function curve(o) {
  o = o || {};
  var pts = (o.points || []).filter(function (p) { return p && p.x != null; });
  if (pts.length < 2) return "";
  var W = 1096, H = 300, L = 74, Rr = 26, Tp = 18, B = 40;
  var vals = [];
  pts.forEach(function (p) { ["a", "b", "lo", "hi"].forEach(function (k) {
    if (p[k] != null) vals.push(Number(p[k]) || 0); }); });
  var hi = Math.max.apply(null, vals) || 1;
  var X = function (i) { return L + i / (pts.length - 1) * (W - L - Rr); };
  var Y = function (v) { return Tp + (1 - (Number(v) || 0) / hi) * (H - Tp - B); };

  // a series is drawn only where it has values, so a forecast starts where
  // the actual stops rather than being invented backwards from nothing
  var seg = function (key) {
    var out = [];
    pts.forEach(function (p, i) { if (p[key] != null) out.push([X(i), Y(p[key])]); });
    return out; };
  var poly = function (key, col, w, dash) {
    var pl = seg(key); if (pl.length < 2) return "";
    return '<polyline fill="none" stroke="' + col + '" stroke-width="' + (w || 2.6) +
      '" stroke-linejoin="round" stroke-linecap="round"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' points="' +
      pl.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ") + '"/>'; };

  // ---- THE RANGE BETWEEN TWO FORECASTS --------------------------------
  // A single forecast line claims a precision nobody has. Two do not: the
  // lower is what the rate actually observed would deliver, the upper is what
  // the programme's own remaining shape would, and the truth is somewhere in
  // the band. Both are dashed so neither can be mistaken for a reading.
  var band = "";
  var lo = seg("lo"), hiS = seg("hi");
  if (lo.length > 1 && hiS.length > 1) {
    band = '<polygon fill="var(--warn)" opacity=".10" points="' +
      hiS.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ") + " " +
      lo.slice().reverse().map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); })
        .join(" ") + '"/>';
  }

  var area = (function () { var pl = seg("b"); if (pl.length < 2) return "";
    return '<polygon fill="var(--n3)" opacity=".10" points="' + pl[0][0].toFixed(1) + "," +
      Y(0).toFixed(1) + " " +
      pl.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ") + " " +
      pl[pl.length - 1][0].toFixed(1) + "," + Y(0).toFixed(1) + '"/>'; })();

  var grid = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
    var y = Y(hi * f);
    return '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - Rr) + '" y2="' +
      y.toFixed(1) + '" stroke="var(--hair)" stroke-width="1"/>' +
      '<text x="' + (L - 10) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end"' +
      ' font-size="10.5" fill="var(--faint)">' + esc(o.fmt ? o.fmt(hi * f) : Math.round(hi * f)) +
      "</text>"; }).join("");
  var every = pts.length > 10 ? Math.ceil(pts.length / 9) : 1;
  var xlab = pts.map(function (p, i) {
    if (i % every && i !== pts.length - 1) return "";
    return '<text x="' + X(i).toFixed(1) + '" y="' + (H - 18) + '" text-anchor="middle"' +
      ' font-size="10.5" fill="var(--muted)">' + esc(p.x) + "</text>"; }).join("");
  var dots = (function () { var pl = seg("b");
    return pl.map(function (q) { return '<circle cx="' + q[0].toFixed(1) + '" cy="' +
      q[1].toFixed(1) + '" r="3.6" fill="var(--n3)"/>'; }).join(""); })();

  var byX = {};
  (o.marks || []).forEach(function (m) {
    var i = pts.findIndex(function (p) { return p.x === m.x; });
    if (i < 0) return;
    if (!byX[i]) byX[i] = { i: i, labels: [], bad: false };
    byX[i].labels.push(m.label);
    if (m.tone === "bad") byX[i].bad = true; });
  var marks = Object.keys(byX).map(function (k) {
    var g = byX[k], m = { label: g.labels.join(" · "), tone: g.bad ? "bad" : null };
    var x = X(g.i), c = m.tone === "bad" ? "var(--bad)" : "var(--gold)";
    return '<line x1="' + x.toFixed(1) + '" y1="' + Tp + '" x2="' + x.toFixed(1) + '" y2="' +
      (H - B + 6) + '" stroke="' + c + '" stroke-width="1.4" stroke-dasharray="4 4" opacity=".85"/>' +
      '<text x="' + (x > W - 120 ? (x - 5).toFixed(1) : (x + 5).toFixed(1)) + '" y="' + (Tp + 12) +
      '" font-size="10.5" text-anchor="' + (x > W - 120 ? "end" : "start") + '"' +
      ' fill="' + c + '" font-weight="700">' + esc(m.label) + "</text>"; }).join("");

  var key = '<div class="rp-chartkey">' +
    '<span><i style="background:var(--rule)"></i>' + esc(o.aLabel || "planned") + "</span>" +
    '<span><i style="background:var(--n3)"></i>' + esc(o.bLabel || "actual") + "</span>" +
    (lo.length > 1 ? '<span><i style="background:var(--warn);opacity:.55"></i>' +
      esc(o.rangeLabel || "where it goes from here — a range, not a prediction") + "</span>" : "") +
    ((o.marks || []).length ? '<span><i class="dot" style="background:var(--gold)"></i>' +
      esc(o.markLabel || "milestone") + "</span>" : "") + "</div>";

  return '<div class="rp-chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img">' +
    grid + band + area + poly("a", "var(--rule)", 2.4) +
    poly("hi", "var(--warn)", 2, "6 5") + poly("lo", "var(--warn)", 2, "6 5") +
    poly("b", "var(--n3)") + dots + marks + xlab + "</svg>" + key +
    (o.note ? '<div class="rp-chartnote">' + esc(o.note) + "</div>" : "") + "</div>";
}

// ---- the programme, as a timeline -----------------------------------
// A BAR IS A WINDOW, AND THE FILL IS WHAT THE CAMERA SAW IN IT. The pale bar
// runs from a package's earliest start to its earliest finish; the solid part
// is how much of it is built. Today, the contract date and the date the
// programme actually lands are drawn as lines, because a bar chart without
// today on it is a picture of a plan rather than of a project.
function timeline(rows, o) {
  o = o || {};
  var list = (rows || []).filter(function (r) { return r && r.from && r.to; });
  if (!list.length) return "";
  var W = 1096, RH = 26, L = 232, Rr = 20, Tp = 26;
  var H = Tp + list.length * RH + 34;
  var t0 = Math.min.apply(null, list.map(function (r) { return Date.parse(r.from); }));
  var t1 = Math.max.apply(null, list.map(function (r) { return Date.parse(r.to); }));
  (o.marks || []).forEach(function (m) { var t = Date.parse(m.on);
    if (t < t0) t0 = t; if (t > t1) t1 = t; });
  var span = (t1 - t0) || 1;
  var X = function (d) { return L + (Date.parse(d) - t0) / span * (W - L - Rr); };

  var bars = list.map(function (r, i) {
    var y = Tp + i * RH, x0 = X(r.from), x1 = X(r.to), w = Math.max(3, x1 - x0);
    var pct = Math.max(0, Math.min(100, Number(r.pct) || 0));
    var c = r.tone === "bad" ? "var(--bad)" : r.tone === "warn" ? "var(--warn)"
          : r.tone === "ok" ? "var(--ok)" : "var(--n3)";
    return '<text x="0" y="' + (y + 13) + '" font-size="11.4" fill="var(--n)"' +
      ' font-weight="600">' + esc(String(r.name).slice(0, 32)) + "</text>" +
      '<rect x="' + x0.toFixed(1) + '" y="' + (y + 4) + '" width="' + w.toFixed(1) +
      '" height="13" rx="3" fill="var(--rule)" opacity=".55"/>' +
      '<rect x="' + x0.toFixed(1) + '" y="' + (y + 4) + '" width="' +
      (w * pct / 100).toFixed(1) + '" height="13" rx="3" fill="' + c + '"/>' +
      '<text x="' + (x1 + 7).toFixed(1) + '" y="' + (y + 14) + '" font-size="10.6"' +
      ' fill="' + c + '" font-weight="700">' + pct + "%</text>";
  }).join("");

  var marks = (o.marks || []).map(function (m) {
    var x = X(m.on), c = m.tone === "bad" ? "var(--bad)" : m.tone === "gold" ? "var(--gold)"
      : "var(--n)";
    return '<line x1="' + x.toFixed(1) + '" y1="' + (Tp - 8) + '" x2="' + x.toFixed(1) +
      '" y2="' + (Tp + list.length * RH + 2) + '" stroke="' + c + '" stroke-width="1.5"' +
      ' stroke-dasharray="5 4"/>' +
      // FLIPPED INWARD NEAR THE EDGE. "lands" printed as "lan" because the
      // label ran past the right of the viewBox and was simply cut off.
      '<text x="' + (x > W - 90 ? (x - 5).toFixed(1) : (x + 5).toFixed(1)) + '" y="' + (Tp - 12) +
      '" font-size="10.6" text-anchor="' + (x > W - 90 ? "end" : "start") + '" fill="' + c +
      '" font-weight="700">' + esc(m.label) + "</text>"; }).join("");

  var key = '<div class="rp-chartkey">' +
    '<span><i style="background:var(--rule)"></i>the window the programme gives it</span>' +
    '<span><i style="background:var(--n3)"></i>what the walk can see built</span></div>';
  return '<div class="rp-chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img">' +
    marks + bars + "</svg>" + key +
    (o.note ? '<div class="rp-chartnote">' + esc(o.note) + "</div>" : "") + "</div>";
}

root.RP_DESIGN = {

if (typeof module !== "undefined" && module.exports) module.exports = root.RP_DESIGN;

<script>
(function(){

const N=n=>n==null?"—":Number(n).toLocaleString("en-IN");
// THE CHANNEL. Never Google directly: an Apps Script web app sends no

const CH="/gs";
// Which project's programme this page is showing. ?project= lets the planning

const PE_PROJECT_URL=(new URLSearchParams(location.search).get("project")||"skf-pune-7f")
  .replace(/[^A-Za-z0-9._-]/g,"");
function peProject(){

}

const PE_URL=(new URLSearchParams(location.search).get("pe")||"http://localhost:5173/");
const state={level:"portfolio",view:"intake",F:null,err:null,drive:null,driveErr:null,

             peMode:"pert", peCat:"all", peDepth:"summary", peCollapsed:null, peBars:true,
             peBuyLong:false, peDesignCat:"all", peTodoCat:"all", peTodoDerived:false,
             // the programme, and which day and mode it is showing
             SCH:null,AS:null,asPin:null,asDay:null,MP:null,dprSaid:null,TG:null,replanning:false,replanErr:null,schDay:null,schMode:null,schOpen:null,schZoom:null,schCol1:null,schQ:false,schSum:true,asm:null,asmCat:null,asmSaving:false,basisSaving:false,schDayPicked:null};

// A project the engine actually holds something for. Drive-backed projects

function portfolio(){

    out.push({ id:"skf-pune-7f", name:"SKF India · Pune 7F",
      sub:"Design & build fit-out · Chinchwad, Pune",

      rooms:r?r.rooms.length:null, settled:r?r.settled:null, ask:r?r.ask:null,
      conflicts:state.F.conflicts.length,
      walk:state.walk&&state.walk.days&&state.walk.days[0]||null });
  }
  // Projects the planning engine has planned. A project exists the moment
  // somebody plans it, which is before anyone has walked it or put a document
  // in its folder — so it belongs on this list from that moment, marked for

  // gets authored that the people tracking it cannot see.
  const seenId={}; out.forEach(o=>seenId[o.id]=1);
  ((state.syncProjects)||[]).forEach(p=>{
    if(seenId[p.id]) return;

      source:"planning engine", live:false, planned:true });

  // folders in Drive that the engine has not read yet
  const seen={}; out.forEach(o=>seen[o.name]=1);
  ((state.drive&&state.drive.projects)||[]).forEach(d=>{
    if(seen[d.name]) return;
    out.push({ id:d.id, name:d.name, sub:"a Drive folder the engine has not read yet",
      source:"Drive", live:false, driveId:d.id, updated:d.updated, url:d.url });
  });
  return out;
}

// ---- Drive, through the Apps Script that already runs for this project ----
function gs(params){

}

}
function newProject(name){

function openProject(id){

}

 {id:"intake",n:"0", label:"Inputs", built:true},

 };

       :`<div class="e" style="font-size:11.8px;margin:6px 0">nothing in this document is tied to a particular place — it describes the job as a whole, so it sets no expectation at any one pin</div>`}
     </div>`:""}</div>`;
 };

 const panel=(x)=>{
   const docs=x.docs||[];

     </div>`:""}</div>`;
 };

 return `<h2>Knowledge</h2>
 <p class="sub">Every input read twice — by discipline, the way a floor is bought and built, and by place, which is what a
 camera standing there should see. Open a heading to go down; every line traces to its document, sheet and cell.</p>

 <div class="p"><div class="pb" style="padding:0"><div class="grid">
   <div class="g"><div class="v">${N(F.facts.length)}</div><div class="k">facts held</div></div>

   <div class="g"><div class="v" style="color:var(--warn)">${N(TR.group(F.facts).unsorted.length)}</div><div class="k">lines sorting nowhere</div></div>
   <div class="g"><div class="v">${N(F.conflicts.length)}</div><div class="k">disagreements</div></div>
 </div></div></div>

 <div class="lg" style="padding:6px 0 8px">Static inputs</div>
 ${all.filter(x=>x.group==="static").map(panel).join("")}
 <div class="lg" style="padding:14px 0 8px">Dynamic inputs</div>
 ${all.filter(x=>x.group==="dynamic").map(panel).join("")}`;

// ---------- the floor, drawn ----------
// Drawn from the curated space outlines the pin pack carries . 49 rooms,
// each already named and measured . not from the raw DXF polygons. The raw
// set has 127 outlines including furniture blocks and fixture hatches, and
// drawing those gives a picture nobody recognises as their floor.
// ---------- THE PAIR: WHAT IT SHOULD LOOK LIKE, AND WHAT IT LOOKS LIKE ----
// The render is the only statement anybody made about what this exact view
// holds when the room is finished. The photograph is what the camera saw.
// Side by side and on the same pin they are the whole comparison the engine
// is built to make — every verdict downstream is a machine reading of these
// two pictures, and a person should be able to check it by eye in a second.
//
//   . A DAY THIS PIN WAS NOT WALKED IS OFFERED, BUT NOT SELECTABLE. Hiding
//     it would say the walk was complete. Greying it says the walk missed
//     this pin that day, which is a fact about the walk worth seeing: the
//     31st of July covered one pin out of eighty-one.
//   . THE DATES ARE THIS PIN'S DATES. Pin 44 was shot on days pin 3 was not,
//     so the picker is rebuilt per pin rather than showing the union and
//     then failing to load half of it.
//   . NEITHER BOX EVER GOES BLANK WITHOUT SAYING WHY. A missing render and
//     an unwalked pin are different absences and they read differently.
function pinPair(){
  const S=state.SHOTS;
  if(!S) return `<div class="pb"><div class="e">looking for the pin pack’s pictures…</div></div>`;
  if(!Object.keys(S.renders||{}).length && !Object.keys(S.byPin||{}).length)
    return `<div class="pb"><div class="e">no renders and no walk photographs found under
      <code>13 Site Tracking</code>.</div></div>`;

  const pin=state.selPin, day=state.selDay;
  const days=(S.days||[]);
  const mine=(S.byPin&&S.byPin[pin])||[];        // days THIS pin was walked
  const render=(S.renders||{})[pin]||null;
  const shot=(day&&S.shots&&S.shots[day]&&S.shots[day][pin])||null;
  const space=((state.P&&state.P.pins)||[]).find(p=>p.no===pin);

  const box=(title,src,missing)=>`<div style="flex:1 1 0;min-width:0">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
      <b style="font-size:12.5px">${title}</b></div>
    <div style="aspect-ratio:16/10;background:var(--card2);border:1px solid var(--line);border-radius:9px;
                overflow:hidden;display:flex;align-items:center;justify-content:center">
      ${src?`<img src="/img?p=${encodeURIComponent(src)}" alt="${esc(title)}"
              style="width:100%;height:100%;object-fit:contain;display:block">`
           :`<div class="e" style="border:0;text-align:center;padding:16px">${missing}</div>`}
    </div>
    <div class="src" style="margin-top:5px">${src?esc(src.split("/").pop()):"—"}</div></div>`;

  return `<div class="pb">
    <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:11px">
      <div><div style="font-size:12.5px"><b>Pin ${pin==null?"—":pin}</b>${
        space&&space.space?` <span class="f">· ${esc(space.space)}</span>`:""}</div>
        <div class="src">click any pin on the plan below to change both boxes</div></div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <span class="src">walk date</span>
        <select id="pinDay" style="background:var(--card2);color:var(--fg);border:1px solid var(--line);
          border-radius:7px;padding:6px 9px;font-size:12px;min-width:132px">
          ${days.map(d=>{const has=mine.indexOf(d)!==-1;
            return `<option value="${d}"${d===day?" selected":""}${has?"":" disabled"}
              style="${has?"":"color:var(--fnt)"}">${d}${has?"":"  — not walked"}</option>`;}).join("")}
        </select>
        <span class="c ${mine.length?"ok":"warn"}">${mine.length} of ${days.length} days</span>
      </div>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      ${box("3D render — what finished looks like", render,
        "no render was delivered for this pin")}
      ${box("Site — "+(day||"no date"), shot,
        mine.length?"this pin was not walked on "+esc(day||"this day")
                   :"this pin has never been walked")}
    </div></div>`;
}

// THE DEFAULT HAS TO BE A PIN YOU CAN ACTUALLY COMPARE. Opening on a pin with
// a render and no photograph, or a photograph and no render, shows one empty
// box and teaches nothing — so the first pin offered is the lowest-numbered
// one that has BOTH, on the most recent day anybody walked.
function pinPairDefault(){
  const S=state.SHOTS; if(!S) return;
  // a remembered pin that the pack no longer holds, or a day that pin was not
  // walked, falls back rather than opening on two empty boxes
  if(state.selPin!=null && !S.renders[state.selPin] && !(S.byPin||{})[state.selPin]) state.selPin=null;
  if(state.selDay!=null && (S.days||[]).indexOf(state.selDay)===-1) state.selDay=null;
  if(state.selPin!=null && state.selDay!=null){
    const mine=(S.byPin||{})[state.selPin]||[];
    if(mine.length && mine.indexOf(state.selDay)===-1) state.selDay=mine[mine.length-1];
  }
  const days=(S.days||[]).filter(d=>S.shots&&S.shots[d]&&Object.keys(S.shots[d]).length);
  const latest=days[days.length-1]||null;
  if(state.selDay==null) state.selDay=latest;
  if(state.selPin==null){
    const onDay=Object.keys((S.shots&&S.shots[state.selDay])||{}).map(Number).sort((a,b)=>a-b);
    state.selPin = onDay.find(n=>S.renders[n]) ?? onDay[0]
                ?? Object.keys(S.renders||{}).map(Number).sort((a,b)=>a-b)[0] ?? null;
  }
}

function floorPlan(){
 const P=state.P;
 if(!P||!P.spaces||!P.spaces.length)
   return `<div class="e">No floor outlines yet.</div>`;
 const all=P.spaces.flatMap(s=>s.pts);
 const x0=Math.min(...all.map(p=>p[0])), x1=Math.max(...all.map(p=>p[0]));
 const y0=Math.min(...all.map(p=>p[1])), y1=Math.max(...all.map(p=>p[1]));
 const PAD=1600, W=x1-x0+PAD*2, H=y1-y0+PAD*2;
 const X=x=>(x-x0+PAD), Y=y=>(H-(y-y0+PAD));      // CAD y is up, SVG y is down
 const sel=state.selArea;
 const walk=state.walk&&state.walk.days&&state.walk.days[0];
 const shot={};                                    // pins photographed on TODAY's walk
 (walk&&walk.pinList||[]).forEach(n=>shot[n]=1);
 // PINS THE ENGINE ACTUALLY HOLDS A PHOTOGRAPH FOR, on any day of the walk.
 // "Shot today" answers whether the site went out this morning; this answers
 // whether there is anything to look at at all, which is the question you ask
 // of a plate before clicking a pin. The two are different and both are drawn.
 const S=state.SHOTS, byPin=(S&&S.byPin)||{};
 const has=n=>!!(byPin[n]&&byPin[n].length);

 const rooms=P.spaces.slice().sort((a,b)=>b.area_sqm-a.area_sqm).map(sp=>{
   const on=sel===sp.name;
   const open=sp.type==="open";
   const pts=sp.pts.map(([x,y])=>X(x).toFixed(0)+","+Y(y).toFixed(0)).join(" ");
   // the plate was near-black rooms on near-black; on a white page it is the
   // planning engine's tints — accent for the picked room, a warm neutral for
   // open floor, panel grey for enclosed
   return `<polygon points="${pts}" data-area="${esc(sp.name)}"
     fill="${on?"#dbe8ff":open?"#eef3ea":"#f2f4f8"}"
     stroke="${on?"#0f6fff":open?"#b9cdb0":"#cbd3e0"}" stroke-width="${on?260:150}"
     style="cursor:pointer"><title>${esc(sp.name)} — ${Math.round(sp.area_sqm*10.764)} sqft${sp.guessed?" (outline guessed)":""}</title></polygon>`;
 }).join("");

 const R=760;
 const pins=(P.pins||[]).map(p=>{
   const cx=X(p.x), cy=Y(p.y), on=sel && p.space===sel;
   const done=!!shot[p.no], any=has(p.no);
   // three states, and the ring is what carries the fourth fact: a pin with
   // photographs gets a dark halo, so "there is something here to look at" is
   // legible without reading the legend
   const fill=done?"var(--ok)":any?"var(--acc)":"#c9d1de";
   const days=(byPin[p.no]||[]).length;
   return `<g data-pin="${p.no}" style="cursor:pointer">
     ${any?`<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${(on?R*1.35:R)+280}"
       fill="none" stroke="var(--acc)" stroke-width="110" stroke-opacity=".35"/>`:""}
     <circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${on?R*1.35:R}"
       fill="${fill}" stroke="#ffffff" stroke-width="120"/>
     <text x="${cx.toFixed(0)}" y="${(cy+270).toFixed(0)}" text-anchor="middle"
       font-size="720" fill="${any||done?"#ffffff":"var(--mut)"}" font-weight="600"
       style="pointer-events:none">${p.no}</text>
     <title>pin ${p.no} — ${esc(p.space||"")}${done?" · shot today":""}${
       any?" · "+days+" day"+(days>1?"s":"")+" photographed — click to open the pair":" · no photograph on any day"}</title></g>`;
 }).join("");

 const withPhoto=(P.pins||[]).filter(p=>has(p.no)).length;
 const guessed=P.spaces.filter(s=>s.guessed).length;
 const dot=(c,extra)=>`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:5px;${extra||""}"></span>`;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:9px;display:block">
   ${rooms}${pins}</svg>
   <div style="display:flex;gap:14px;margin-top:9px;font-size:11.3px;color:var(--mut);flex-wrap:wrap;align-items:center">
     <span>${dot("var(--ok)")}shot today</span>
     <span>${dot("var(--acc)","box-shadow:0 0 0 2px rgba(15,111,255,.28)")}has photographs${withPhoto?" ("+withPhoto+")":""}</span>
     <span>${dot("#c9d1de")}never photographed${(P.pins||[]).length-withPhoto?" ("+((P.pins||[]).length-withPhoto)+")":""}</span>
     <span class="f">${P.spaces.length} rooms · ${(P.pins||[]).length} pins${guessed?" · "+guessed+" outlines the pack marks as guessed":""}</span>
     ${sel?`<span style="margin-left:auto;color:var(--acc)">${esc(sel)} · <span id="clearSel" style="cursor:pointer;text-decoration:underline">clear</span></span>`:""}
   </div>`;
}

// ---------- the area register ----------

 };
 return `
 <div class="p"><div class="pb" style="padding:0"><div class="grid">

   <div class="g"><div class="v">${c.seenByMoreThanOnePin}</div><div class="k">seen by more than one pin</div></div>
 </div></div></div>

 ${c.unnamed?`<div class="p"><div class="ph"><div><h3>Areas that need a name</h3>
   <p>Nothing can be looked for in a place with no name, so each of these is a blocker with a square footage on it.

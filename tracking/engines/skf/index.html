        ${B.stages.map(s=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:5px 0"><b>${esc(s.key)}</b></td>
          <td class="n f">${s.day}</td>
          <td class="n" style="white-space:nowrap;color:${
            s.due&&!s.raised?"var(--bad)":"var(--fnt)"}">${fmtD(s.dueOn)}${
            s.due&&!s.raised?` <span class="f">${s.lateBy}d</span>`:""}</td>
          <td class="n">${s.pct}%</td>
          <td class="n">${s.value?cr(s.value):"—"}</td>
          <td class="n" style="color:${s.workDone==null?"var(--mut)":
            s.workDone>=70?"var(--ok)":s.workDone>=40?"var(--warn)":"var(--bad)"}">${
            s.workDone==null?"—":s.workDone+"%"}</td>
          <td class="n">${s.raised?cr(s.raised.amount):"—"}</td>
          <td class="n">${s.certified?cr(s.certified.amount):"—"}</td>
          <td class="n">${s.collected?cr(s.collected.amount):"—"}</td>
          <td style="padding-left:12px"><a data-bill="${esc(s.key)}" style="cursor:pointer;color:${
            ST[s.state]||"var(--fg)"}">${esc(s.state)}</a></td></tr>`).join("")}
      </table></div>
  </div>

  <div class="p"><div class="ph"><div><h3>What each stage asks for</h3>
    <p>The milestone is prose; these are the packages this engine could match in it, and what the
    walk sees of each. Anything it could not match is not counted either way.</p></div></div>
    <div class="pb" style="padding:0">${B.stages.filter(s=>s.asks&&s.asks.length).map(s=>`
      <div style="border-top:1px solid var(--line);padding:8px 0">
        <div style="font-size:12.6px"><b>${esc(s.key)}</b>
          <span class="f"> · ${esc(String(s.milestone).slice(0,120))}</span></div>
        <div style="margin-top:5px">${s.asks.map(a=>`<span style="display:inline-block;
          background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;
          margin:0 5px 5px 0;font-size:11.5px">${esc(a.name)}
          <b style="color:${a.seen>=70?"var(--ok)":a.seen>=40?"var(--warn)":"var(--bad)"}">${a.seen}%</b>
          </span>`).join("")}</div>
      </div>`).join("")}</div></div>
  ${billDlg()}`;
}

function billDlg(){
  const B=state.BL, k=state.billOpen; if(!B||!k) return "";
  const s=B.stages.find(x=>x.key===k); if(!s) return "";
  const inp=`background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12.5px;font-family:inherit;width:100%`;
  const pair=(id,label,dv,av)=>`<div style="margin-top:10px">
    <div class="f" style="font-size:11px;margin-bottom:3px">${label}</div>
    <div style="display:flex;gap:8px">
      <input id="bl${id}On" type="date" style="${inp}" value="${dv||""}">
      <input id="bl${id}Amt" placeholder="amount" style="${inp}" value="${av==null?"":av}">
    </div></div>`;
  return `<div class="ovl" id="billovl"><div class="dlg">
    <h3>${esc(s.key)} · ${s.pct}% · ${cr(s.value)}</h3>
    <div class="f" style="font-size:11.4px">due ${fmtD(s.dueOn)} (day ${s.day})${
      s.due?` · <span style="color:var(--bad)">${s.lateBy} days ago</span>`:""}</div>
    <div style="background:var(--card2);border:1px solid var(--line);border-radius:9px;
      padding:9px 11px;margin-top:10px">
      <div class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase">what releases it</div>
      <div style="font-size:12px;color:var(--fnt);margin-top:3px">${esc(s.trigger)}</div>
      <div style="font-size:12px;color:var(--fnt);margin-top:6px">${esc(s.milestone)}</div>
      ${s.workDone!=null?`<div style="font-size:12.5px;margin-top:7px">The walk sees
        <b style="color:${s.workDone>=70?"var(--ok)":"var(--bad)"}">${s.workDone}%</b> of the
        ${s.matched} packages this milestone names.</div>`:""}
    </div>
    ${pair("R","Raised",s.raised&&s.raised.on,s.raised&&s.raised.amount)}
    ${pair("C","Certified",s.certified&&s.certified.on,s.certified&&s.certified.amount)}
    ${pair("P","Collected",s.collected&&s.collected.on,s.collected&&s.collected.amount)}
    <div class="f" style="font-size:11.2px;margin-top:6px">A bill cannot be certified before it was
      raised, and money cannot be collected against a bill nobody certified.</div>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
      <button class="opt" id="blSave" style="width:auto;margin:0;padding:8px 16px"><b>Save</b></button>
      ${s.raised||s.certified||s.collected?`<a id="blClear" class="f" style="cursor:pointer;font-size:12px">clear</a>`:""}
      <a id="blClose" class="f" style="margin-left:auto;cursor:pointer;font-size:12px">close</a>
    </div>
    ${state.billSaid?`<div class="f" style="font-size:11.4px;margin-top:8px;color:var(--bad)">${esc(state.billSaid)}</div>`:""}
  </div></div>`;
}

// ---------- STEP 19 : WHAT HAS TO BE HANDED OVER ----------
// The last folder anybody opens and the first thing that holds up the last
// payment. Some of it the engine can already supply; none of that is a
// document, and the item stays open until somebody files one.
function vDoss(){
  const X=state.DS;
  if(!X) return miss("Handover","dossier.json","node tools/dossier.js");
  const C=X.counts;
  const KIND={document:"var(--acc)",compliance:"var(--warn)",handover:"var(--ok)",billing:"var(--bad)"};
  const kinds=[...new Set(X.rows.map(r=>r.kind))];
  return `<h2>Handover</h2>
  <p class="sub">Everything the contract wants handed over, what this engine can already supply
    toward it, and what a person still has to produce.</p>

  <div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v" style="color:${C.lodged?"var(--fg)":"var(--bad)"}">${C.lodged}</div>
      <div class="k">of ${C.items} lodged — readiness ${C.readiness}%</div></div>
    <div class="g"><div class="v">${C.engineCanHelp}</div>
      <div class="k">the engine can supply toward, ${C.engineCanSupplyWhole} in full</div></div>
    ${X.gates.filter(g=>g.value).map(g=>`<div class="g"><div class="v" style="color:var(--bad)">${
      cr(g.value)}</div><div class="k">${esc(g.name)} — ${g.lodged} of ${g.items} lodged</div></div>`).join("")}
  </div></div></div>

  <div class="p"><div class="ph"><div><h3>What it holds up</h3></div></div>
    <div class="pb" style="padding:0">${X.gates.map(g=>`<div style="border-top:1px solid var(--line);
      padding:8px 0;display:flex;gap:12px;font-size:12.4px">
      <div style="flex:1"><b>${esc(g.name)}</b>${g.value?` <span class="f">${cr(g.value)}</span>`:""}
        <div class="f" style="font-size:11.4px">${esc(g.why)}</div></div>
      <div style="width:230px;text-align:right;color:${g.lodged===g.items?"var(--ok)":"var(--bad)"}">
        ${g.lodged} of ${g.items} lodged
        ${g.open.length?`<div class="f" style="font-size:11px">${esc(g.open.slice(0,3).join(", "))}${
          g.open.length>3?" +"+(g.open.length-3):""}</div>`:""}</div>
    </div>`).join("")}</div></div>

  ${kinds.map(k=>`<div class="p"><div class="ph"><div><h3>${esc(k)}</h3></div></div>
    <div class="pb" style="padding:0">${X.rows.filter(r=>r.kind===k).map(r=>`
      <div style="border-top:1px solid var(--line);padding:9px 0;display:flex;gap:12px">
        <div style="width:3px;border-radius:3px;background:${KIND[r.kind]};flex:none"></div>
        <div style="flex:1">
          <div style="font-size:12.8px"><b>${esc(r.name)}</b>${r.lodged?
            ` <span class="c ok">lodged</span>`:""}</div>
          <div class="f" style="font-size:11.5px;margin-top:2px">${esc(r.wants)}</div>
          ${r.engineHas.length?`<div style="font-size:11.5px;margin-top:4px;color:var(--ok)">
            the engine has ${esc(r.engineHas.map(e=>e.what).join("; "))}</div>`:""}
          <div style="font-size:11.5px;margin-top:3px;color:${r.lodged?"var(--mut)":"var(--warn)"}">
            still needed: ${esc(r.still)}</div>
          ${r.incomplete?`<div style="font-size:11.5px;color:var(--bad)">${esc(r.incompleteWhy)}</div>`:""}
          ${r.filed?`<div class="f" style="font-size:11.3px;margin-top:3px">filed ${fmtD(r.filed.on)}
            by ${esc(r.filed.by)}${r.filed.what?" · "+esc(r.filed.what):""}</div>`:""}
        </div>
        <div style="width:110px;text-align:right;flex:none">
          <a data-doss="${esc(r.key)}" style="cursor:pointer;color:${
            r.lodged?"var(--ok)":"var(--bad)"}">${r.lodged?"change":"file it"}</a></div>
      </div>`).join("")}</div></div>`).join("")}

  <div class="p"><div class="ph"><div><h3>What the engine can supply today</h3>
    <p>None of this is a document. It is the material an as-built, a warranty pack and a
    photographic record are assembled from, and it has been sitting here unused.</p></div></div>
    <div class="pb" style="padding:0">${Object.keys(X.supply).filter(k=>X.supply[k]).map(k=>{
      const s=X.supply[k];
      return `<div style="border-top:1px solid var(--line);padding:6px 0;display:flex;gap:12px;font-size:12.3px">
        <div style="flex:1">${esc(s.what)}</div>
        <div class="f" style="width:190px;text-align:right">${esc(s.from)}</div>
        <div class="f" style="width:250px;text-align:right">${esc(s.covers)}</div></div>`;}).join("")}
    </div></div>
  ${dossDlg()}`;
}

function dossDlg(){
  const X=state.DS, k=state.dossOpen; if(!X||!k) return "";
  const r=X.rows.find(x=>x.key===k); if(!r) return "";
  const inp=`background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12.5px;font-family:inherit;width:100%`;
  return `<div class="ovl" id="dossovl"><div class="dlg">
    <h3>${esc(r.name)}</h3>
    <div class="f" style="font-size:11.4px">${esc(r.wants)}</div>
    ${r.engineHas.length?`<div style="background:var(--card2);border:1px solid var(--ok-soft);
      border-radius:9px;padding:9px 11px;margin-top:10px">
      <div style="color:var(--ok);font-size:10.6px;letter-spacing:.04em;text-transform:uppercase">the engine has</div>
      ${r.engineHas.map(e=>`<div style="font-size:12px;margin-top:3px">${esc(e.what)}
        <div class="f" style="font-size:11.2px">${esc(e.from)} — covers ${esc(e.covers)}</div></div>`).join("")}
      <div style="font-size:12px;color:var(--warn);margin-top:6px">Still needed: ${esc(r.still)}</div>
    </div>`:`<div style="background:var(--card2);border:1px solid var(--line);border-radius:9px;
      padding:9px 11px;margin-top:10px"><div style="font-size:12px;color:var(--warn)">
      Nothing on this engine helps with this one. Still needed: ${esc(r.still)}</div></div>`}
    ${r.gates.length?`<div class="f" style="font-size:11.4px;margin-top:8px">Holds up ${
      esc(r.gates.join(", "))}.</div>`:""}
    <div style="display:flex;gap:8px;margin-top:12px">
      <div style="flex:1"><div class="f" style="font-size:11px;margin-bottom:3px">Filed on</div>
        <input id="dsOn" type="date" style="${inp}" value="${r.filed?r.filed.on:""}"></div>
      <div style="flex:1"><div class="f" style="font-size:11px;margin-bottom:3px">By whom</div>
        <input id="dsBy" style="${inp}" value="${r.filed?esc(r.filed.by):""}"></div>
    </div>
    <div style="margin-top:9px"><div class="f" style="font-size:11px;margin-bottom:3px">What was filed</div>
      <input id="dsWhat" style="${inp}" value="${r.filed&&r.filed.what?esc(r.filed.what):""}"
        placeholder="the document, and where it lives"></div>
    <div class="f" style="font-size:11.2px;margin-top:6px">A document is lodged on a date, by
      somebody. Both are needed — this register counts what is lodged, never what could be supplied.</div>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
      <button class="opt" id="dsSave" style="width:auto;margin:0;padding:8px 16px"><b>Lodge it</b></button>
      ${r.filed?`<a id="dsClear" class="f" style="cursor:pointer;font-size:12px">clear</a>`:""}
      <a id="dsClose" class="f" style="margin-left:auto;cursor:pointer;font-size:12px">close</a>
    </div>
    ${state.dossSaid?`<div class="f" style="font-size:11.4px;margin-top:8px;color:var(--bad)">${esc(state.dossSaid)}</div>`:""}
  </div></div>`;
}

// ---------- STEP 20 : THE RENDER BESIDE THE PHOTOGRAPH ----------
// Every progress figure this engine publishes comes from one comparison,
// and the two pictures behind it have never been shown together.
function vPair(){
  const X=state.PA;
  if(!X) return miss("Render vs photo","pairs.json","node tools/pairs.js");
  const C=X.counts;
  const list=X.pins.filter(p=>p.render&&p.photo);
  if(state.pairPin==null||!list.some(p=>p.pin===state.pairPin))
    state.pairPin=(X.worst[0]&&X.worst[0].pin)||list[0].pin;
  const P=X.pins.find(p=>p.pin===state.pairPin);
  const day=state.pairDay&&P.photoDays.indexOf(state.pairDay)>=0?state.pairDay:P.photo.day;
  const img=(rel)=>X.imgBase+encodeURIComponent(rel);
  const shot=P.photoDays.indexOf(day)>=0
    ? P.photo.rel.replace(/\d{4}-\d{2}-\d{2}/g,day) : P.photo.rel;

  return `<h2>Render vs photo</h2>
  <p class="sub">${C.paired} of ${C.pins} pins have both a render and a photograph. What the room
    was approved to become, beside what stood there on the day — the comparison every progress
    figure on this engine is built from.</p>

  ${C.noRender.length?`<div class="p"><div class="pb"><div class="e" style="border:0;padding:0;color:var(--warn)">
    Pins ${C.noRender.join(", ")} have no render. They are photographed and can never be scored,
    because there is no approved finished state to read them against.</div></div></div>`:""}

  <div class="p"><div class="ph"><div><h3>Pin ${P.pin} · ${esc(P.area||"")}</h3>
    <p>${P.counts.agree} of ${P.counts.judged} judgements agree · ${P.counts.missing} the render
      asks for and the camera did not find${P.counts.hidden?` · ${P.counts.hidden} the finished
      room hides`:""}${P.pct!=null?` · read at ${P.pct}%`:""}</p></div>
    <div style="white-space:nowrap">
      <select id="pairPin" style="background:var(--card2);color:var(--fg);border:1px solid var(--line);
        border-radius:8px;padding:6px 9px;font-size:12px;font-family:inherit">
        ${list.map(p=>`<option value="${p.pin}"${p.pin===P.pin?" selected":""}>Pin ${p.pin} · ${
          esc(String(p.area||"").slice(0,26))}</option>`).join("")}
      </select></div></div>
    <div class="pb" style="padding:0">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:300px">
          <div class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase;
            padding:0 0 5px">approved render${P.render.room?" · "+esc(P.render.room):""}</div>
          <img src="${img(P.render.rel)}" style="width:100%;border-radius:9px;display:block;
            border:1px solid var(--line)" alt="render of pin ${P.pin}">
        </div>
        <div style="flex:1;min-width:300px">
          <div class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase;
            padding:0 0 5px">the walk, ${fmtD(day)}</div>
          <img src="${img(shot)}" style="width:100%;border-radius:9px;display:block;
            border:1px solid var(--line)" alt="photograph of pin ${P.pin}">
        </div>
      </div>
      <div style="padding:9px 0 0">${P.photoDays.map(d=>`<button class="opt" data-pairday="${d}"
        style="width:auto;display:inline-block;margin:0 5px 5px 0;padding:3px 9px;font-size:11px;${
        d===day?"border-color:var(--acc)":""}">${fmtD(d)}</button>`).join("")}</div>
    </div>
  </div>

  <div class="p"><div class="pb" style="padding:0;display:flex;gap:10px;flex-wrap:wrap">
    <div style="flex:1;min-width:280px">
      <div class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase;padding:8px 0 4px">
        the render asks for it and the camera did not find it</div>
      ${P.notBuilt.length?P.notBuilt.map(x=>`<div style="border-top:1px solid var(--line);padding:6px 0;
        font-size:12.3px"><span style="color:var(--bad)">${esc(x.what)}</span>
        ${x.why?`<div class="f" style="font-size:11.2px">${esc(x.why)}</div>`:""}</div>`).join("")
        :`<div class="f" style="padding:6px 0">nothing — the room matches what was approved</div>`}
    </div>
    <div style="flex:1;min-width:280px">
      <div class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase;padding:8px 0 4px">
        the finished room hides these, so the walk decides</div>
      ${P.behindTheCeiling.length?P.behindTheCeiling.map(x=>`<div style="border-top:1px solid var(--line);
        padding:6px 0;font-size:12.3px;color:var(--mut)">${esc(x)}</div>`).join("")
        :`<div class="f" style="padding:6px 0">none</div>`}
      ${P.unexpected.length?`<div class="f" style="font-size:10.6px;letter-spacing:.04em;
        text-transform:uppercase;padding:12px 0 4px">on site and not on the render</div>
        ${P.unexpected.map(x=>`<div style="border-top:1px solid var(--line);padding:6px 0;
          font-size:12.3px;color:var(--warn)">${esc(x.what)}</div>`).join("")}`:""}
    </div>
  </div></div>

  <div class="p"><div class="ph"><div><h3>Furthest from what was approved</h3>
    <p>Counted by how many things the render asks for that the camera could not find.</p></div></div>
    <div class="pb" style="padding:0">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        ${X.worst.map(w=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:5px 0"><a data-pairgo="${w.pin}" style="cursor:pointer">Pin ${w.pin}</a></td>
          <td>${esc(w.area||"")}</td>
          <td class="n" style="color:var(--bad)">${w.missing} not built</td>
          <td class="n">${w.pct==null?"—":w.pct+"%"}</td>
          <td class="f" style="padding-left:12px">${esc(w.what.slice(0,3).join(", "))}</td></tr>`).join("")}
      </table></div></div>`;
}

// ---------- STEP 21 : THE MEETING REGISTER ----------
// Thirty meeting tabs, each one starting fresh, the same point re-typed
// until somebody forgot it. Here an observation always lands owned and
// dated, and whatever is still open carries itself into the next meeting.
function vMin(){
  const M=state.MN;
  if(!M) return miss("Minutes","minutes.json","node tools/minutes.js");
  const C=M.counts;
  return `<h2>Minutes</h2>
  <p class="sub">Every observation lands as an owned point with a date. Whatever is still open
    carries into the next meeting by itself — nobody re-types one.</p>

  <div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v">${C.meetings}</div><div class="k">meetings on record</div></div>
    <div class="g"><div class="v" style="color:${C.open?"var(--bad)":"var(--ok)"}">${C.open}</div>
      <div class="k">points open${C.overdue?" · "+C.overdue+" past their date":""}</div></div>
    <div class="g"><div class="v">${C.closed}</div>
      <div class="k">decided${C.meanToClose!=null?" · "+C.meanToClose+" days on average":""}</div></div>
    <div class="g"><div class="v" style="color:var(--warn)">${C.carriedMost}</div>
      <div class="k">meetings the oldest open point has survived</div></div>
  </div></div></div>

  ${M.carried.length?`<div class="p"><div class="ph"><div><h3>Carried forward</h3>
    <p>Open at the last meeting, so open at the next one. Not re-typed.</p></div></div>
    <div class="pb" style="padding:0">${M.carried.map(p=>`<div style="border-top:1px solid var(--line);
      padding:8px 0;display:flex;gap:12px;font-size:12.4px">
      <div style="flex:1"><b>${esc(p.text)}</b>
        <div class="f" style="font-size:11.3px">raised ${fmtD(p.raisedOn)} at ${esc(p.raisedAt)}${
          p.carriedThrough?` · carried through ${p.carriedThrough} meeting${p.carriedThrough===1?"":"s"}`:""}${
          p.defaulted.length?` · <span style="color:var(--warn)">${esc(p.defaultedWhy)}</span>`:""}${
          p.absent?` · <span style="color:var(--warn)">owned by somebody who was not in the room</span>`:""}</div></div>
      <div style="width:150px;text-align:right;flex:none">
        <div>${esc(p.owner||p.side)}</div>
        <div class="f" style="font-size:11.3px">${p.overdue?`<span style="color:var(--bad)">${
          fmtD(p.due)} · ${p.lateBy}d</span>`:fmtD(p.due)}</div>
        <a data-decide="${esc(p.id)}" class="f" style="cursor:pointer;font-size:11.3px">decide</a></div>
    </div>`).join("")}</div></div>`:""}

  <div class="p"><div class="ph"><div><h3>The agenda for the next meeting</h3>
    <p>Assembled from the registers that already know what is unresolved and who owns it. Proposed,
    never minuted — nothing here is a point until a meeting happens and somebody takes it.</p></div>
    <div><a id="minNew" class="f" style="cursor:pointer;font-size:12px">hold a meeting</a></div></div>
    <div class="pb" style="padding:0">${M.agenda.map(a=>`<div style="border-top:1px solid var(--line);
      padding:9px 0">
      <div style="font-size:12.7px"><b>${esc(a.heading)}</b>
        <span class="f"> · ${esc(a.owner)}</span></div>
      <div style="font-size:12.3px;margin-top:2px">${esc(a.what)}</div>
      ${(a.detail||[]).length?`<div class="f" style="font-size:11.4px;margin-top:3px">${
        a.detail.slice(0,6).map(d=>esc(String(d))).join(" · ")}</div>`:""}
    </div>`).join("")}</div></div>

  <div class="p"><div class="ph"><div><h3>Who owns something open</h3>
    <p>Read off the registers, so the invitation list is not a memory test.</p></div></div>
    <div class="pb" style="padding:0">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        ${M.room.map(r=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:5px 0">${esc(r.who)}</td>
          <td class="n">${r.items} open</td>
          <td class="n" style="color:${r.blocking?"var(--bad)":"var(--mut)"}">${
            r.blocking?r.blocking+" blocking":"—"}</td></tr>`).join("")}
      </table></div></div>

  ${M.meetings.length?`<div class="p"><div class="ph"><div><h3>Meetings held</h3></div></div>
    <div class="pb" style="padding:0">${M.meetings.slice().reverse().map(mt=>`
      <div style="border-top:1px solid var(--line);padding:8px 0;font-size:12.4px">
        <b>${esc(mt.id)} · ${fmtD(mt.date)}</b>${mt.subject?" · "+esc(mt.subject):""}
        ${!mt.valid?`<span style="color:var(--bad)"> — ${esc(mt.faults.join(", "))}</span>`:""}
        <div class="f" style="font-size:11.4px">in the room: ${esc((mt.room||[]).join(", "))}</div>
        <div style="margin-top:4px">${M.points.filter(p=>p.raisedAt===mt.id).map(p=>`
          <div style="padding:3px 0;color:${p.state==="closed"?"var(--mut)":"var(--fg)"}">
            ${p.no}. ${esc(p.text)}${p.state==="closed"?` <span style="color:var(--ok)">— ${
            esc(p.decision)} (${fmtD(p.closedOn)})</span>`:""}</div>`).join("")}</div>
        <a data-minrm="${esc(mt.id)}" class="f" style="cursor:pointer;font-size:11.3px">remove</a>
      </div>`).join("")}</div></div>`:""}
  ${minDlg()}`;
}

function minDlg(){
  const M=state.MN; if(!M||!state.minOpen) return "";
  const inp=`background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12.5px;font-family:inherit;width:100%`;
  if(state.minOpen==="decide"){
    const p=M.points.find(x=>x.id===state.minDecide); if(!p) return "";
    return `<div class="ovl" id="minovl"><div class="dlg">
      <h3>Decide it</h3>
      <div style="font-size:12.6px;margin-top:4px">${esc(p.text)}</div>
      <div class="f" style="font-size:11.4px">raised ${fmtD(p.raisedOn)} · ${p.age} days old ·
        ${esc(p.owner||p.side)}</div>
      <div style="margin-top:10px"><div class="f" style="font-size:11px;margin-bottom:3px">What was decided</div>
        <textarea id="mnDec" rows="2" style="${inp};resize:vertical"></textarea></div>
      <div style="margin-top:9px"><div class="f" style="font-size:11px;margin-bottom:3px">On</div>
        <input id="mnOn" type="date" style="${inp}" value="${M.today}"></div>
      <div class="f" style="font-size:11.2px;margin-top:6px">A point is closed by a decision, not by
        falling off a list.</div>
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
        <button class="opt" id="mnDecide" style="width:auto;margin:0;padding:8px 16px"><b>Close it</b></button>
        <a id="mnCancel" class="f" style="margin-left:auto;cursor:pointer;font-size:12px">close</a></div>
      ${state.minSaid?`<div class="f" style="font-size:11.4px;margin-top:8px;color:var(--bad)">${esc(state.minSaid)}</div>`:""}
    </div></div>`;
  }
  const n=state.minObs||3;
  return `<div class="ovl" id="minovl"><div class="dlg" style="max-width:640px">
    <h3>Hold a meeting</h3>
    <div style="display:flex;gap:8px;margin-top:8px">
      <div style="width:150px"><div class="f" style="font-size:11px;margin-bottom:3px">Date</div>
        <input id="mnDate" type="date" style="${inp}" value="${M.today}"></div>
      <div style="flex:1"><div class="f" style="font-size:11px;margin-bottom:3px">Subject</div>
        <input id="mnSubj" style="${inp}" placeholder="weekly site review"></div>
    </div>
    <div style="margin-top:9px"><div class="f" style="font-size:11px;margin-bottom:3px">Who was in the room</div>
      <input id="mnRoom" style="${inp}" placeholder="names, separated by commas"></div>
    <div style="margin-top:12px"><div class="f" style="font-size:11px;margin-bottom:3px">
      Observations — each one lands as an owned point with a date</div>
      ${Array.from({length:n},(_,i)=>`<div style="display:flex;gap:6px;margin-bottom:5px">
        <input id="mnT${i}" style="${inp}" placeholder="${i+1}. what was observed">
        <input id="mnO${i}" style="${inp};max-width:130px" placeholder="owner">
        <input id="mnD${i}" type="date" style="${inp};max-width:145px">
      </div>`).join("")}
      <a id="mnMore" class="f" style="cursor:pointer;font-size:11.4px">one more</a></div>
    <div class="f" style="font-size:11.2px;margin-top:8px">An observation with no owner goes to us,
      and one with no date is due in a week. It always lands — a meeting with no observations is an
      attendance list, not minutes.</div>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
      <button class="opt" id="mnSave" style="width:auto;margin:0;padding:8px 16px"><b>Record it</b></button>
      <a id="mnCancel" class="f" style="margin-left:auto;cursor:pointer;font-size:12px">close</a></div>
    ${state.minSaid?`<div class="f" style="font-size:11.4px;margin-top:8px;color:var(--bad)">${esc(state.minSaid)}</div>`:""}
  </div></div>`;
}

// ---------- STEP 22 : THE NEXT FORTNIGHT ----------
// A look-ahead that lists what opens and closes is a calendar. This says
// what each one needs to hold its date, from the registers that know.
function vLook(){
  const L=state.LA;
  if(!L) return miss("Look ahead","lookahead.json","node tools/lookahead.js");
  const C=L.counts;
  const V={"ready":"var(--ok)","starts under a risk":"var(--warn)",
    "cannot start":"var(--bad)","nothing to check it against":"var(--mut)"};
  const K={material:"var(--bad)",sequence:"var(--acc)",drawings:"var(--warn)",
    "front end":"var(--warn)","the work it tests":"var(--bad)",people:"var(--mut)"};

  const card=(r)=>`<div style="border-top:1px solid var(--line);padding:9px 0">
    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <div style="font-size:12.9px"><b>${esc(r.name)}</b>
          <span class="f"> · ${fmtD(r.ES)} → ${fmtD(r.EF)}${r.rooms?" · "+r.rooms+" places":""}</span></div>
        ${r.needs.filter(n=>!n.ok).map(n=>`<div style="font-size:11.8px;margin-top:3px;display:flex;gap:8px">
          <span style="color:${K[n.kind]||"var(--mut)"};min-width:104px">${esc(n.kind)}</span>
          <span style="flex:1">${esc(n.what)}</span>
          ${n.go?`<a data-go2="${esc(n.go)}" class="f" style="cursor:pointer">${esc(n.from.replace(".json",""))}</a>`:""}
        </div>`).join("")}
        ${r.needs.filter(n=>n.ok&&n.severity!=="info").map(n=>`<div style="font-size:11.5px;
          margin-top:2px;color:var(--ok)">${esc(n.kind)} — ${esc(n.what)}</div>`).join("")}
      </div>
      <div style="width:150px;text-align:right;flex:none">
        <div style="color:${V[r.verdict]}">${esc(r.verdict)}</div>
        <div class="f" style="font-size:11.2px">${r.seen==null?"":r.seen+"% built"}</div>
      </div></div></div>`;

  return `<h2>Look ahead</h2>
  <p class="sub">${fmtD(L.today)} to ${fmtD(L.end)}. What opens, what closes, and what each one
    needs to hold its date — read off material, the work before it, the crew, the drawings and the
    front end. Nothing is called ready because its date arrived.</p>

  <div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v">${C.opens}</div><div class="k">open in the fortnight</div></div>
    <div class="g"><div class="v" style="color:${C.blocked?"var(--bad)":"var(--ok)"}">${C.blocked}</div>
      <div class="k">cannot start</div></div>
    <div class="g"><div class="v" style="color:var(--warn)">${C.atRisk}</div>
      <div class="k">start under a risk</div></div>
    <div class="g"><div class="v" style="color:${C.ready?"var(--ok)":"var(--mut)"}">${C.ready}</div>
      <div class="k">ready${C.unchecked?" · "+C.unchecked+" nothing to check":""}</div></div>
  </div></div>
  ${C.blocked?`<div class="pb" style="border-top:1px solid var(--line);padding-top:9px">
    <div class="e" style="border:0;padding:0;color:var(--bad)">${C.blocked} of the ${C.opens}
    packages the programme opens in the next fortnight cannot start on the day it says. Every
    reason below names the register that says so.</div></div>`:""}
  </div>

  ${L.weeks.map(w=>`<div class="p"><div class="ph"><div><h3>Week ${w.week}</h3>
    <p>${fmtD(w.from)} to ${fmtD(w.to)} · ${w.opens.length} open, ${w.closes.length} close</p></div></div>
    <div class="pb" style="padding:0">
      ${w.opens.length?w.opens.map(card).join(""):`<div class="f" style="padding:6px 0">nothing opens this week</div>`}
      ${w.closes.length?`<div style="border-top:1px solid var(--line);padding:9px 0">
        <div class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase">due to close</div>
        <div style="margin-top:4px">${w.closes.map(r=>`<span style="display:inline-block;
          background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;
          margin:0 5px 5px 0;font-size:11.6px">${esc(r.name)}
          <span style="color:${r.seen>=80?"var(--ok)":r.seen>=40?"var(--warn)":"var(--bad)"}">${
            r.seen==null?"":r.seen+"%"}</span></span>`).join("")}</div>
      </div>`:""}
    </div></div>`).join("")}`;
}

// ---------- STEP 23 : WHAT SLIPPED, WHY, AND WHOSE IT IS ----------
// Liquidated damages are 1% of the contract a week. Which side a slip
// belongs to is therefore worth eight lakh a week, and nothing else on this
// engine asks the question.
function vDelay(){
  const D=state.DL;
  if(!D) return miss("Delay and risk","delays.json","node tools/delays.js");
  const P=D.project, C=D.counts;
  const SIDE={client:"var(--warn)",us:"var(--bad)",shared:"var(--acc)",unattributed:"var(--mut)"};
  const show=state.dlSide?D.rows.filter(r=>r.side===state.dlSide):D.rows;
  const tab=(id,t,n)=>`<button class="opt" data-dlside="${id||""}" style="width:auto;display:inline-block;
    margin:0 6px 0 0;padding:4px 11px;font-size:11.5px;${(state.dlSide||"")===(id||"")?"border-color:var(--acc)":""}">
    <b>${t}</b> <span class="f">${n}</span></button>`;

  return `<h2>Delay and risk</h2>
  <p class="sub">A package is behind when what is built trails the share of its own window that has
    gone by 25 points or more. Plan per cent is arithmetic, never an assessment.</p>

  <div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v" style="color:var(--bad)">${P.overDays}</div>
      <div class="k">days over — ${fmtD(P.target)} contracted, lands ${fmtD(P.lands)}</div></div>
    <div class="g"><div class="v" style="color:var(--bad)">${cr(P.ldExposure)}</div>
      <div class="k">liquidated damages at ${P.overWeeks} week${P.overWeeks===1?"":"s"}${
        P.atTheCap?" — AT THE CAP":""}</div></div>
    <div class="g"><div class="v">${cr(P.ldPerWeek)}</div>
      <div class="k">a week, capped at ${cr(P.ldCap)}</div></div>
    <div class="g"><div class="v">${C.behind}</div>
      <div class="k">packages behind · ${cr(C.valueBehind)}</div></div>
  </div></div>
  ${P.ldWhy?`<div class="pb" style="border-top:1px solid var(--line);padding-top:9px">
    <div class="f" style="font-size:11.6px">${esc(P.ldWhy)}</div></div>`:""}
  </div>

  ${D.projectCauses.length?`<div class="p"><div class="ph"><div><h3>True of the whole floor</h3>
    <p>These sit behind every row and belong to none of them. Writing a floor-wide condition against
    each package would say one side caused everything and drown out the cause specific to each.</p></div></div>
    <div class="pb" style="padding:0">${D.projectCauses.map(c=>`<div style="border-top:1px solid var(--line);
      padding:9px 0;display:flex;gap:12px">
      <div style="width:3px;border-radius:3px;background:${SIDE[c.side]};flex:none"></div>
      <div style="flex:1;font-size:12.5px"><b>${esc(c.what)}</b>
        <div class="f" style="font-size:11.5px;margin-top:2px">${esc(c.detail)}</div></div>
      <div style="width:110px;text-align:right;flex:none;color:${SIDE[c.side]}">${esc(c.side)}
        ${c.go?`<div><a data-go2="${esc(c.go)}" class="f" style="cursor:pointer;font-size:11.2px">${
          esc(c.from.replace(".json",""))}</a></div>`:""}</div>
    </div>`).join("")}</div></div>`:""}

  ${Object.keys(D.eot.byGround).length?`<div class="p"><div class="ph"><div>
    <h3>Points at a ground the contract lists</h3>
    <p>${esc(D.eot.caveat)}</p></div></div>
    <div class="pb" style="padding:0">${Object.keys(D.eot.byGround).map(g=>`
      <div style="border-top:1px solid var(--line);padding:9px 0;font-size:12.4px">
        <b>${esc(D.eot.grounds[g].ground)}</b>
        <div class="f" style="font-size:11.5px;margin-top:2px">${D.eot.byGround[g].length}
          package${D.eot.byGround[g].length===1?"":"s"}: ${esc(D.eot.byGround[g].join(", "))}</div>
      </div>`).join("")}
      ${D.eot.text?`<div style="border-top:1px solid var(--line);padding:9px 0" class="f"
        style="font-size:11.4px">${esc(D.eot.text)}</div>`:""}
    </div></div>`:""}

  <div class="p"><div class="ph"><div><h3>Behind</h3></div>
    <div style="white-space:nowrap">${tab(null,"All",C.behind)}${tab("us","Ours",C.ours)}${
      tab("client","Client",C.client)}${tab("shared","Shared",C.shared)}${
      tab("unattributed","No cause on the engine",C.unattributed)}</div></div>
    <div class="pb" style="padding:0">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr class="f" style="font-size:10.4px;letter-spacing:.04em;text-transform:uppercase">
          <td style="padding-bottom:5px">package</td><td class="n">built</td><td class="n">window gone</td>
          <td class="n">gap</td><td class="n">value</td>
          <td style="padding-left:12px">why</td><td class="n">whose</td></tr>
        ${show.slice(0,state.dlAll?999:24).map(r=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:5px 8px 5px 0">${esc(r.name)}
            <div class="f" style="font-size:10.6px">${fmtD(r.ES)} → ${fmtD(r.EF)}${
              r.overdue?` · ${r.lateBy}d past its end`:""}</div></td>
          <td class="n">${r.built}%</td><td class="n">${r.elapsed}%</td>
          <td class="n" style="color:${r.gap>=60?"var(--bad)":"var(--warn)"}">${r.gap}</td>
          <td class="n">${r.value?cr(r.value):"—"}</td>
          <td style="padding-left:12px" class="f">${r.causes.length
            ?r.causes.map(c=>esc(c.what)).join("; ")
            :`<span style="color:var(--mut)">no cause specific to this package on the engine</span>`}</td>
          <td class="n" style="color:${SIDE[r.side]}">${esc(r.side)}</td></tr>`).join("")}
      </table></div>
    ${show.length>24?`<div class="pb" style="border-top:1px solid var(--line)"><a id="dlAll" class="f"
      style="cursor:pointer;font-size:12px">${state.dlAll?"show the first 24":"show all "+show.length}</a></div>`:""}
  </div>

  <div class="p"><div class="ph"><div><h3>Risk — not behind yet</h3>
    <p>${C.risks} things that have not slipped and will. Anything already behind is a delay and is
    in the table above; keeping the two apart is the point of the register.</p></div></div>
    <div class="pb" style="padding:0">${D.risks.map(r=>`<div style="border-top:1px solid var(--line);
      padding:8px 0;display:flex;gap:12px;font-size:12.3px">
      <div style="width:60px;flex:none;color:${r.inDays<=3?"var(--bad)":"var(--warn)"}">${
        r.inDays<=0?"now":"in "+r.inDays+"d"}</div>
      <div style="flex:1"><b>${esc(r.name)}</b>
        <div class="f" style="font-size:11.4px">${r.what.map(w=>esc(w)).join(" · ")}</div></div>
      <div style="width:90px;text-align:right;flex:none">
        <a data-go2="${esc(r.go)}" class="f" style="cursor:pointer">${esc(r.from.replace(".json",""))}</a></div>
    </div>`).join("")}</div></div>`;
}

// ---------- STEP 24 : WHAT THE FLOOR SHOWED, ON ONE DAY ----------
// Every other screen here is cumulative. This is the difference between one
// walk and the one before it — the only thing on the engine that answers
// what moved today.
function vDigest(){
  const X=state.DG2;
  if(!X) return miss("Daily digest","digest.json","node tools/digest.js");
  if(!state.dgDay||!X.digests.some(d=>d.day===state.dgDay)) state.dgDay=X.latest;
  const D=X.digests.find(d=>d.day===state.dgDay);
  const img=(rel)=>"/img?p="+encodeURIComponent(rel);
  const K={coverage:"var(--warn)",stalled:"var(--acc)",safety:"var(--bad)"};

  return `<h2>Daily digest</h2>
  <p class="sub">One walk against the one before it. Everything else on this engine is cumulative;
    this is the day's news.</p>

  <div class="p"><div class="pb" style="padding:0 0 8px">
    ${X.digests.slice().reverse().map(d=>`<button class="opt" data-dgday="${d.day}"
      style="width:auto;display:inline-block;margin:0 5px 5px 0;padding:4px 10px;font-size:11.3px;${
      d.day===D.day?"border-color:var(--acc)":""}">${fmtD(d.day)}
      <span class="f">${d.moveOverall==null?"":(d.moveOverall>=0?"+":"")+d.moveOverall}</span></button>`).join("")}
  </div></div>

  <div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v">${D.overall}%</div>
      <div class="k">built${D.moveOverall!=null?", "+(D.moveOverall>=0?"up ":"down ")+
        Math.abs(D.moveOverall)+" since "+fmtD(D.prevDay):""}</div></div>
    <div class="g"><div class="v" style="color:${D.partial?"var(--warn)":"var(--ok)"}">${
      D.pinsWalked}/${D.pinsTotal}</div><div class="k">pins read · ${esc(D.confidence)} confidence</div></div>
    <div class="g"><div class="v">${D.moved.length}</div>
      <div class="k">packages moved${D.coversDays?" over "+D.coversDays+" days":""}</div></div>
    ${D.safety?`<div class="g"><div class="v" style="color:${D.safety.ppe<60?"var(--bad)":"var(--ok)"}">${
      D.safety.ppe}%</div><div class="k">PPE, of the ${D.safety.of} frames showing people</div></div>`
      :`<div class="g"><div class="v">—</div><div class="k">no safety reading</div></div>`}
  </div></div>
  ${D.partial?`<div class="pb" style="border-top:1px solid var(--line);padding-top:9px">
    <div class="e" style="border:0;padding:0;color:var(--warn)">${esc(D.partialWhy)}</div></div>`:""}
  </div>

  <div class="p"><div class="ph"><div><h3>What moved</h3>
    <p>One line per trade, weighted by what each package is worth. Every line names the pins that
    carry it, so the claim is checkable.</p></div></div>
    <div class="pb" style="padding:0">${D.trades.length?D.trades.map(t=>`
      <div style="border-top:1px solid var(--line);padding:9px 0">
        <div style="font-size:12.7px"><b>${esc(t.trade)}</b>
          <span class="f"> · ${esc(t.line)}</span></div>
        ${t.pins.length?`<div class="f" style="font-size:11.3px;margin-top:3px">seen at pins ${
          t.pins.map(n=>`<a data-dgpin="${n}" style="cursor:pointer">${n}</a>`).join(", ")}</div>`
          :`<div class="f" style="font-size:11.3px;margin-top:3px">no pin on this round shows it directly</div>`}
      </div>`).join(""):`<div class="f" style="padding:6px 0">nothing moved between these two walks</div>`}
    </div></div>

  ${D.frames.length?`<div class="p"><div class="ph"><div><h3>Frames worth publishing</h3>
    <p>Chosen by the reading rather than by whoever is building the deck — what moved, then what is
    furthest from the render. Nothing here was not photographed on the day.</p></div></div>
    <div class="pb" style="padding:0;display:flex;gap:10px;flex-wrap:wrap">
      ${D.frames.map(f=>`<div style="flex:1 1 260px;min-width:240px">
        <img src="${img(f.photo)}" style="width:100%;border-radius:9px;display:block;
          border:1px solid var(--line)" alt="pin ${f.pin}">
        <div style="font-size:12.2px;margin-top:5px"><b>Pin ${f.pin}</b> · ${esc(f.area||"")}</div>
        <div class="f" style="font-size:11.3px">${esc(f.why)}</div>
      </div>`).join("")}
    </div></div>`:""}

  <div class="p"><div class="ph"><div><h3>Watch list</h3>
    <p>What to stand in front of on the next round.</p></div></div>
    <div class="pb" style="padding:0">${D.watch.length?D.watch.map(w=>`
      <div style="border-top:1px solid var(--line);padding:8px 0;display:flex;gap:12px">
        <div style="width:3px;border-radius:3px;background:${K[w.kind]||"var(--line)"};flex:none"></div>
        <div style="flex:1;font-size:12.4px"><b>${esc(w.what)}</b>
          <div class="f" style="font-size:11.4px;margin-top:2px">${esc(w.detail)}</div></div>
      </div>`).join(""):`<div class="f" style="padding:6px 0">nothing flagged on this round</div>`}
    </div></div>

  ${D.moved.length?`<div class="p"><div class="ph"><div><h3>Every package that moved</h3></div></div>

const NAV_KEY="dnbos:navmode";

// ---- the tab strip's scrolling ----------------------------------------
// Three things, all about the same problem: twenty-five steps never fit, and a
// step you cannot see is a step you do not know exists.
//   . the arrows and edge fades show only in the direction there is more
//   . the wheel scrolls it sideways, because over a horizontal bar a vertical
//     wheel gesture is what a person actually does
//   . the open tab is scrolled into view, so arriving on step 21 from a link
//     does not leave the strip sitting at step 1 with nothing highlighted
function wireRail(){
  const r=$("rail"), w=$("railwrap"), L=$("railL"), R=$("railR");
  if(!r||!w) return;
  // down the side the column scrolls vertically and none of the sideways
  // machinery applies; leaving it armed would draw arrows over a list that
  // has nothing to the left or right of it
  if(navMode()==="v"){
    w.classList.remove("moreL","moreR");
    r.onscroll=null; r.onwheel=null;
    const onv=r.querySelector(".nav.on");
    if(onv&&onv.scrollIntoView) onv.scrollIntoView({block:"nearest"});
    return;
  }
  const sync=()=>{
    const max=r.scrollWidth-r.clientWidth;
    w.classList.toggle("moreL", r.scrollLeft>2);
    w.classList.toggle("moreR", r.scrollLeft<max-2);
  };
  const by=d=>r.scrollBy({left:d*Math.max(180,r.clientWidth*0.6),behavior:"smooth"});
  if(L) L.onclick=()=>by(-1);
  if(R) R.onclick=()=>by(1);
  r.onscroll=sync;
  r.onwheel=(e)=>{
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;   // a real sideways gesture already works
    e.preventDefault(); r.scrollLeft+=e.deltaY;
  };
  const on=r.querySelector(".nav.on");
  if(on&&on.scrollIntoView) on.scrollIntoView({block:"nearest",inline:"nearest"});
  // Twice, and the second time after a frame. render() replaces the strip's
  // markup, which resets scrollLeft to 0; scrollIntoView above then moves it,
  // but not before this function returns. Reading the state now alone leaves
  // both arrows showing at whichever end the strip actually settled on.
  sync();
  requestAnimationFrame(sync);
  if(!wireRail._resize){ wireRail._resize=true; window.addEventListener("resize",()=>{
    const rr=$("rail"); if(rr) rr.dispatchEvent(new Event("scroll")); }); }
}

// ---------- WHERE YOU WERE ----------
// A REFRESH IS NOT A RESET. Reloading the page threw the user back to the
// portfolio, which on a fourteen-step engine means finding your way back to
// the Programme, the right zoom, the right comparison day and the right pin
// every time the page reloads — and the page reloads whenever anything is
// re-read. Only the POSITION is kept: which project, which step, and the
// handful of choices made inside a step. Never the data — facts, schedule
// and pin index are always fetched fresh, because a cached fact is a lie
// waiting to happen.
const SEAT="dnbos.seat.v1";
// READ IT ONCE, BEFORE ANYTHING CAN OVERWRITE IT. remember() runs at the end
// of every render, and the first render happens while the facts are still in
// flight — so by the time the portfolio exists to restore into, the default
// state has already been written over the saved one. Capturing the seat at
// load, and refusing to save until it has been taken, is the whole fix.
let SEATED=null, seatTaken=false;
try{ SEATED=JSON.parse(localStorage.getItem(SEAT)||"null"); }catch(e){}
function remember(){
  if(!seatTaken) return;
  try{ localStorage.setItem(SEAT, JSON.stringify({
    level:state.level, open:state.open&&state.open.id, view:state.view,
    schMode:state.schMode, schZoom:state.schZoom, schDay:state.schDay, schCol1:state.schCol1,
    schSum:state.schSum, schQ:state.schQ,
    selPin:state.selPin, selDay:state.selDay })); }catch(e){}
}
// THE SEAT IS RESTORED, THEN CHECKED AGAINST WHAT IS ACTUALLY THERE. A step
// that no longer exists, a project that has gone, a walk date that is not on
// the log any more — each falls back rather than showing an empty screen and
// blaming the user for it.
// ---------- A LINK STRAIGHT TO A REPORT ----------
// ?report=<id> opens that report. Anything else in the parameter is ignored
// rather than guessed at: a link that silently opens the wrong report is worse
// than one that opens the catalogue.
let urlOpened=false;
function openFromUrl(){
  // WRAPPED, BECAUSE A LINK MUST NEVER BREAK THE PAGE. This first called
  // portfolio() to find the project, which throws while the room reader is
  // still warming up — and took the whole boot down with it, so the app came
  // up blank for anybody following a link. Nothing in here needs the portfolio:
  // the ids are already known.
  if(urlOpened) return;                  // once, however many loads finish
  try{
    const q=new URLSearchParams(location.search);
    const id=q.get("report"); if(!id) { urlOpened=true; return; }
    // BOTH, NOT EITHER. The catalogue says the report exists; the facts are
    // what the rail draws the project from. Switching to the project level
    // before the facts land threw inside rail() and took the boot with it —
    // which is the same reason restoreSeat is only called once facts arrive.
    if(!state.RP || !state.F) return;     // whichever lands last opens the link
    const r=state.RP.reports.find(x=>x.id===id&&x.status==="live");
    urlOpened=true;
    if(!r) return;                       // unknown or locked: open the catalogue
    // state.open holds the PROJECT, not its id — rail() reads p.name off it.
    // Putting the id there threw inside rail() and took the whole boot down,
    // so the app came up on the portfolio and every link looked ignored.
    const proj=portfolio().find(x=>x.id==="skf-pune-7f")||portfolio()[0];
    if(!proj) return;
    state.open=proj; state.level="project";
    state.view="reports"; state.repId=id;
    const z=Number(q.get("zoom")); if(z>0.3&&z<2) state.repZoom=z;
    // ?day= picks one of the days the report was actually built for, and is
    // ignored otherwise rather than showing a different day than was asked for
    const dq=q.get("day");
    if(dq && r.byDay && r.byDay[dq]) state.repDay=dq;
  }catch(e){ /* a malformed link is not a reason to show nothing */ }
}
function restoreSeat(){
  const v=SEATED; seatTaken=true;
  // A PROJECT NAMED ON THE URL BEATS THE REMEMBERED SEAT. ?project= is how the
  // planning engine's "Track →" says which project it means; letting the seat
  // win meant following that link landed on whichever project this browser last
  // had open, and then drew ITS dates under the name from the link. A link that
  // opens the wrong project is worse than one that opens nothing.
  const asked=new URLSearchParams(location.search).get("project");
  if(asked){
    const x=portfolio().find(y=>y.id===asked.replace(/[^A-Za-z0-9._-]/g,""));
    if(x){ state.open=x; state.level="project";
      state.view = x.live?"read":(x.planned?"sched":"intake");
      if(v&&STEPS.some(st=>st.id===v.view)) state.view=v.view;
      return; }
  }
  if(!v) return;
  if(["plan","progress","projected"].indexOf(v.schMode)>=0) state.schMode=v.schMode;
 if(typeof v.schSum==="boolean") state.schSum=v.schSum;
 if(typeof v.schQ==="boolean") state.schQ=v.schQ;
  if(["month","week","day"].indexOf(v.schZoom)!==-1) state.schZoom=v.schZoom;
  if(typeof v.schCol1==="number") state.schCol1=Math.max(120,Math.min(620,v.schCol1));
  if(typeof v.selPin==="number") state.selPin=v.selPin;
  if(typeof v.selDay==="string") state.selDay=v.selDay;
  if(typeof v.schDay==="string") state.schDay=v.schDay;
  if(v.level==="project"&&v.open){
    const x=portfolio().find(y=>y.id===v.open);
    if(x){ state.open=x; state.level="project";
      state.view = STEPS.some(st=>st.id===v.view) ? v.view : (x.live?"read":"intake"); }
  }
}

// ---- the programme the planning engine authored ---------------------------
// Polled rather than fetched once: the planning engine may be open beside this
// one, and a re-plan there has to reach this screen without a reload. `rev`
// makes that cheap — the page only redraws when something actually moved.
let peRev=-1, peFor=null;
function syncPull(){
  const pid=peProject();
  // Switching project invalidates the rev: rev 12 of Phase 2 is not rev 12 of
  // Phase 1, and comparing them would keep the previous project's plan on screen
  // under the new project's name.
  // Pending changes belong to the project they were typed against. Carrying them
  // to the next project would apply row "p1" of one programme to row "p1" of a
  // different one — the ids collide and the correction would land on the wrong
  // package entirely.
  if(pid!==peFor){ peFor=pid; peRev=-1; state.SYNC=null; state.pending={}; state.pushErr=null; }
  return fetch("/sync/state?project="+encodeURIComponent(pid))
    .then(r=>r.json())
    .then(j=>{
      state.syncErr=null;
      if(!j||!j.ok) return;
      if(peProject()!==pid) return;        // the reader moved on while this was in flight
      if(j.rev===peRev) return;            // nothing moved, do not redraw over the reader
      peRev=j.rev; state.SYNC=j; render();
    })
    .catch(e=>{ state.syncErr=String(e&&e.message?e.message:e); });
}
syncPull();
setInterval(syncPull,4000);

// the projects the planning engine knows about, for the portfolio list
function syncProjects(){
  return fetch("/sync/projects").then(r=>r.json())
    .then(j=>{ if(!j||!j.ok) return;
      state.syncProjects=j.projects||[];
      // The seat is restored when facts.json lands, which is before this list
      // exists — so a ?project= naming a planned-only project could not be found
      // at that moment and the link fell through to the seat. Now that the list
      // is here, honour the link if it is still unanswered.
      const asked=(new URLSearchParams(location.search).get("project")||"").replace(/[^A-Za-z0-9._-]/g,"");
      if(asked && (!state.open || state.open.id!==asked)){
        const x=portfolio().find(y=>y.id===asked);
        if(x){ state.open=x; state.level="project";
          state.view=x.live?"read":(x.planned?"sched":"intake"); syncPull(); }
      }
      render(); })
    .catch(()=>{});
}
syncProjects();
setInterval(syncProjects,15000);

// An edit made here goes to the shared store as a single field, and the pull
// above brings back the merged truth. It is deliberately NOT applied to
// state.SYNC locally first: the store is the one authority on the overlay, and
// a local guess that the write succeeded is how two apps start disagreeing.
function syncEditBatch(edits){
  return fetch("/sync/edits?project="+encodeURIComponent(peProject()),{
    method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({by:"tracking-engine",edits:edits})
  }).then(r=>r.json()).then(j=>{
    if(j&&j.ok){ peRev=j.rev; state.SYNC=Object.assign({},state.SYNC,{edits:j.edits,editsAt:j.editsAt}); }
    return j;
  }).catch(e=>({ok:false,error:String(e&&e.message?e.message:e)}));
}

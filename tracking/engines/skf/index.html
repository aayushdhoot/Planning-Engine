 {k:"Email thread",         re:/mail|email/i,                          w:1},
 {k:"WhatsApp group",       re:/whatsapp|chat/i,                       w:1},
];

function inputStatus(F){
  // notADocument is excluded outright — a lock file is not a project input,
  // and counting one against readiness is how a green board turns amber for
  // a reason nobody can act on.
  const docs=((F&&F.documents)||[]).filter(d=>d.read!=="notADocument");
  const rate=(x)=>{
    const hits=docs.filter(d=>x.re.test(d.doc));
    if(!hits.length) return {state:"none", docs:[], why:"not in the folder"};
    const full=hits.filter(d=>d.read==="full");
    if(full.length===hits.length)
      return {state:"full", docs:hits.map(d=>d.doc),
        why:hits.length===1?"read end to end":"all "+hits.length+" read end to end"};
    const partial=hits.filter(d=>d.read==="partial");
    const pending=hits.filter(d=>d.read==="pending");
    const none=hits.filter(d=>d.read==="none");
    // the reason names the DOCUMENTS, and says which part of them is missing,
    // because "partly read" that cannot be acted on is the same as silence
    const bits=[];
    if(none.length)    bits.push(none.length+" could not be opened");
    if(pending.length) bits.push(pending.length+" still to be read");
    // two workbooks refusing the SAME sheet is one thing to fix, not two
    if(partial.length) bits.push([...new Set(partial.map(d=>d.why))].join("; "));
    return {state:"partial", docs:hits.map(d=>d.doc),
      why:full.length+" of "+hits.length+" read end to end — "+bits.join(", ")};
  };
  const mark=(arr)=>arr.map(x=>Object.assign({},x,rate(x)));
  const st=mark(STATIC_INPUTS), dy=mark(DYNAMIC_INPUTS);
  const score=(list)=>list.reduce((a,x)=>a+(x.state==="full"?x.w:x.state==="partial"?x.w*0.5:0),0);
  const total=[...STATIC_INPUTS,...DYNAMIC_INPUTS].reduce((a,x)=>a+x.w,0);
  return {st,dy,total, got:score(st)+score(dy),
    pct:Math.round((score(st)+score(dy))/total*100)};
}

// A COLUMN THE ENGINE WILL NOT NAME ON A HEADER'S WORD. Real sheets have
// merged cells, shifted headers and stale titles; a reader that trusts the
// header invents a wrong date on every row. Guessing costs the whole sheet,
// asking costs one sitting.
function settlePanel(F){
 const q=(F&&F.confirm)||[];
 if(!q.length) return `<div class="p"><div class="pb"><div class="e" style="border-left:3px solid var(--ok)">
   Every column on every sheet is named. Nothing is waiting on you here.</div></div></div>`;
 const roles=(F&&F.roles)||[];
 state.cols=state.cols||{};
 const key=(c)=>c.doc+"||"+c.sheet+"||"+c.col;
 const byDoc={};
 q.forEach(c=>{const k=c.doc.split("/").pop()+" · "+c.sheet;(byDoc[k]=byDoc[k]||[]).push(c);});
 const opt=(c)=>{
   const cur=state.cols[key(c)]||"";
   return `<select data-col="${esc(key(c))}"
     style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 7px;font-size:11.8px">
     <option value=""${cur?"":" selected"}>— leave unnamed —</option>
     <option value="ignore"${cur==="ignore"?" selected":""}>ignore this column</option>
     ${roles.map(r=>`<option value="${esc(r)}"${cur===r?" selected":""}>${esc(r)}</option>`).join("")}
   </select>`;
 };
 return `<div class="p"><div class="ph"><div><h3>Columns the engine will not name on a header's word</h3>
   <p>The header is a claim; the data is the evidence. Where the two disagree, or two columns read as the same
   thing, or a header sits over a column the sheet barely fills, the engine takes nothing from it and asks —
   once. Name one here and it is remembered, the project is read again, and the plan is rebuilt on the spot.</p></div>
   <div class="r">${q.length} columns</div></div>
   <div class="pb" style="padding:0">
   ${Object.keys(byDoc).slice(0,12).map(k=>`<div style="border-bottom:1px solid var(--line);padding:11px 15px">
     <div style="font-size:12.4px;font-weight:600">${esc(k)}</div>
     <table style="margin-top:7px"><thead><tr><th style="width:48px">Col</th><th style="width:20%">Header</th>
       <th style="width:62px">Holds</th><th style="width:26%">First values</th><th style="width:170px">It is really…</th></tr></thead><tbody>
     ${byDoc[k].map(c=>`<tr><td><b>${esc(c.col)}</b></td>
       <td class="m">${esc(c.header||"— none —")}</td>
       <td class="f">${esc(c.dataIs||"")}</td>
       <td class="f">${esc((c.values||[]).slice(0,3).join("  |  ")).slice(0,70)}
         <div style="font-size:10.6px;margin-top:2px;color:var(--fnt)">${esc(String(c.why||"").slice(0,110))}</div></td>
       <td>${opt(c)}</td></tr>`).join("")}
     </tbody></table></div>`).join("")}
   ${Object.keys(byDoc).length>12?`<div class="pb"><div class="src">and ${Object.keys(byDoc).length-12} more sheets — settle these first and the list shortens</div></div>`:""}
   </div>
   <div class="pb" style="border-top:1px solid var(--line);display:flex;gap:12px;align-items:center">
     <button id="saveCols" style="background:var(--acc);border:0;color:#fff;border-radius:9px;padding:9px 20px;font-size:13px;font-weight:650;cursor:pointer">
       ${state.savingCols?"reading the project again…":"Save and re-read"}</button>
     <span class="f" style="font-size:11.5px">${esc(state.colsSaid||"Saving re-reads every document and rebuilds the areas and the plan — it takes a few seconds.")}</span>
   </div></div>`;
}

// A COLUMN IS A DECISION ABOUT A DOCUMENT, SO IT IS KEPT AGAINST THE
// DOCUMENT AND NOT AGAINST THIS BROWSER. Saving one re-reads the project and
// rebuilds the plan, because the only reason to settle a column is to find
// out what it changed.
function saveCols(){
 const out={};
 Object.keys(state.cols||{}).forEach(k=>{
   const v=state.cols[k]; if(!v) return;
   const [doc,sheet,col]=k.split("||");
   ((out[doc]=out[doc]||{})[sheet]=out[doc][sheet]||{})[col]=v;
 });
 if(!Object.keys(out).length){ state.colsSaid="Nothing chosen yet."; render(); return; }
 state.savingCols=true; state.colsSaid=null; render();
 fetch("/columns",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(out)})
  .then(r=>r.json())
  .then(j=>{
    if(!j.ok) throw new Error(j.error||"it would not save");
    state.colsSaid=N(j.facts)+" facts now · "+j.left+" columns still unnamed"+
      (j.finish?" · the plan finishes "+j.finish:"")+(j.planError?" · the plan would not rebuild":"");
    state.cols={};
  })
  .catch(e=>{ state.colsSaid="could not save: "+e.message; })
  .then(()=>Promise.all([
    fetch("facts.json?t="+Date.now()).then(r=>r.json()).then(j=>{state.F=j;}).catch(()=>{}),
    fetch("areas.json?t="+Date.now()).then(r=>r.json()).then(j=>{state.A=j;}).catch(()=>{}),
    fetch("plan.json?t="+Date.now()).then(r=>r.json()).then(j=>{state.PL=j;}).catch(()=>{}),
  ]))
  .then(()=>{ state.savingCols=false; render(); });
}

function ring(pct){
  const R=44,C=2*Math.PI*R, on=C*Math.min(1,Math.max(0,pct/100));
  const col = pct>=70?"var(--ok)":pct>=35?"var(--warn)":"var(--bad)";
  return `<svg width="120" height="120" viewBox="0 0 120 120" style="flex:0 0 120px">
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--card2)" stroke-width="11"/>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="11"
      stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${C.toFixed(1)}"
      transform="rotate(-90 60 60)"/>
    <text x="60" y="58" text-anchor="middle" font-size="27" font-weight="650" fill="var(--ink)">${pct}</text>
    <text x="60" y="76" text-anchor="middle" font-size="11" fill="var(--fnt)">/ 100</text></svg>`;
}

function box(x, key){
 return box2(x, key);
}
function box2(x, key){
  // the read-state tint. These were dark green and dark amber, chosen against a
  // near-black page; on white they became dark badges carrying dark text at
  // 1.4:1. Same three states, same two colours, in the soft tints the rest of
  // the app uses for exactly these meanings.
  const bg = x.state==="full"?"var(--ok-soft)":x.state==="partial"?"var(--warn-soft)":"var(--card2)";
  const bd = x.state==="full"?"#96dcc0":x.state==="partial"?"#f2c98a":"var(--line)";
  const dot= x.state==="full"?"var(--ok)":x.state==="partial"?"var(--warn)":"var(--fnt)";
  const busy = state.reading===key;
  const said = state.readSaid && state.readSaid[key];
  return `<div data-goknow="${esc(key)}" title="open it in Knowledge"
      style="background:${bg};border:1px solid ${bd};border-radius:10px;padding:10px 12px;
      display:flex;gap:9px;align-items:flex-start;min-width:0;cursor:pointer">
    <span style="width:8px;height:8px;border-radius:50%;background:${dot};margin-top:5px;flex:0 0 8px"></span>
    <div style="min-width:0;flex:1">
      <div style="font-size:12.6px;font-weight:600;line-height:1.3">${esc(x.k)}</div>
      <div class="f" style="font-size:10.8px;margin-top:1px">${esc(said||x.why)}</div>
    </div>
    <span data-add="${esc(key)}" title="add a file for this input — DXF, XLSX, XLS, CSV"
      style="flex:0 0 22px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
             cursor:pointer;color:var(--mut);font-size:15px;opacity:.55">+</span>
    <span data-read="${esc(key)}" title="${x.state==="none"?"look for it and read it":"read it again"}"
      style="flex:0 0 22px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
             cursor:pointer;color:var(--mut);font-size:13px;
             ${busy?"opacity:.5":"opacity:.55"}">${busy?"⋯":"↻"}</span></div>`;
}

function patFor(key){
  const all=[...STATIC_INPUTS,...DYNAMIC_INPUTS].find(x=>x.k===key);
  return all ? String(all.re).replace(/^\/|\/[a-z]*$/g,"") : null;
}
function addFile(key){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".dxf,.xlsx,.xlsm,.xls,.csv,.tsv";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    state.reading=key; state.readSaid=state.readSaid||{};
    state.readSaid[key]="sending "+f.name+" ("+(f.size/1048576).toFixed(1)+" MB)…";
    render();
    fetch("/upload?name="+encodeURIComponent(f.name),{method:"POST",body:f})
      .then(r=>r.json())
      .then(j=>{
        if(!j.ok){ state.readSaid[key]=j.error; state.reading=null; render(); return; }
        // it is in the folder now, so read it at once . an upload that does
        // not get read is just a file somebody moved
        state.readSaid[key]="added "+j.name+", reading it…"; render();
        return readOne(key);
      })
      .catch(e=>{ state.readSaid[key]="the upload failed: "+e.message; state.reading=null; render(); });
  };
  inp.click();
}

function readOne(key){
  const pat=patFor(key); if(!pat) return;
  state.reading=key; render();
  fetch("/read?pat="+encodeURIComponent(pat))
    .then(r=>r.json())
    .then(j=>{
      state.readSaid=state.readSaid||{};
      state.readSaid[key]= j.ok
        ? (j.nothing ? "nothing in the folder matches this yet"
                     : (j.read[0]||"read").replace(/^[^·]*·\s*/,""))
        : ("could not read it: "+(j.error||"unknown"));
    })
    .catch(e=>{ state.readSaid=state.readSaid||{}; state.readSaid[key]="the read failed: "+e.message; })
    .then(()=>fetch("facts.json?t="+Date.now()).then(r=>r.json()).then(f=>{state.F=f;}).catch(()=>{}))
    .then(()=>{ state.reading=null; render(); });
}

// A NAME IS A DECISION, AND IT IS KEPT WHERE DECISIONS ARE KEPT. It goes to
// the project, not into the pin pack — the pack stays the frozen record of
// what was surveyed, this stays the record of what was decided, and the two
// are readable side by side.
function saveNames(){
 const out={};
 Object.keys(state.names||{}).forEach(k=>{ const v=String(state.names[k]||"").trim(); if(v) out[k]=v; });
 if(!Object.keys(out).length){ state.namesSaid="Nothing typed yet."; render(); return; }
 state.savingNames=true; state.namesSaid=null; render();
 fetch("/names",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(out)})
  .then(r=>r.json())
  .then(j=>{
    if(!j.ok) throw new Error(j.error||"it would not save");

    state.namesSaid=Object.keys(out).length+" saved · "+j.counts.named+" of "+j.counts.areas+
      " areas named, "+N(j.counts.unnamedSqft)+" sqft still unnamed"+(refused?" · "+refused+" refused":"");
  })
  .catch(e=>{ state.namesSaid="could not save: "+e.message+
    " — is the engine served by tools/serve-engine.js?"; })
  .then(()=>fetch("areas.json?t="+Date.now()).then(r=>r.json()).then(j=>{state.A=j;}).catch(()=>{}))
  .then(()=>{ state.savingNames=false; render(); });
}

function vIntake(){
 const F=state.F;
 if(!F) return `<h2>Inputs</h2><div class="p"><div class="pb"><div class="e">Nothing read yet.</div></div></div>`;
 const S=inputStatus(F);
 const grid=(arr)=>`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px">
   ${arr.map(x=>box(x,x.k)).join("")}</div>`;

 return `<h2>Inputs</h2>
 <p class="sub">What the project has given the engine, and how much of it the engine actually got out.
 Static inputs set the plan; dynamic ones keep moving it.</p>

 <div class="p"><div class="ph"><div><h3>Readiness to publish</h3>
   <p>How ready the inputs are for a plan you can trust. Weighted — a missing BOQ costs more than a missing brand guide.</p></div>
   <div class="r f" style="font-size:11.5px">click a box to see what it taught the engine · + adds a file · ↻ reads it again</div></div>
   <div class="pb" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
     ${ring(S.pct)}

const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const cr=(n)=>!n?"\u2014":n>=1e7?"Rs "+(n/1e7).toFixed(2)+" Cr":n>=1e5?"Rs "+(n/1e5).toFixed(1)+" L"
  :"Rs "+Math.round(n).toLocaleString("en-IN");
const miss=(label,file,cmd)=>`<h2>${esc(label)}</h2><div class="p"><div class="pb"><div class="e">

        All four are read out of a daily report, not off a signed goods-received note. None carries a
        quantity, so each says the material came and none says how much.</div></div>`
      :`<table style="width:100%;border-collapse:collapse;font-size:12px;min-width:820px">
        <tr class="f" style="font-size:10.4px;letter-spacing:.04em;text-transform:uppercase">
          <td style="padding-bottom:5px">package</td><td class="n">value</td>

      </table>`}

          .map(r=>`<tr style="border-top:1px solid var(--line)">

// ---------- WHAT A PERSON ALREADY CLOSED ----------
// The open list was only ever half the record. Every one of these was already
// being used by the engine — the handover date the programme hangs off, the
// floor the agreement gets wrong — and shown on no screen at all. A decision
// nobody can find is one that gets re-argued from scratch in three months.
function vClosedDecisions(T){
  const C=(T&&T.closed)||[];
  if(!C.length) return "";
  const K={material:"var(--bad)",approval:"var(--warn)",assumption:"var(--acc)",
    drawing:"var(--ok)",measure:"var(--ok)",reading:"var(--acc)",date:"var(--bad)"};
  return `<div class="p"><div class="ph"><div><h3>Already decided</h3>
    <p>${C.length} question${C.length===1?"":"s"} a person has closed, newest first. Each says what
      it was decided against, so it can be reopened when the evidence changes rather than defended
      because it is written down.</p></div></div>
    <div class="pb" style="padding:0">
      ${C.map(c=>`<div style="border-top:1px solid var(--line);padding:9px 0;display:flex;gap:12px">
        <div style="width:3px;border-radius:3px;background:${K[c.kind]||"var(--line)"};flex:none;opacity:.55"></div>
        <div style="flex:1">
          <div style="font-size:12.8px"><b>${esc(c.what)}</b></div>
          <div class="f" style="font-size:11.6px;margin-top:3px">${esc(c.why||"")}</div>
          ${c.against?`<div class="f" style="font-size:11.2px;margin-top:3px;opacity:.8">

          ${c.proposedBy?`<div class="f" style="font-size:11.2px;margin-top:3px;opacity:.8">

          <div class="f" style="font-size:11px;opacity:.7">${esc(c.from||"")}</div>
        </div></div>`).join("")}

// ---------- STEP 11 : WHAT GETS BILLED, AND WHEN ----------
function vCash(){
  const F=state.CF;
  if(!F) return miss("Cashflow","cashflow.json","node tools/money.js");
  const T=F.totals, M=F.months;
  const W=900,H=220,PADL=8,PADB=22,PADT=12,AXW=76;
  const top=Math.max(...M.map(m=>m.cumPlanned))*1.08||1;
  const n=Math.max(1,M.length);
  const X=(i)=>PADL+(n===1?0:i/(n-1))*(W-PADL-16);
  const Y=(v)=>H-PADB-(Math.min(v,top)/top)*(H-PADB-PADT);
  const step=(()=>{const raw=top/6,p=Math.pow(10,Math.floor(Math.log10(raw||1)));
    return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw)||10*p;})();
  const lv=[];for(let v=0;v<=top;v+=step)lv.push(Math.round(v));
  const pl=M.map((m,i)=>X(i).toFixed(1)+","+Y(m.cumPlanned).toFixed(1)).join(" ");
  const ea=M.filter(m=>m.past).map((m,i)=>X(i).toFixed(1)+","+Y(m.cumEarned).toFixed(1)).join(" ");
  return `<h2>Cashflow</h2>
  <p class="sub">The plan spreads each package's bill value across the working days the levelled
    programme installs it on. Earned is the walk's own reading priced at the same weights the
    progress page uses — not a certificate and not an invoice, because this engine has neither.</p>
  <div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v">${cr(T.contract)}</div><div class="k">of priced work on the programme</div></div>
    <div class="g"><div class="v" style="color:var(--ok)">${cr(T.earned)}</div>
      <div class="k">earned to ${fmtD(F.walkDay)} — ${T.earnedPct}% of value</div></div>
    <div class="g"><div class="v">${cr(T.remaining)}</div><div class="k">still to earn</div></div>
    <div class="g"><div class="v">${T.sitePct}%</div>
      <div class="k">the site reading, which the ${T.earnedPct}% is priced from</div></div>
  </div></div></div>
  <div class="p"><div class="ph"><div><h3>Value against time</h3>
    <p>Cumulative. Blue is what the programme plans to install; green is what the walk can already
    see, priced.</p></div></div>
    <div class="pb" style="padding:0"><div class="mpouter">
      <svg class="mpaxis" viewBox="0 0 ${AXW} ${H}" width="${AXW}" height="${H}">
        ${lv.map(v=>`<text x="${AXW-10}" y="${(Y(v)+3.5).toFixed(1)}" fill="var(--mut)" font-size="10"
          text-anchor="end">${v>=1e7?(v/1e7).toFixed(1)+"Cr":v>=1e5?Math.round(v/1e5)+"L":v}</text>`).join("")}
        <line x1="${AXW-1}" x2="${AXW-1}" y1="${PADT-6}" y2="${H-PADB}" stroke="var(--line)"/>
      </svg>
      <div class="mpwrap" style="margin-left:${AXW}px">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
        ${lv.map(v=>`<line x1="${PADL}" x2="${W-6}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`).join("")}
        ${M.map((m,i)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" fill="var(--mut)" font-size="9.5"
          text-anchor="middle">${MONS[+m.month.slice(5,7)-1]}</text>`).join("")}
        <polyline points="${pl}" fill="none" stroke="var(--acc)" stroke-width="2"/>
        ${ea?`<polyline points="${ea}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>`:""}
        ${M.map((m,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(m.cumPlanned).toFixed(1)}" r="3"
          fill="var(--acc)"><title>${m.month} plan ${cr(m.cumPlanned)}</title></circle>${
          m.past?`<circle cx="${X(i).toFixed(1)}" cy="${Y(m.cumEarned).toFixed(1)}" r="3.4"
          fill="var(--ok)"><title>${m.month} earned ${cr(m.cumEarned)}</title></circle>`:""}`).join("")}
      </svg></div></div>
    </div>
  </div>
  <div class="p"><div class="pb" style="padding:0">
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <tr class="f" style="font-size:10.4px;letter-spacing:.04em;text-transform:uppercase">
        <td style="padding-bottom:5px">month</td><td class="n">planned</td><td class="n">earned</td>
        <td class="n">cumulative plan</td><td class="n">cumulative earned</td></tr>
      ${M.map(m=>`<tr style="border-top:1px solid var(--line)">
        <td style="padding:5px 0">${MONS[+m.month.slice(5,7)-1]} ${m.month.slice(0,4)}</td>
        <td class="n">${cr(m.planned)}</td>
        <td class="n">${m.past?cr(m.earned):"—"}</td>
        <td class="n">${cr(m.cumPlanned)}</td>
        <td class="n">${m.past?cr(m.cumEarned):"—"}</td></tr>`).join("")}
    </table></div></div>`;
}

// "The ceiling is behind in the north east corner" is a sentence no list can

function vPins(){
  const L=state.LY;

  const col=(p)=>!p.scorable?"#8a8a95":p.pct==null?"#8a8a95"
    :p.pct>=70?"var(--ok)":p.pct>=45?"var(--warn)":"var(--bad)";
  return `<h2>Pin layout</h2>
  <p class="sub">${L.counts.pins} camera positions on the plate, ${L.counts.walked} of them walked.
    Each dot is its own reading from the ${fmtD(L.latest)} round — never smoothed across its
    neighbours, because two pins a metre apart can honestly disagree and that is what a plan view
    is for. Click one to open its assessment.</p>
  ${L.counts.unframed.length?`<div class="p"><div class="pb"><div class="e" style="border:0;padding:0;color:var(--warn)">
    Pins ${L.counts.unframed.join(", ")} are drawn grey and can never be scored — no design render
    was delivered for those positions, so there is no finished state to read them against.</div></div></div>`:""}
  <div class="p"><div class="pb" style="padding:0;overflow-x:auto">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:760px;height:auto;display:block">
      <rect x="1" y="1" width="${W-2}" height="${H-2}" fill="none" stroke="var(--line)" rx="6"/>
      ${L.pins.map(p=>{const x=(8+p.x*(W-16)).toFixed(1), y=(8+p.y*(H-16)).toFixed(1);
        const a=p.aim?`<line x1="${x}" y1="${y}" x2="${(+x+p.aim.dx*(W-16)*0.5).toFixed(1)}"
          y2="${(+y+p.aim.dy*(H-16)*0.5).toFixed(1)}" stroke="${col(p)}" stroke-width="1" opacity=".45"/>`:"";
        return `<g data-pin="${p.no}" style="cursor:pointer"><title>Pin ${p.no} · ${esc(p.area||p.space||"")}${
          p.pct==null?" · not scored":" · "+p.pct+"% of what the render expects"}</title>
          ${a}<circle cx="${x}" cy="${y}" r="6.5" fill="${col(p)}" fill-opacity=".22"/>
          <circle cx="${x}" cy="${y}" r="3.4" fill="${col(p)}"/>
          <text x="${x}" y="${(+y-8).toFixed(1)}" fill="var(--mut)" font-size="8"
            text-anchor="middle">${p.no}</text></g>`;}).join("")}
    </svg>
    <div style="display:flex;gap:16px;font-size:11.3px;color:var(--mut);padding:8px 12px 2px;flex-wrap:wrap">
      <span><i style="display:inline-block;width:9px;height:9px;border-radius:9px;background:var(--ok);
        vertical-align:middle"></i> 70% or more of what the render expects</span>
      <span><i style="display:inline-block;width:9px;height:9px;border-radius:9px;background:var(--warn);
        vertical-align:middle"></i> 45 to 70</span>
      <span><i style="display:inline-block;width:9px;height:9px;border-radius:9px;background:var(--bad);
        vertical-align:middle"></i> under 45</span>
      <span><i style="display:inline-block;width:9px;height:9px;border-radius:9px;background:#8a8a95;
        vertical-align:middle"></i> no render, cannot be scored</span>
    </div>
  </div></div>
  <div class="p"><div class="ph"><div><h3>By space</h3>
    <p>The average of the pins standing in it. A space with one pin is one camera's opinion.</p></div></div>
    <div class="pb" style="padding:0">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr class="f" style="font-size:10.4px;letter-spacing:.04em;text-transform:uppercase">
          <td style="padding-bottom:5px">space</td><td class="n">pins</td><td class="n">sqft</td>
          <td class="n">read</td></tr>
        ${L.spaces.map(s=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:5px 0">${esc(s.name)}</td>
          <td class="n">${s.pins.length}</td>
          <td class="n">${s.sqft?Math.round(s.sqft).toLocaleString("en-IN"):"—"}</td>
          <td class="n" style="color:${s.pct==null?"var(--mut)":s.pct>=70?"var(--ok)":s.pct>=45?"var(--warn)":"var(--bad)"}">${
            s.pct==null?"—":s.pct+"%"}</td></tr>`).join("")}
      </table></div></div>`;
}

// ---------- STEP 14 : THE THINGS PEOPLE ACTUALLY SEND ----------
// Nobody forwards a screen. What leaves this project is a daily report, a
// Monday client pack, a one pager for a director — and every one of them
// used to be assembled by hand from numbers the engine already held.
//
// The pages are drawn in the shared report language (RP_DESIGN, inlined
// above): cream paper, Poppins headings, five pastel tones, 1280 x 720 —
// the 16:9 the reference PDFs print at. ONE REPORT PAGE PRINTS AS ONE PDF
// PAGE, which is the whole reason the sections are flowed into fixed pages
// here rather than left to reflow in the browser.
const RIMG=(rel)=>"/img?p="+encodeURIComponent(rel);

function rpSection(s0){
  const RD=window.RP_DESIGN;
  // ONE DATE FORMAT ON THE PAGE. The builders write ISO because that is what
  // the files hold; the reader should never see two ways of writing the same
  // day in one document, so every string is normalised here, once.
  const D=(t)=>t==null?t:RD.dates(t);
  const s=Object.assign({},s0,{title:D(s0.title),note:D(s0.note)});
  if(s.rows) s.rows=s0.rows.map(r=>Array.isArray(r)
    ? r.map(c=>(c&&typeof c==="object")?Object.assign({},c,{t:D(c.t),note:D(c.note)}):D(c))
    : Object.assign({},r,{k:D(r.k),v:D(r.v),note:D(r.note),name:D(r.name),
        head:D(r.head),body:D(r.body),foot:D(r.foot),right:D(r.right)}));
  if(s.cards) s.cards=s0.cards.map(c=>Object.assign({},c,{cap:D(c.cap),from:D(c.from)}));
  const head=RD.sectionHead(s.title,s.note);
  let body="";
  if(s.kind==="stats") body=RD.stats(s.cards);
  else if(s.kind==="duals") body=RD.duals(s.rows);
  else if(s.kind==="table") body=RD.table(s.headers,s.rows);
  else if(s.kind==="cards") body=RD.cards(s.rows,s.cols);
  else if(s.kind==="specs") body=RD.specs(s.rows);
  else if(s.kind==="plan") body=RD.plan(s.rows,{aspect:s.aspect,note:s.planNote,spaces:s.spaces});
  else if(s.kind==="curve") body=RD.curve({points:s.rows,marks:s.marks,note:s.chartNote,
    aLabel:s.aLabel,bLabel:s.bLabel,markLabel:s.markLabel,fmt:(v)=>"Rs "+(v/1e7).toFixed(1)+" Cr"});
  else if(s.kind==="timeline") body=RD.timeline(s.rows,{marks:s.marks,note:s.chartNote});
  else if(s.kind==="shots") body=RD.shots((s.rows||[]).map(x=>
    Object.assign({},x,{src:x.src?RIMG(x.src):null})));
  else body=(s.rows&&s.rows.length)?RD.rows(s.rows)
    :`<div class="rp-note">nothing on this list today, which is a reading and not a gap</div>`;
  return head+body+(s.reading?RD.reading(s.reading):"");
}
// ---- packing sections into fixed pages ------------------------------
// A page is a fixed box, so anything that does not fit is CROPPED BY THE
// PRINT BOX AND THE READER NEVER LEARNS WHAT WAS CUT. Packing whole sections
// was not enough: the planned-against-achieved list is sixty rows long and
// fits on no page at all, so it silently lost two thirds of itself. A section
// bigger than a page is therefore SPLIT across pages and the continuation
// says so, rather than being quietly truncated.
const RP_PER={rows:36,table:32,duals:38,cards:98,shots:490,stats:112,specs:44,plan:520,curve:400,timeline:400};
function rpHeadH(s){ return (s.title?26:0)+(s.note?32:0)+(s.reading?28:0)+
  (s.kind==="table"?30:s.kind==="duals"?30:0); }
function rpPerRow(s){
  if(s.kind==="cards") return RP_PER.cards/(s.cols||2);
  return RP_PER[s.kind]||RP_PER.rows;
}
// how many items of this section fit in `room` pixels
function rpFit(s,room){
  if(s.kind==="stats") return 5;                 // a stat strip is one row of five
  if(s.kind==="shots") return 2;                 // two across, one band, one page
  if(s.kind==="plan") return 999;                // the plate is one thing, never split
  if(s.kind==="curve") return 999;               // a chart is one thing too
  if(s.kind==="timeline") return 999;
  return Math.max(1,Math.floor(room/rpPerRow(s)));
}
// cut a section into chunks of n items, the continuation saying so
let RP_SEC=0;
function rpChunk(s,n){
  const key=s.cards?"cards":"rows";
  const list=s[key]||[];
  if(list.length<=n) return [s];
  // EVERY PIECE REMEMBERS WHICH SECTION IT CAME FROM, so pieces that end up
  // on one page can be put back together. Three chunks of one table landing
  // on the same sheet drew three headings and three header rows — which reads
  // as three tables that happen to share a name.
  const sid=s._sid||(s._sid=++RP_SEC);
  const out=[];
  for(let i=0;i<list.length;i+=n){
    const piece=Object.assign({},s,{_sid:sid});
    piece[key]=list.slice(i,i+n);
    if(i>0){ piece.title=s.title?s.title+" — continued":null; piece.note=null; piece.reading=null; }
    out.push(piece);
  }
  // THE READER IS TOLD THE LIST WAS LONGER THAN A PAGE, never left to guess —
  // but ONCE. The flow re-chunks a piece each time it measures, and this note
  // was appended on every pass, so a section that took four passes to settle
  // printed "Continues overleaf." four times in a row on the page.
  out[0]=Object.assign({},out[0],{_cont:true,
    note: s._cont ? s.note : ((s.note?s.note+"  ":"")+"Continues overleaf.")});
  return out;
}
function rpSplit(s,cap){
  const list=(s.cards||s.rows)||[];
  if(!list.length) return [s];
  return rpChunk(s,rpFit(s,cap-rpHeadH(s)));
}
function rpHeight(s){
  const n=((s.rows||s.cards)||[]).length;
  const head=rpHeadH(s);
  if(s.kind==="stats") return head+RP_PER.stats;
  if(s.kind==="shots") return head+RP_PER.shots;
  if(s.kind==="plan") return head+RP_PER.plan;
  if(s.kind==="curve") return head+RP_PER.curve;
  if(s.kind==="timeline") return head+(s.rows?26*s.rows.length+96:RP_PER.timeline);
  if(s.kind==="cards") return head+Math.ceil(n/(s.cols||2))*RP_PER.cards;
  return head+n*rpPerRow(s)+6;
}
// MEASURED, NOT ESTIMATED. Every constant above is a guess about how text
// wraps, and a guess that is 40px optimistic crops the bottom of a page with
// no warning. So the sections are drawn once into an offscreen box the exact
// width of a page's inner column, their real heights read out of the DOM, and
// the flow packs against those. The estimates are kept only to decide where an
// oversized list splits, and to flow at all when there is no DOM to measure in.
function rpMeasure(secs){
  if(typeof document==="undefined"||!document.body) return null;
  const host=document.createElement("div");
  host.className="rwrap";
  host.style.cssText="position:absolute;left:-99999px;top:0;width:1136px;visibility:hidden;pointer-events:none";
  host.innerHTML='<div class="rpage" style="height:auto;box-shadow:none;width:1136px">'+
    '<div class="rp-in" style="position:static;left:auto;right:auto;top:auto;bottom:auto">'+
    secs.map((s,i)=>'<div data-sk="'+i+'">'+rpDraw(s)+'</div>').join("")+
    "</div></div>";
  document.body.appendChild(host);
  let out=null;
  try{ out=Array.prototype.map.call(host.querySelectorAll("[data-sk]"),el=>el.offsetHeight); }
  finally{ document.body.removeChild(host); }
  return out;
}
function rpDraw(s){ return s.kind==="gap"?window.RP_DESIGN.couldNotSay(s.list):rpSection(s); }

function rpFlow(secs,firstCap,restCap){
  // EVERY PIECE IS CUT TO THE SMALLER PAGE. A piece sized for a continuation
  // page lands on the titled first page and overflows it, so the tighter of
  // the two caps is the one that governs. It costs the odd extra page and
  // makes a cropped page impossible.
  // EVERY PIECE IS CUT TO THE PAGE IT CAN LAND ON. Ordinary sections may land
  // on the titled first page, which is shorter, so they are cut to that. A
  // photo band always gets a page of its own, so cutting it to the shorter one
  // was wrong twice over — it took a two frame band and made it one frame,
  // which is exactly the layout this was meant to replace.
  const fitCap=Math.min(firstCap,restCap);
  // A PHOTO BAND STILL TAKES A PAGE OF ITS OWN, but it no longer gets extra
  // room for it: with the running header gone every content page is the same
  // height, so the band is measured against the ordinary page like everything
  // else. The +22 it used to get was for a header that is no longer there.
  const capOf=(p)=>["shots","plan","curve","timeline"].indexOf(p.kind)>=0?restCap:fitCap;
  let pieces=[];
  (secs||[]).filter(Boolean).forEach(s=>rpSplit(s,capOf(s)).forEach(p=>pieces.push(p)));
  // ---- MEASURE, THEN CUT AGAIN IF IT STILL DOES NOT FIT ----------------
  // The split above works off the estimates, and a row of wrapped text is
  // taller than any constant knows. So the pieces are drawn, measured, and any
  // that still draw taller than a page are cut again in proportion to how far
  // over they are. Four passes is far more than this ever needs; the loop
  // stops as soon as nothing changed.
  let real=rpMeasure(pieces);
  for(let pass=0; pass<4 && real; pass++){
    let changed=false; const next=[];
    pieces.forEach((p,i)=>{
      const hh=real[i]||0, list=(p.cards||p.rows)||[];
      const head=rpHeadH(p);
      const lim=capOf(p);
      // A PLATE AND A PHOTO BAND ARE ONE THING. The loop cut the floor plate
      // into fifteen pieces of five pins each — fifteen pages of confetti,
      // every one of them cropped — because it only knew how to make things
      // smaller by taking rows off them.
      const atomic=["plan","shots","curve","timeline"].indexOf(p.kind)>=0;
      if(!atomic && hh>lim && list.length>1){
        const per=Math.max(1,(hh-head)/list.length);
        const keep=Math.max(1,Math.floor((lim-head)/per));
        if(keep<list.length){ changed=true; rpChunk(p,keep).forEach(x=>next.push(x)); return; }
      }
      next.push(p);
    });
    pieces=next;
    if(!changed) break;
    real=rpMeasure(pieces);
  }
  const H=(i)=>real&&real[i]!=null&&real[i]>0?real[i]:rpHeight(pieces[i]);
  // ---- fill the page before turning it --------------------------------
  // A section that will not fit the room left used to move to the next page
  // whole, which left the first one two thirds white while a twelve row table
  // waited overleaf. If enough of it fits, the rows that fit stay and the rest
  // carry on over the page — which is what a printed report has always done.
  const MIN_KEEP=3;                       // fewer than this is a stub, not a split
  const out=[]; let cur=[], cap=firstCap, used=0;
  const push=()=>{ if(cur.length){ out.push(cur); cur=[]; used=0; cap=restCap; } };
  const heightOf=(p,fallback)=>{ const m=rpMeasure([p]); return (m&&m[0])||fallback; };
  pieces.forEach((p,i)=>{
    let hh=H(i);
    // A PHOTO BAND TAKES THE PAGE. Two frames at this size are the whole
    // point of the page, and anything sharing it either shrinks them or
    // pushes them off the bottom — so the band starts a page and ends one.
    const own=p.kind==="shots"||p.kind==="plan"||p.kind==="curve"||p.kind==="timeline";
    if(used&&(own||used+hh>cap)){
      const list=(p.cards||p.rows)||[];
      const room=cap-used-18;
      const head=rpHeadH(p);
      const per=Math.max(1,(hh-head)/Math.max(1,list.length));
      const fits=Math.floor((room-head)/per);
      if(!own && list.length>MIN_KEEP && fits>=MIN_KEEP && fits<list.length){
        const parts=rpChunk(p,fits);
        cur.push(parts[0]); push();
        parts.slice(1).forEach(q=>{ const qh=heightOf(q,rpHeight(q));
          if(used&&used+qh>cap) push();
          cur.push(q); used+=qh+18; if(used>cap) push(); });
        return;
      }
      push();
    }
    cur.push(p); used+=hh+18;
    if(own||used>cap) push();
  });
  push();
  // PUT BACK TOGETHER ANYTHING THAT ENDED UP ON ONE PAGE. Splitting is a
  // consequence of the page ending, not something the reader should see
  // twice on the same sheet.
  return out.map(pg=>{
    const merged=[];
    pg.forEach(p=>{
      const last=merged[merged.length-1];
      if(last&&p._sid&&last._sid===p._sid){
        const key=p.cards?"cards":"rows";
        last[key]=(last[key]||[]).concat(p[key]||[]);
        return;
      }
      merged.push(Object.assign({},p));
    });
    return merged;
  });
}
function reportPages(r){
  const RD=window.RP_DESIGN, X=state.RP;
  // A REPORT MAY BE ASKED FOR ANOTHER DAY. Only the days the builder could
  // actually build are offered, so a pick can never land on an empty report.
  const c=(r.byDay&&state.repDay&&r.byDay[state.repDay])||r.content;
  const when=String(c.for||""), name=c.title||r.name;
  const foot="SKF India · Pune 7F   ·   "+name+"   ·   "+RD.fmtDay(when);
  const out=[];
  // ---- the cover ----------------------------------------------------
  // THE COVER. Dark navy with a faint grid, or a photograph of the floor
  // under the same scrim where the report carries one. Gold kicker, a two
  // weight headline, a gold rule, then the prose.
  const t2=(name.indexOf("—")>0)?name.split("—")[1].trim():null;
  out.push(RD.cover({
    kick:c.kick||r.group||"Report",
    title:t2?name.split("—")[0].trim():name,
    title2:t2,
    tag:c.tag||null,
    hero:c.hero?RIMG(c.hero):null,
    intro:RD.dates(c.intro||""),
    figures:c.figures||[],
    footL:"SKF INDIA · PUNE 7F   ·   "+(r.clientSafe?"CLIENT ISSUE":"INTERNAL"),
    footR:RD.fmtDay(when)}));

  // ---- the body ------------------------------------------------------
  const secs=(c.sections||[]).slice();
  // The caveat is held back and placed after the flow — see below.
  const gap=(c.couldNotSay&&c.couldNotSay.length)
    ?{kind:"gap",title:null,list:c.couldNotSay}:null;
  // MEASURED AGAINST THE NEW PAGE. The numbered eyebrow and the headline take
  // 148px on the page that carries the title and 52px on every other, so the
  // room is 442 and 538. The old caps were set for a layout that no longer
  // exists and were over on two of the three cases.
  const flowed0=rpFlow(secs,432,528);
  // THE CAVEAT RIDES WITH THE CONTENT. Flowed last it took a sheet of its
  // own — four lines of small print alone on a page, which is how a document
  // announces that nobody laid it out.
  const flowed=flowed0.slice();
  if(gap){
    const last=flowed[flowed.length-1]||[];
    const h=(rpMeasure([gap])||[])[0]||rpHeight(gap);
    const used=(rpMeasure(last)||[]).reduce((t,x)=>t+x+18,0);
    if(flowed.length&&used+h<=528) last.push(gap);
    else flowed.push([gap]);
  }
  flowed.forEach((page,i)=>{
    // THE EYEBROW NAMES THE PAGE, so the section that gave it its name does
    // not print its own heading underneath — "01 WHO WAS ON THE FLOOR" above
    // "Who was on the floor" is the same words twice.
    const lead0=page.find(x=>x.title)||page[0]||{};
    const body=page.map((s,k)=>s.kind==="gap"
      ?RD.couldNotSay(s.list)
      :rpSection(s===lead0?Object.assign({},s,{title:null}):s)).join("");
    // THE PAGE IS NUMBERED AND NAMED. The first section on the page gives it
    // its name, so the marker says what the reader is looking at rather than
    // repeating the report's title on every sheet.
    const lead=page.find(x=>x.title)||page[0]||{};
    const label=(lead.title||name).replace(/ — continued$/,"");
    out.push(RD.page({
      no:String(i+1).padStart(2,"0"),
      eyebrow:label,
      title:i===0?RD.dates(c.headline||name):null,
      sub:i===0?RD.dates(c.sub||""):null,
      body:body,
      footL:"FLIPSPACES · SKF INDIA, PUNE 7F"+(r.clientSafe?"":" · INTERNAL"),
      footR:String(i+2).padStart(2,"0")}));
  });
  return out.join("");
}
function vReports(){
  const X=state.RP, RD=window.RP_DESIGN;
  if(!X) return miss("Reports","reports.json","node tools/reports.js");
  if(!RD) return miss("Reports","the report design module","reload the page");
  const pick=state.repId&&X.reports.find(r=>r.id===state.repId);

  // ---- one report, as pages that print ------------------------------
  if(pick&&pick.status==="live"){
    return `<div class="rwrap">
      <div class="rtoolbar noprint">
        <button class="rbtn back" id="repBack">← All reports</button>
        <button class="rbtn primary" id="repPrint">Save as PDF</button>
        ${(pick.days&&pick.days.length>1)?`<label class="rtip" style="display:flex;align-items:center;gap:6px">
          Day <select class="rbtn" id="repDay" style="padding:6px 9px">${
            pick.days.slice().reverse().map(d=>`<option value="${d}"${
              d===(state.repDay&&pick.byDay[state.repDay]?state.repDay:pick.content.for)?" selected":""
            }>${fmtD(d)}</option>`).join("")}</select></label>`:""}
        <button class="rbtn" id="repZoomOut">−</button>
        <button class="rbtn" id="repZoomIn">+</button>
        <span class="rtip">Print · Destination · Save as PDF. One report page per PDF page —
          set margins to None and turn Background graphics on.</span>
      </div>
      <div class="rstage" id="rstage" style="--rp-scale:${state.repZoom||1}">
        ${reportPages(pick)}
      </div></div>`;
  }

  // ---- the catalogue -------------------------------------------------
  const GRP=["Daily","Weekly","Monthly","Event","Locked"];
  const card=(r)=>{
    const on=r.status==="live";
    const n=on?r.content.sections.reduce((t,s)=>t+((s.rows||s.cards||[]).length),0):0;
    const st=on?["live","sage"]:r.status==="error"?["error","rose"]:["waiting on data","neutral"];
    return `<div class="rcard${on?"":" locked"}">
      <div class="rcard-top"><b>${esc(r.name)}</b>${RD.chip(st[0],st[1])}</div>
      <div class="rcard-tells">${esc(r.tells)}</div>
      <div class="rcard-meta">${esc(r.who)} · ${esc(r.when)}${
        r.clientSafe?` · <span style="color:var(--rp-sage)">client safe</span>`:""}</div>
      ${on?`<div class="rcard-act">
          <button class="rbtn primary" data-rep="${esc(r.id)}">View</button>
          <button class="rbtn" data-repdl="${esc(r.id)}">Download PDF</button>
          <span class="rtip">${n} rows</span>
        </div>`
        :`<div class="rcard-lock">${esc(r.unlock||r.error||"a renderer for this lands later")}</div>`}
    </div>`;
  };
  return `<div class="rwrap"><h2>Reports</h2>
  <p class="sub">Every figure is read from the file the screen reads, so a report and a screen
    cannot disagree. Each page prints as one PDF page, and every number on it can name where it
    came from. ${X.counts.live} build today${X.counts.locked?", "+X.counts.locked+" are locked and say which input would unlock them":""}.</p>
  ${GRP.map(g=>{const rs=X.reports.filter(r=>r.group===g); if(!rs.length) return "";
    return `<div class="p"><div class="ph"><div><h3>${g==="Locked"?"Not yet buildable":g}
      <span class="f" style="font-weight:400">${rs.length}</span></h3></div></div>
      <div class="pb"><div class="rcards">${rs.map(card).join("")}</div></div></div>`;}).join("")}
  </div>`;
}

// ---------- STEP 15 : SAFETY, FROM THE SAME PHOTOGRAPHS ----------
// ---------- THE FRAME A SAFETY LINE WAS RAISED FROM ----------
// Every flag in hse.json carries the day it was seen and the pins it was
// seen at, and every one of those frames is sitting in the project folder.
// The section says "a flag is here because a photograph showed it" and then
// showed no photograph, which asks for trust the rest of this engine never
// asks for.
//
// The laws this keeps, and why each one is here rather than the obvious
// simpler thing:
//   . THE FRAME IS THE ONE FROM THAT PIN ON THAT DAY. Not the newest photo
//     of that pin. A hazard is a fact about a morning, and showing a later
//     frame of the same corner would quietly answer "is it still there?",
//     which is a different question and one nobody asked.
//   . A PIN NOT WALKED THAT DAY IS NAMED, NOT SUBSTITUTED. Falling back to
//     another day would make the flag look evidenced when it is not.
//   . A FLAG WITH NO PIN SAYS SO. Three of the nine are floor-wide
//     observations with no pin recorded; showing any frame beside them
//     would invent a location the reader would then believe.
function evidenceStrip(day, pins){
  const S=state.SHOTS;
  if(!S||!S.shots) return "";                       // the index has not landed yet
  const list=(pins||[]).slice();
  if(!list.length) return `<div class="evn">no pin was recorded against this
    observation, so there is no one frame to show it in.</div>`;
  const onDay=(S.shots[day])||{};
  const have=list.filter(p=>onDay[p]);
  const missing=list.filter(p=>!onDay[p]);
  const thumbs=have.map(p=>{
    const rel=onDay[p];
    return `<button class="evt" data-lb="${esc(rel)}" data-lbcap="Pin ${p} · ${esc(fmtD(day))}"
      title="pin ${p} on ${esc(day)} — click for the full frame">
      <span class="evi"><img loading="lazy" src="/img?p=${encodeURIComponent(rel)}"
        alt="pin ${p} on ${esc(day)}"></span>
      <span class="evc">pin ${p}</span></button>`;}).join("");
  const note=missing.length
    ? `<div class="evn">${missing.length===list.length?"None of these pins were":
        "Pin"+(missing.length>1?"s":"")+" "+missing.join(", ")+" "+(missing.length>1?"were":"was")+" not"}
       walked on ${esc(fmtD(day))}, so no frame exists for
       ${missing.length>1?"them":"it"} that day.</div>`
    : "";
  return `<div class="ev">${thumbs}${note}</div>`;
}

// the full frame, over the page. The caption carries the file name as well
// as the pin and the day, because "which photograph is this" is the first
// thing anybody asks of evidence, and the answer has to be copyable.
function openFrame(rel, cap){
  if(!rel) return;
  const prev=document.querySelector(".lbx"); if(prev) prev.remove();
  const el=document.createElement("div");
  el.className="lbx";
  el.innerHTML=`<img src="/img?p=${encodeURIComponent(rel)}" alt="${esc(cap||rel)}">
    <div class="lbc"><b>${esc(cap||"")}</b><br>${esc(rel)}<br>
      <span style="font-size:11px">click anywhere, or press Escape, to close</span></div>`;
  const close=()=>{ el.remove(); document.removeEventListener("keydown",onKey); };
  const onKey=(ev)=>{ if(ev.key==="Escape") close(); };
  el.onclick=close;
  document.addEventListener("keydown",onKey);
  document.body.appendChild(el);
}

// ---------- STEP 17 : THE DEFECT REGISTER ----------
// The last register on a job and the one most often kept where nobody
// trusts it. Two disciplines: every point has a face and a date, and no
// proof means no closure.

  const N=state.SN;
  if(!N) return miss("Snags","snags.json","node tools/snags.js");
  const C=N.counts, SEV={high:"var(--bad)",med:"var(--warn)",low:"var(--mut)"};
  const ST={open:"var(--bad)",wip:"var(--warn)",closed:"var(--ok)",invalid:"var(--mut)"};
  return `<h2>Snags</h2>
  <p class="sub">Every point has an owner and a date, age is counted from the day it was raised,
    and closing one needs a dated proof. There is no override.</p>

  <div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v" style="color:${C.open?"var(--bad)":"var(--ok)"}">${C.open}</div>
      <div class="k">open${C.wip?" · "+C.wip+" in hand":""}</div></div>
    <div class="g"><div class="v" style="color:var(--bad)">${C.overdue}</div>
      <div class="k">past their date${C.high?" · "+C.high+" high severity":""}</div></div>
    <div class="g"><div class="v" style="color:var(--ok)">${C.closed}</div>
      <div class="k">closed with proof${C.reopened?` · <span style="color:var(--bad)">${C.reopened} reopened</span>`:""}</div></div>
    <div class="g"><div class="v">${cr(N.money.retention)}</div>
      <div class="k">on RA6, against a snag-free site and a 12 month guarantee</div></div>
  </div></div>
  ${N.when.why?`<div class="pb" style="border-top:1px solid var(--line);padding-top:9px">
    <div class="e" style="border:0;padding:0;color:var(--warn)">${esc(N.when.why)}</div></div>`:""}
  </div>

  <div class="p"><div class="ph"><div><h3>The register</h3>
    ${N.empty?`<p>Empty. Not one defect has been raised, and none has been invented — the walk
      notes mention broken, cracked and gap 1,872 times and nearly every one is the reader saying
      there is none.</p>`:`<p>${N.burn.why}</p>`}</div>
    <div><a id="snagNew" class="f" style="cursor:pointer;font-size:12px">raise one</a></div></div>
    <div class="pb" style="padding:0">${N.rows.length?`
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr class="f" style="font-size:10.4px;letter-spacing:.04em;text-transform:uppercase">
          <td style="padding-bottom:5px">what</td><td>where</td><td class="n">sev</td>
          <td>owner</td><td class="n">raised</td><td class="n">due</td><td class="n">age</td>
          <td style="padding-left:12px">state</td></tr>
        ${N.rows.map(r=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:5px 8px 5px 0">${esc(r.what)}
            ${r.reopened?`<div style="color:var(--bad);font-size:11px">${esc(r.reopenedWhy)}</div>`:""}
            ${!r.valid?`<div style="color:var(--mut);font-size:11px">${esc(r.faults.join(", "))}</div>`:""}</td>
          <td class="f">${esc(r.area||"")}${r.pin?" · pin "+r.pin:""}</td>
          <td class="n" style="color:${SEV[r.sev]}">${esc(r.sev||"—")}</td>
          <td class="f">${esc(r.owner||r.side||"—")}</td>
          <td class="n f" style="white-space:nowrap">${fmtD(r.raised)}</td>
          <td class="n" style="white-space:nowrap;color:${r.overdue?"var(--bad)":"var(--fnt)"}">${

          <td class="n">${r.age==null?"—":r.age+"d"}</td>
          <td style="padding-left:12px"><a data-snag="${esc(r.id)}" style="cursor:pointer;color:${
            ST[r.state]}">${esc(r.state)}</a></td></tr>`).join("")}

    </div>

  <div class="p"><div class="ph"><div><h3>Worth walking</h3>

function snagDlg(){
  const N=state.SN; if(!N||!state.snagOpen) return "";
  const id=state.snagOpen==="new"?null:state.snagOpen;
  const r=id?N.rows.find(x=>x.id===id):null;
  if(id&&!r) return "";
  const opt=(n,v,cur)=>`<option value="${v}"${cur===v?" selected":""}>${n}</option>`;
  const F=(id2,label,inner)=>`<div style="margin-top:9px">
    <div class="f" style="font-size:11px;margin-bottom:3px">${label}</div>${inner}</div>`;
  const inp=`background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12.5px;font-family:inherit;width:100%`;
  return `<div class="ovl" id="snagovl"><div class="dlg">
    <h3>${r?"That defect":"Raise a defect"}</h3>
    ${r?`<div class="f" style="font-size:11.4px">raised ${fmtD(r.raised)} by ${esc(r.by||"—")} ·
      ${r.age}d old${r.overdue?` · <span style="color:var(--bad)">${r.lateBy}d past its date</span>`:""}</div>`:""}
    ${F("sgWhat","What is wrong",`<textarea id="sgWhat" rows="2" style="${inp};resize:vertical">${
      r?esc(r.what):""}</textarea>`)}
    <div style="display:flex;gap:8px">
      ${F("sgArea","Where",`<input id="sgArea" style="${inp}" value="${r?esc(r.area||""):esc(state.snagAt||"")}">`)}
      ${F("sgPin","Pin",`<input id="sgPin" style="${inp}" value="${r&&r.pin?r.pin:""}">`)}
    </div>
    <div style="display:flex;gap:8px">
      ${F("sgSev","Severity",`<select id="sgSev" style="${inp}">${
        ["high","med","low"].map(v=>opt(v,v,r?r.sev:"med")).join("")}</select>`)}
      ${F("sgSide","Whose",`<select id="sgSide" style="${inp}">${
        [["us","us"],["client","client"],["builder","builder"]].map(([n,v])=>opt(n,v,r?r.side:"us")).join("")}</select>`)}
      ${F("sgOwner","Who by name",`<input id="sgOwner" style="${inp}" value="${r?esc(r.owner||""):""}">`)}
    </div>
    ${F("sgDue","Due",`<input id="sgDue" type="date" style="${inp}" value="${r&&r.due?r.due:""}">`)}
    ${r&&r.dueDerived?`<div class="f" style="font-size:11.2px;margin-top:3px">${esc(r.dueWhy)}</div>`:""}

    ${r?`<div style="background:var(--card2);border:1px solid var(--line);border-radius:9px;
      padding:9px 11px;margin-top:12px">
      <div class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase">closing it</div>
      <div style="font-size:12px;color:var(--fnt);margin-top:4px">A defect is not closed because

        checked it. There is no override on this register.</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="sgProof" placeholder="what proves it" style="${inp}">
        <input id="sgProofBy" placeholder="checked by" style="${inp};max-width:150px">

      <button class="opt" id="sgSave" style="width:auto;margin:0;padding:8px 16px"><b>${

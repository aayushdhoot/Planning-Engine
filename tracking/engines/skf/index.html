   <div class="r">${withCand.length} of ${q.length} have a candidate</div></div>
   <div class="pb"><table><thead><tr><th style="width:24%">Area</th><th class="n" style="width:90px">Size</th>
     <th style="width:38%">What the engine can see</th><th>Name it</th></tr></thead>
   <tbody>${q.map(row).join("")}</tbody></table>
   <div style="display:flex;gap:12px;align-items:center;margin-top:12px">
     <button id="saveNames" style="background:var(--acc);border:0;color:#fff;border-radius:9px;padding:9px 20px;font-size:13px;font-weight:650;cursor:pointer">
       ${state.savingNames?"saving…":"Save these names"}</button>
     <span class="f" style="font-size:11.5px">${esc(state.namesSaid||"Saved to the project, then the register is rebuilt on the spot.")}</span>
   </div></div></div>`:""}

 <div class="p"><div class="ph"><div><h3>Nothing is counted twice</h3>
   <p>${esc(w.why||"")}</p></div><div class="r">${(w.multi||[]).length} areas</div></div>
   <div class="pb"><table><thead><tr><th style="width:44%">Area</th><th class="n" style="width:90px">Size</th><th>Pins that see it</th></tr></thead>
   <tbody>${(w.multi||[]).slice(0,12).map(m=>`<tr><td>${esc(m.area)}</td><td class="n">${N(m.sqft)} sqft</td>
     <td class="m">${m.pins.join(", ")}</td></tr>`).join("")}</tbody></table>
   ${(w.multi||[]).length>12?`<div class="src" style="margin-top:8px">and ${(w.multi||[]).length-12} more</div>`:""}</div></div>

 <div class="p"><div class="ph"><div><h3>The 3D renders</h3>
   <p>One render per pin is the reference frame every later site photo of that pin is compared against.
   A render says what the room holds when it is done; it never says any of it is built.</p></div>
   <div class="r">${rn.delivered||0} of ${rn.expected||0}</div></div>
   <div class="pb">
     ${(rn.missing||[]).length?`<div class="e" style="border-left:3px solid var(--warn);margin-bottom:10px">
       <b>${(rn.missing||[]).length} pins have no render:</b> ${(rn.missing||[]).join(", ")}.

     ${(rn.offProtocol||[]).length?`<div class="src">${(rn.offProtocol||[]).length} do not follow the brief's naming
       (the brief asked for P01.jpg to P81.jpg, no suffixes). They are read anyway, and the suffixes are used as evidence
       for what the design team called the place.</div>`:""}
   </div></div>`;
}

// ---------- STEP 2 : rooms & zones ----------
function vMap(){
 const F=state.F; if(!F) return `<div class="e">reading…</div>`;
 const S=window.INGEST_SPACES, r=S.rooms(F.facts);
 const byWhy={}; r.rejected.forEach(x=>byWhy[x.why]=(byWhy[x.why]||0)+1);
 const unk=[...new Map(r.unknown.map(u=>[u.label,u])).values()];

 const row=x=>`<tr>
   <td><b>${esc(x.name)}</b>${x.pax?` <span class="f">· ${x.pax} pax</span>`:""}
     ${x.saidAs.length>1?`<div class="src">said as: ${x.saidAs.map(esc).join(" | ")}</div>`:""}</td>
   <td class="n">${x.sqft!=null?N(x.sqft)+" sqft":`<span style="color:var(--bad)">${x.conflict.map(N).join(" vs ")}</span>`}</td>
   <td>${x.conf==="measured"?`<span class="c ok">measured</span>`
        :x.conf==="conflict"?`<span class="c bad">two areas</span>`
        :`<span class="c warn">shared polygon</span>`}</td>
   <td class="f"><div class="src">${esc(x.readings[0].source.where)}</div>
     ${x.conf!=="measured"?`<div style="font-size:11px;margin-top:2px">${
       x.conf==="conflict"
        ? "the drawing gives this room two different areas — the engine will not average them"
        : "its polygon carries another label too, so which room the area belongs to is not established"}</div>`:""}</td></tr>`;

 const G=state.A;
 pinPairDefault();
 return `<h2>Areas</h2>
 <p class="sub" style="margin-bottom:12px">An area is the unit of account: every quantity hangs on one, and every area appears once.
 A pin is a witness to an area — it never adds a quantity, only a verdict. Click a room to pick it out; click a pin to jump to its area.</p>

 ${(()=>{ const A=state.AS; if(!A||!A.counts||!A.counts.unframed.length) return "";
   // A PIN WITH NO RENDER IS A BLIND SPOT, NOT A GAP IN THE WALK. These five
   // positions were photographed on every round and read in full on 6 August.
   // Nothing seen at them can ever be scored, because scoring means comparing
   // a photograph against a statement of the finished room and no such

   return `<div class="p"><div class="ph"><div><h3>${u.length} pins the engine is blind to</h3>

         <span style="font-size:11px">${A.pins[p]&&A.pins[p].walkedOn?A.pins[p].walkedOn.length:0} walks read</span></a>`).join("")}
     </div>
     <div class="f" style="font-size:11.4px;margin-top:9px">One render each closes this.
       Until then their work is invisible to every percentage on the programme.</div>
     </div></div>`;})()}
 <div class="p"><div class="ph"><div><h3>The pin, side by side</h3>
   <p>Left is the only statement anybody made about what this exact view holds when the room is finished.
   Right is what the camera saw. Every verdict this engine reaches is a machine reading of these two pictures.</p></div></div>

function saveCounts(){
 const code=state.openCount; if(!code) return;
 const out={}; out[code]={};
 Object.keys(state.counts[code]||{}).forEach(k=>{const n=Number(state.counts[code][k]); if(n>0) out[code][k]=n;});
 state.savingCounts=true; state.countsSaid=null; render();
 fetch("/counts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(out)})
  .then(r=>r.json())
  .then(j=>{
    if(!j.ok) throw new Error(j.error||"the re-plan failed");
    state.countsSaid=code+" placed in "+Object.keys(out[code]).length+" rooms · "+
      j.zonedCodes+" trades now zoned, "+j.notZoned+" still at floor level"+
      (j.finish?" · finishes "+j.finish+(j.hits?" — hits the client date":""):"");
  })
  .catch(e=>{ state.countsSaid="could not save: "+e.message; })
  .then(()=>fetch("plan.json?t="+Date.now()).then(r=>r.json()).then(j=>{state.PL=j;}).catch(()=>{}))
  .then(()=>{ state.savingCounts=false; render(); });
}

// ---------- STEP 3 : the schedule ----------
// Three numbers travel together, always: what became work, what is parked
// with no task, and what matched a task but cannot produce a duration. A
// date quoted without them is a date that has quietly left work out.
// ---------- STEP 3 : the programme ----------
// THE SCHEDULE PAGE SHOWS THE SCHEDULE. What used to be here was the bill,
// the coverage, the parked lines, the manpower sweep and the unzoned counts —
// all true, none of it a programme, and together they buried the one thing
// the page is for. Everything they said is still computed and still on the
// log; it belongs on the pages that own it, not in front of a chart.
//
//   . THREE LEVELS, AND THE MIDDLE ONE IS THE ARGUMENT. A category is the
//     phase of a fit-out; a package is one trade's work of one kind, and it
//     is the row a PM pushes back on; a task is that package in one room,
//     which is what a gang is actually sent to do.
//   . PARALLEL IS THE DEFAULT. Bars overlap because the work overlaps. Where
//     one waits on another the link says so, and says WHY.
//   . PLANNED AND ACTUAL SHARE A BAR, NEVER TWO. The plan is the outline and
//     progress fills it, so being behind is a gap you can see rather than
//     two numbers to subtract.
//   . A DAY NOBODY WALKED HAS NO ACTUAL, and the page says so rather than
//     drawing nought.
function schedState(){
  const S=state.SCH; if(!S) return null;
  // A REMEMBERED DAY THAT IS NO LONGER ON THE LOG IS NOT A DAY. Re-reading the
  // site can add or drop walks, and holding a stale one shows an empty
  // comparison and blames the reader for it.
  // THE PAGE FOLLOWS THE SITE. A day the user picked is remembered, but the
  // moment a NEWER walk lands the page moves to it — a saved 3 August left
  // the whole floor reading three days stale after 1,559 fresh observations
  // went on the log, which is the one thing a progress page must never do.
  // Picking an older day from the dropdown still works; it just does not
  // survive the arrival of a newer one.
  const LAST=(S.days||[])[(S.days||[]).length-1]||null;
  if(state.schDay!=null && (S.days||[]).indexOf(state.schDay)===-1) state.schDay=null;
  if(state.schDay!=null && LAST && state.schDay<LAST && state.schDayPicked!==LAST) state.schDay=null;
  if(state.schDay==null) state.schDay=LAST;
  state.schDayPicked=LAST;
  if(state.schMode==null) state.schMode="progress";
  if(state.schZoom==null) state.schZoom="week";
  if(state.schCol1==null) state.schCol1=260;
  if(state.schOpen==null) state.schOpen={};
  return S;
}

// ===================================================================
// THE FOUR MODULES THE PLANNING ENGINE OWNS
//
// Schedule, manpower, procurement and design are authored in the planning
// engine and rendered here in the same shape, with the same columns and the
// same wording, so a person moving between the two apps is reading one
// programme and not two descriptions of one.
//
// WHAT IS DELIBERATE ABOUT THIS
//   . NOTHING IS RECOMPUTED HERE. The planning engine's CPM, levelling, lead
//     times and drawing back-scheduling are the plan. Re-deriving any of it in
//     this file would produce a second answer that drifts, which is the exact
//     problem this replaces.
//   . AN EDIT IS AN OVERLAY, NOT A REWRITE. Changing a vendor or a status here
//     writes one field to the shared store. The computed plan underneath is
//     untouched, so the next re-plan does not have to choose between honouring
//     the correction and honouring the computation — it keeps both.
//   . NO PROGRAMME IS A STATED ABSENCE. If nothing has been pushed the screen
//     says so and says how to push it, rather than drawing an empty table that
//     reads as "there is no work".
// ===================================================================
const PE_CATS=[["all","All"],["schedule","Schedule & Milestones"],["design","Design"],
               ["procurement","Procurement"],["execution","Execution"]];
const PE_DEPTHS=[["wbs","WBS level","work breakdown only — project and its four streams"],
                 ["summary","Summary level","summary rows — each stream broken into its sections"],
                 ["activity","Activity level","every activity, collapsible by hand"]];
const PE_STATUS={complete:["ok","Complete"],in_progress:["info","In progress"],
                 delayed:["bad","Delayed"],not_started:["","Not started"]};
const PE_DAY=86400000;
// its own month table on purpose: the MON arrays elsewhere in this file are
// declared inside functions, so they are not in scope here, and the one at the
// top belongs to the inlined report module. Sharing by coincidence of name is
// how a screen breaks the first time somebody moves a helper.
const PE_MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const peIso=s=>Date.parse(s+"T00:00:00Z");
const peFmt=s=>{ if(!s) return "—";
  const d=new Date(peIso(s));
  if(isNaN(d.getTime())) return String(s);
  return String(d.getUTCDate()).padStart(2,"0")+" "+PE_MON[d.getUTCMonth()]+" "+String(d.getUTCFullYear()).slice(2); };

function peMods(){ return (state.SYNC&&state.SYNC.modules)||null; }
function peToday(){ return new Date().toISOString().slice(0,10); }

// ---- THREE LAYERS UNDER EVERY CELL -------------------------------------
//   the plan       what the planning engine computed
//   pushed         corrections already sent to the shared store
//   pending        corrections made here and NOT yet sent
//
// Edits used to go straight to the store on blur. That is the wrong default for
// this side of the fence: a person on site is often part-way through a thought,
// and every keystroke landing in the planner's screen makes a working note look
// like a decision. Changes are held here until they are pushed on purpose, and
// can be thrown away before that without the other app ever having seen them.
function pePending(){ return state.pending||(state.pending={}); }
function pePendingCount(){
  const p=pePending(); let n=0;
  for(const r in p) n+=Object.keys(p[r]).length;
  return n;
}
// the overlay, read the same way the planning engine's val() reads it —
// pending on top, because what you just typed is what you should see
function peVal(rowId, field, fallback){
  const p=pePending();
  if(p[rowId]&&p[rowId][field]!==undefined) return p[rowId][field];
  const e=(state.SYNC&&state.SYNC.edits)||{};
  const v=e[rowId]&&e[rowId][field];
  return (v===undefined||v===null)?fallback:v;
}
function peEdited(rowId, field){
  const e=(state.SYNC&&state.SYNC.edits)||{};
  return !!(e[rowId]&&e[rowId][field]!==undefined&&e[rowId][field]!==null);
}
function pePendingAt(rowId, field){
  const p=pePending();
  return !!(p[rowId]&&p[rowId][field]!==undefined);
}
function peStage(rowId, field, value){
  const p=pePending();
  (p[rowId]=p[rowId]||{})[field]=value;
  renderPendingBar();
}
function peDiscard(){
  state.pending={};
  render();
}
function pePush(){
  const p=pePending();
  if(!pePendingCount()) return Promise.resolve(null);
  state.pushing=true; renderPendingBar();
  return syncEditBatch(p).then(j=>{
    state.pushing=false;
    if(j&&j.ok){ state.pending={}; render(); }
    else { state.pushErr=(j&&j.error)||"the store did not answer"; renderPendingBar(); }
    return j;
  });
}
// Clearing a PUSHED correction is a different act from discarding a pending one,
// and it needs the other app to hear about it — so it is a push of nulls rather
// than a local forget.
function peRevertPushed(){
  const e=(state.SYNC&&state.SYNC.edits)||{};
  const rows=Object.keys(e);
  if(!rows.length) return Promise.resolve(null);
  const nulls={}; rows.forEach(r=>nulls[r]=null);
  state.pushing=true; renderPendingBar();
  return syncEditBatch(nulls).then(j=>{ state.pushing=false; state.pending={}; render(); return j; });
}

// what to show when the planning engine has not pushed anything yet
function peEmpty(title, what){

    <p>This screen shows what the planning engine computed. Nothing has arrived for this
       project, so there is nothing to show — rather than an empty table, which would read
       as "no work".</p></div>
    <div class="r"><span class="c warn">waiting</span></div></div>
  <div class="pb"><div class="e" style="border:0;padding:0">

// the head every one of the four carries: where it came from, and when
function peSource(){
  const s=state.SYNC;
  if(!s||!s.pushedAt) return "";
  const edited=Object.keys(s.edits||{}).length;

// ---------- 3 · SCHEDULE — the PERT, the Gantt and the S-curve ----------

// ---- the PERT table, column for column as the planning engine prints it ----
function pePertFlatten(nodes, collapsed){
  const out=[];
  const walk=list=>{ for(const n of list){ out.push(n);
    if(n.children.length&&!collapsed.has(n.id)) walk(n.children); } };
  walk(nodes); return out;
}
function pePertCollapseFor(tree, depth){
  const s=new Set();
  if(depth==="activity") return s;
  const max=depth==="wbs"?1:2;
  const walk=n=>{ if(n.level>=max&&n.children.length) s.add(n.id); n.children.forEach(walk); };
  if(tree.root) walk(tree.root);
  return s;
}
function pePertDescendants(nodes){
  const out=[]; const walk=list=>{ for(const n of list){ if(n.children.length){ out.push(n.id); walk(n.children); } } };
  walk(nodes); return out;
}

function pePertTable(M, today){
  const tree=M.pert;
  if(!tree||!tree.root) return `<div class="e">No PERT programme available for this project.</div>`;
  const cat=state.peCat||"all";
  const depth=state.peDepth||"summary";
  if(!state.peCollapsed) state.peCollapsed=pePertCollapseFor(tree,depth);
  const collapsed=state.peCollapsed;
  const roots=cat==="all"?[tree.root]:(tree.byCategory[cat]||[]);
  const visible=pePertFlatten(roots,collapsed);

  const all=pePertFlatten(roots,new Set());
  const starts=all.map(n=>n.start).filter(Boolean);
  const finishes=all.map(n=>n.finish).filter(Boolean);
  const range=starts.length?{min:starts.reduce((a,b)=>a<b?a:b),
    max:finishes.reduce((a,b)=>a>b?a:b,starts[0])}:null;
  if(range) range.days=Math.max(1,Math.round((peIso(range.max)-peIso(range.min))/PE_DAY)+1);

  const bar=n=>{
    if(!range||!n.start||!n.finish) return "";
    const left=((peIso(n.start)-peIso(range.min))/PE_DAY/range.days)*100;
    const w=Math.max(0.6,((peIso(n.finish)-peIso(n.start))/PE_DAY+1)/range.days*100);
    const col=n.status==="delayed"?"var(--bad)":n.status==="complete"?"var(--ok)"
      :n.isSummary?"var(--ext)":"var(--acc)";
    return `<div style="position:relative;height:14px;min-width:200px">
      <div style="position:absolute;left:${left.toFixed(2)}%;width:${w.toFixed(2)}%;top:3px;
        height:${n.isSummary?6:9}px;background:${col};border-radius:3px;opacity:${n.isSummary?.85:1}"></div>
      ${n.percentComplete>0&&n.percentComplete<100?`<div style="position:absolute;left:${left.toFixed(2)}%;
        width:${(w*n.percentComplete/100).toFixed(2)}%;top:3px;height:${n.isSummary?6:9}px;
        background:rgba(0,0,0,.4);border-radius:3px"></div>`:""}</div>`;
  };

  const rows=visible.map(n=>{
    const st=PE_STATUS[n.status]||["",n.status];
    return `<tr class="pel${Math.min(n.level,3)}${n.status==="delayed"?" pelate":""}${n.status==="complete"?" pedone":""}">
      <td class="n f">${n.id}</td>
      <td style="padding-left:${11+n.level*16}px">${
        n.children.length?`<button class="petw" data-petoggle="${n.id}">${collapsed.has(n.id)?"▸":"▾"}</button>`
                         :`<span style="display:inline-block;width:22px"></span>`}${esc(n.name)}</td>
      <td class="n">${n.durationDays} d</td>
      <td class="n">${peFmt(n.start)}</td>
      <td class="n">${peFmt(n.finish)}</td>
      <td class="n f">${peFmt(n.actualStart)}</td>
      <td class="n f">${peFmt(n.actualFinish)}</td>
      <td class="n">${n.percentComplete}%</td>
      <td>${st[1]==="Not started"?`<span class="f">${st[1]}</span>`:`<span class="c ${st[0]}">${st[1]}</span>`}</td>
      ${state.peBars?`<td>${bar(n)}</td>`:""}
    </tr>`;}).join("");

// ---- the Gantt, same geometry as the planning engine's SVG ----
function peGantt(M, today){
  const acts=M.gantt.activities;
  if(!acts.length) return `<div class="e">No activities in this programme.</div>`;
  const g=M.gantt;
  const start=peIso(g.externalStart||acts[0].startDate);
  const end=Math.max(peIso(g.externalEnd||acts[acts.length-1].endDate),
    ...acts.map(a=>peIso(a.endDate)));
  const totalDays=Math.round((end-start)/PE_DAY)+1;
  const px=7, rowH=18, labelW=250;
  const W=labelW+totalDays*px+20, H=acts.length*rowH+46;
  const X=d=>labelW+Math.round((peIso(d)-start)/PE_DAY)*px;
  const inRange=d=>peIso(d)>=start&&peIso(d)<=end;

  let ticks="";
  for(let t=start;t<=end;t+=PE_DAY){ const dt=new Date(t);
    if(dt.getUTCDate()===1||t===start){ const x=labelW+Math.round((t-start)/PE_DAY)*px;
      ticks+=`<line x1="${x}" y1="20" x2="${x}" y2="${H-4}" stroke="var(--line)"/>
        <text x="${x+3}" y="14" fill="var(--fnt)" font-size="10">${PE_MON[dt.getUTCMonth()]} ${String(dt.getUTCFullYear()).slice(2)}</text>`; } }

  const marks=[
    g.externalEnd?`<line x1="${X(g.externalEnd)}" y1="18" x2="${X(g.externalEnd)}" y2="${H-4}" stroke="var(--ext)" stroke-dasharray="4 3"/><text x="${X(g.externalEnd)+4}" y="${H-8}" fill="var(--ext)" font-size="10">client end ${esc(g.externalEnd)}</text>`:"",
    g.internalEnd?`<line x1="${X(g.internalEnd)}" y1="18" x2="${X(g.internalEnd)}" y2="${H-4}" stroke="var(--ok)" stroke-dasharray="4 3"/><text x="${X(g.internalEnd)+4}" y="${H-20}" fill="var(--ok)" font-size="10">internal finish ${esc(g.internalEnd)}</text>`:"",
    (g.internalTarget&&g.internalTarget!==g.internalEnd&&inRange(g.internalTarget))?`<line x1="${X(g.internalTarget)}" y1="18" x2="${X(g.internalTarget)}" y2="${H-4}" stroke="var(--warn)" stroke-dasharray="2 3"/><text x="${X(g.internalTarget)+4}" y="${H-32}" fill="var(--warn)" font-size="10">target ${esc(g.internalTarget)}</text>`:"",
    inRange(today)?`<line x1="${X(today)}" y1="18" x2="${X(today)}" y2="${H-4}" stroke="var(--bad)" stroke-width="1.5"/><text x="${X(today)+4}" y="${H-44}" fill="var(--bad)" font-size="10" font-weight="600">today</text>`:""
  ].join("");

  const bars=acts.map((a,i)=>{
    const y=26+i*rowH, x1=X(a.startDate), w=Math.max(px,X(a.endDate)-x1+px);
    const pct=Math.max(0,Math.min(100,a.percentComplete==null?0:a.percentComplete));
    // BEHIND MEANS THE WINDOW PASSED AND NOBODY SIGNED IT OFF. A date going by is
    // not evidence of work, so an activity whose window has gone with less than
    // 100 recorded reads as behind — never as done.
    const behind=a.endDate<today&&pct<100;
    const fill=a.critical?"var(--bad)":"var(--acc)";
    const nm=a.name.length>34?a.name.slice(0,33)+"…":a.name;
    return `<g><text x="6" y="${y+11}" fill="${behind?"var(--bad)":"var(--ink)"}" font-size="11">${esc(nm)}</text>
      ${a.totalFloat>0?`<rect x="${x1+w}" y="${y+4}" width="${a.totalFloat*px}" height="8" fill="var(--line2)" rx="2"/>`:""}
      <rect x="${x1}" y="${y+2}" width="${w}" height="12" rx="3" fill="${fill}" opacity="${pct>0?.3:(a.critical?.95:.85)}">
        <title>${esc(a.name+"\n"+a.startDate+" → "+a.endDate+" ("+a.durationDays+"d)\nfloat "+a.totalFloat+"d"+(a.critical?" · CRITICAL":"")+(a.percentComplete!=null?"\nrecorded "+pct+"% complete":"\nno progress recorded"))}</title></rect>
      ${pct>0?`<rect x="${x1}" y="${y+2}" width="${Math.max(2,w*pct/100).toFixed(1)}" height="12" rx="3"
        fill="${pct>=100?"var(--ok)":fill}"><title>${esc(a.name+" — "+pct+"% complete")}</title></rect>`:""}
      ${behind?`<rect x="${x1+w}" y="${y+2}" width="3" height="12" fill="var(--bad)"/>`:""}</g>`;}).join("");

  const withProg=acts.filter(a=>a.percentComplete!=null&&a.percentComplete>0).length;
  return `<div class="pelegend" style="margin-bottom:8px">
      <span><i class="sw" style="background:var(--acc)"></i>Activity</span>
      <span><i class="sw" style="background:var(--bad)"></i>Critical</span>
      <span><i class="sw" style="background:var(--line2)"></i>Float</span>
      <span><i class="sw" style="background:var(--ok)"></i>Recorded complete</span>
      <span class="f">${withProg?withProg+" of "+acts.length+" activities carry recorded progress":"no progress recorded yet"}</span>
    </div>
    <div class="pescroll wide"><svg width="${W}" height="${H}" role="img"
      aria-label="Project Gantt chart">${ticks}${marks}${bars}</svg></div>`;
}

// ---- the S-curve, planned against what has actually been recorded ----
function peSCurve(M, today){
  const c=M.scurve;
  if(!c||!c.points||c.points.length<2) return `<div class="e">Not enough of a programme to draw a curve.</div>`;
  const pts=c.points, W=900,H=300,PAD={l:44,r:16,t:14,b:34};
  const t0=peIso(pts[0].date), t1=peIso(pts[pts.length-1].date), span=Math.max(1,t1-t0);
  const X=d=>PAD.l+((peIso(d)-t0)/span)*(W-PAD.l-PAD.r);
  const Y=p=>PAD.t+(1-p/100)*(H-PAD.t-PAD.b);
  const path=sel=>{ const segs=[]; let open=false;
    for(const p of pts){ const v=sel(p); if(v===null||v===undefined){ open=false; continue; }
      segs.push((open?"L":"M")+X(p.date).toFixed(1)+","+Y(v).toFixed(1)); open=true; }
    return segs.join(" "); };
  const area=()=>`M${PAD.l},${Y(0)} L`+pts.map(p=>X(p.date).toFixed(1)+","+Y(p.planned).toFixed(1)).join(" L")
    +` L${X(pts[pts.length-1].date).toFixed(1)},${Y(0)} Z`;
  let seen="", ticks="";
  for(const p of pts){ const k=p.date.slice(0,7); if(k!==seen){ seen=k;
    const d=new Date(peIso(p.date));
    ticks+=`<text x="${X(p.date).toFixed(1)}" y="${H-12}" fill="var(--fnt)" font-size="10" text-anchor="middle">${PE_MON[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}</text>`; } }
  const grid=[0,25,50,75,100].map(g=>`<line x1="${PAD.l}" y1="${Y(g)}" x2="${W-PAD.r}" y2="${Y(g)}" stroke="var(--line)"/>
    <text x="${PAD.l-8}" y="${Y(g)+3}" text-anchor="end" fill="var(--fnt)" font-size="10">${g}%</text>`).join("");

  return `<div class="grid" style="margin-bottom:12px">
      <div class="g"><div class="k">PLANNED TODAY</div><div class="v">${c.plannedToday}%</div></div>
      <div class="g"><div class="k">ACTUAL TODAY</div><div class="v">${c.actualToday}%</div></div>
      <div class="g"><div class="k">VARIANCE</div>
        <div class="v" style="color:var(--${c.varianceToday<0?"bad":"ok"})">${c.varianceToday>0?"+":""}${c.varianceToday}%</div>
        <div class="k" style="margin-top:2px">${c.varianceToday<0?"behind the curve":"on or ahead"}</div></div>
      <div class="g"><div class="k">WORK CONTENT</div><div class="v">${N(c.totalManDays)}</div>
        <div class="k" style="margin-top:2px">man-days the curve weights by</div></div>
    </div>
    <div class="pescroll wide"><svg width="${W}" height="${H}" role="img"
      aria-label="Planned versus actual progress S-curve">
      ${grid}${ticks}
      <path d="${area()}" fill="var(--acc)" opacity="0.09"/>
      <path d="${path(p=>p.planned)}" fill="none" stroke="var(--acc)" stroke-width="2"/>
      <path d="${path(p=>p.actual)}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>
      ${X(today)>=PAD.l&&X(today)<=W-PAD.r?`<line x1="${X(today)}" y1="${PAD.t}" x2="${X(today)}" y2="${H-PAD.b}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${X(today)+4}" y="${PAD.t+10}" fill="var(--bad)" font-size="10" font-weight="600">today</text>`:""}
      <g transform="translate(${PAD.l+8},${PAD.t+6})">
        <rect x="0" y="0" width="10" height="3" fill="var(--acc)"/><text x="16" y="4" font-size="10" fill="#9aa0b0">planned</text>
        <rect x="70" y="0" width="10" height="3" fill="var(--ok)"/><text x="86" y="4" font-size="10" fill="#9aa0b0">actual (recorded)</text>
      </g></svg></div>`;
}

  // which the planner computes before anyone has touched a status — so a screen
  // where nineteen drawings read "Completed" still headlined "APPROVED 0". The
  // summary is the plan's opening position; the overlay is what has happened
  // since, and the count has to include it or the two halves of one screen
  // disagree.
  const approvedOf=r=>peVal(r.id,"statusClient",r.statusClient)==="Completed";
  const s={ drawings:rows.length,
    approved:rows.filter(approvedOf).length,

      <tbody>${show.map(r=>`<tr>
        <td><span class="c">${esc(r.category)}</span></td>

        <td>${sel(r.id,"statusInt",peVal(r.id,"statusInt",r.statusInt))}</td>
        <td class="n">${esc(r.approvalBy||"—")}</td>
        <td>${sel(r.id,"statusClient",peVal(r.id,"statusClient",r.statusClient))}</td>
        <td class="f" style="font-size:11px">${esc((r.releases||[]).join(", ")||"—")}</td>
      </tr>`).join("")}</tbody></table></div></div></div>`;
}

  <div class="p"><div class="ph"><div><h3>The list</h3>

  <div class="pb" style="padding:0 0 12px">

        <td style="white-space:normal;max-width:380px">${esc(r.description)}
          ${r.source==="derived"?`<div class="f" style="font-size:10px">from schedule</div>`:""}</td>

        <td class="n">${esc(r.endDate||"—")}</td>
        <td class="n"><input class="peinp" type="date" data-perow="${esc(r.id)}" data-pefield="revised"
          value="${esc(peVal(r.id,"revised",r.revisedDate||""))}"></td>
        <td><input class="peinp" data-perow="${esc(r.id)}" data-pefield="notes" placeholder="notes"
          value="${esc(peVal(r.id,"notes",r.notes||""))}"></td>

function vSched(){
  const S=schedState();
  if(!S) return `<h2>Schedule</h2><div class="p"><div class="pb"><div class="e">
    schedule.json has not been built yet — run <code>node tools/schedule.js</code>.</div></div></div>`;

  const projected   = state.schMode==="projected";
  const withProgress = state.schMode==="progress" && state.schDay;
  const pr = withProgress ? (S.progress||{})[state.schDay] : null;

  // ---- THE TIME AXIS IS MEASURED IN PIXELS, NOT PER CENT ------------------
  // Per cent fits any width, which sounds like a virtue and is the reason a
  // five-month programme squeezed into a column too narrow to see a week in.
  // A day is worth a fixed number of pixels, the chart is as wide as the job
  // needs, and the box scrolls. That is also what makes a week tick, a day
  // tick, a today line and a comparison line all land in the same place.
  // THE CHART MUST CONTAIN THE DATE IT IS BUILT TO. Now that the bars land on
  // 20 Aug the handover on the 22nd falls off the right-hand edge, and the one
  // line the whole programme is measured to disappears exactly when it starts
  // being met.
  const t0=S.start;
  const t1=[S.finish, S.handover&&S.handover.date, state.schDay].filter(Boolean).sort().pop();
  const D=(x)=>Date.parse(x+"T00:00:00Z");
  const iso=(ms)=>new Date(ms).toISOString().slice(0,10);
  // A PROGRAMME IS READ IN DAYS AND MONTHS, NOT IN ISO. "2026-06-03" is four
  // characters of year nobody needs on a five-month job, twice a row, on
  // fourteen hundred rows.
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const YR=new Date(D(t0)).getUTCFullYear();
  const fmt=(x)=>{ if(!x) return "—"; const d=new Date(D(x));
    const y=d.getUTCFullYear();
    return String(d.getUTCDate()).padStart(2,"0")+" "+MON[d.getUTCMonth()]+
           (y===YR?"":" "+String(y).slice(2)); };
  const dayN=(x)=>Math.round((D(x)-D(t0))/86400000);
  const totalDays=Math.max(1,dayN(t1)+1);
  // A MONTH VIEW STILL HAS TO SHOW A MONTH. At 3.2px a day a month was 96px
  // wide and the bars inside it were slivers; the point of the month view is
  // the shape of the programme, and you cannot see a shape that narrow.
  const PX={month:7, week:11, day:28}[state.schZoom||"week"];
  state.schPX=PX;
  const X=(x)=>dayN(x)*PX;
  const chartW=Math.round(totalDays*PX);

  // ---- the ticks ----------------------------------------------------------
  // A MONTH IS A HEADING, A WEEK IS A TICK. On a fit-out nobody plans in
  // months — the conversation is "which week" — so weeks are the default and
  // the month sits above them as the thing that makes a week nameable.
  const monthBand=[];
  { let d=new Date(D(t0)); d.setUTCDate(1);
    while(d.getTime()<=D(t1)){
      const s=Math.max(0,dayN(iso(d.getTime())));
      const nxt=new Date(d.getTime()); nxt.setUTCMonth(nxt.getUTCMonth()+1);
      const e=Math.min(totalDays,dayN(iso(nxt.getTime())));
      monthBand.push({left:s*PX,w:(e-s)*PX,
        label:d.toLocaleString("en",{month:"short",year:"2-digit",timeZone:"UTC"})});
      d=nxt; } }
  const ticks=[];
  if((state.schZoom||"week")==="week"){
    // weeks numbered WITHIN their month — W1 is the week the month starts in,
    // which is how a site talks about it, not the ISO week of the year
    let d=new Date(D(t0)); d.setUTCDate(1);
    while(d.getTime()<=D(t1)){
      const m=d.getUTCMonth(); let w=0, c=new Date(d.getTime());
      while(c.getUTCMonth()===m && c.getTime()<=D(t1)+6*86400000){
        w++; const s=dayN(iso(c.getTime()));
        if(s>=0&&s<totalDays) ticks.push({left:s*PX,w:7*PX,label:"W"+w});
        c=new Date(c.getTime()+7*86400000); }
      d=new Date(d.getTime()); d.setUTCMonth(d.getUTCMonth()+1); d.setUTCDate(1); }
  } else if((state.schZoom||"week")==="day"){
    for(let i=0;i<totalDays;i++){ const dd=new Date(D(t0)+i*86400000);
      if(dd.getUTCDay()===1||PX>=26) ticks.push({left:i*PX,w:PX,
        label:String(dd.getUTCDate()),dim:dd.getUTCDay()===0}); }
  }

  const hand=S.handover&&S.handover.date;
  // TODAY IS A FACT ABOUT THE CLOCK, NOT ABOUT THE DATA. It is where the job
  // SHOULD be right now, and it belongs on the chart whether or not anybody
  // walked the site today.
  const todayISO=new Date().toISOString().slice(0,10);
  const inSpan=(x)=>x&&x>=t0&&x<=t1;

  // vertical rules, drawn into every row's chart cell so they cannot drift
  const rules=()=>
    (inSpan(hand)?`<i class="rl" style="left:${X(hand)}px;background:var(--bad)"></i>`:"")+
    (inSpan(todayISO)?`<i class="rl" style="left:${X(todayISO)}px;background:#8b8fa3"></i>`:"")+
    (withProgress&&inSpan(state.schDay)?`<i class="rl" style="left:${X(state.schDay)}px;background:var(--warn)"></i>`:"");

  // ---- one bar ------------------------------------------------------------
  // The planned span is the outline; progress fills it from the left. Being
  // behind is a bar that is not full — the shape a PM already reads.
  const bar=(x,row,depth)=>{
    const L=X(x.ES), W=Math.max(2,X(x.EF)-X(x.ES)+PX);
    const planned=row?row.planned:null, actual=row?row.actual:null;
    const crit=x.critical;
    const col = crit?"var(--bad)":depth===0?"var(--acc)":depth===1?"var(--acc)":"var(--ok)";
    const fill = actual==null?null:Math.max(0,Math.min(100,actual));
    return `<div class="gcell" style="width:${chartW}px">${rules()}
      <div class="gbar" style="left:${L}px;width:${W}px;height:${depth===2?11:13}px;
        background:${col}${depth===2?"33":"26"};border-color:${col}${crit?"":"99"}"
        title="${esc(x.ES)} → ${esc(x.EF)}${planned!=null?"  ·  planned "+planned+"%":""}${actual!=null?"  ·  actual "+actual+"%":""}">
        ${fill!=null?`<span style="width:${fill}%;background:${col}"></span>`:""}
      </div></div>`;
  };

  const cell=(row,code,catId)=>{
    if(!withProgress) return "";
    if(!row) return `<td class="n f">—</td><td class="n f">—</td><td class="n f">—</td>`;
    const p=row.planned, a=row.actual;
    const gap = (p==null||a==null)?null:a-p;
    // EVERY NUMBER IS AN ARGUMENT SOMEBODY MIGHT WIN. The engine reads what
    // it can, reasons where it cannot, and neither is worth much if the one
    // person who was actually standing on the floor has no way to say so.
    // So both figures open the same dialog on any row, and the only thing
    // the styling still says is WHERE the number came from: amber for a
    // figure the engine reasoned to, green for one somebody set, plain for
    // one read off a photograph. No labels, because the colour is the label.
    const inf=row.inferred, con=row.confirmed;
    const tone = inf?"asm":con?"cfm":"";
    const tip = inf ? inf.why
      : con ? ("set on site" + (con.on?" as on "+con.on:"") + " — click to change")
      : row.unseen ? "nothing has been seen for this yet — click to say what is actually true"
      : "read from the walk — click to correct";
    const key = code ? ` data-asm="${esc(code)}"` : catId ? ` data-asmcat="${esc(catId)}"` : "";
    const A=(inner,style)=>`<a class="pick ${tone}"${key} title="${esc(tip)}"${
      style?` style="${style}"`:""}>${inner}</a>`;
    return `<td class="n">${p==null?"—":p+"%"}</td>
      <td class="n">${A(a==null?"—":a+"%")}</td>
      <td class="n">${gap==null?A("—")
        :A((gap>0?"+":"")+gap,"color:"+(gap>=0?"var(--ok)":gap>-15?"var(--warn)":"var(--bad)"))}</td>`;
  };

  // NOTHING OFF SITE GETS A PERCENTAGE. A drawing, an approval, a purchase
  // order and a truck are all on the programme because they drive the dates,
  // and none of them is work anybody photographs. Showing a per cent against
  // them would either invent a number or, worse, drag the site team's own
  // figure down for a PO somebody else has not raised. They show who owns it.
  const offSite=()=>withProgress
    ? `<td class="n f" colspan="3" style="text-align:left;font-size:10.6px">off site</td>`
    : "";

  // ---- the tree ------------------------------------------------------------
  const rows=[];
  (S.wbs||[]).forEach(C=>{
    // CLOSED BY DEFAULT, ALL THREE LEVELS. Opening every category put 277
    // package rows on screen before anybody had asked a question, and the
    // shape of the job — which phase is behind, by how much — is a thirty
    // five line answer. Open the one that looks wrong; the rest stay quiet.
    const openC=!!state.schOpen["C:"+C.id];
    rows.push(`<tr class="lv0" data-tog="C:${C.id}">
      <td class="nm"><span class="tw">${openC?"▾":"▸"}</span><b>${esc(C.name)}</b>
        <span class="f"> · ${C.packages.length}</span>${(()=>{
          const w=pr&&pr.byCat[C.id]&&pr.byCat[C.id].weight;
          return w?`<span class="wt" title="this heading is ${w}% of the job by ${
            esc(S.progressBasis||"value")}, so finishing it moves the total by ${w} points">${w}%</span>`:"";})()}
        ${C.critical?`<span class="c bad" style="margin-left:6px">critical</span>`:""}</td>
      <td class="f n">${fmt(C.ES)}</td><td class="f n">${fmt(C.EF)}</td>
      ${C.packages.every(k=>k.track===false)?offSite():cell(pr&&pr.byCat[C.id],null,C.id)}
      <td class="gz">${bar(C,pr&&pr.byCat[C.id],0)}</td></tr>`);
    if(!openC) return;
    C.packages.forEach(K=>{
      const openK=!!state.schOpen["K:"+K.id+":"+C.id];
      rows.push(`<tr class="lv1" data-tog="K:${K.id}:${C.id}">
        <td class="nm" style="padding-left:24px"><span class="tw">${openK?"▾":"▸"}</span>${esc(K.name)}
          <span class="f"> · ${K.track===false?esc(K.owner||"off site"):K.zones+" rooms"}</span>${(()=>{
            const r=pr&&pr.byPkg[K.id]; if(!r||!r.weight) return "";
            const left=(r.weight*(100-(r.actual==null?0:r.actual))/100).toFixed(2);
            return `<span class="wt" title="${r.weight}% of the job — ${
              r.valueFrom==="its labour"?"the bill never priced this, so it is valued at its labour":
              "Rs "+Math.round((r.value||0)/1e5)+" lakh of the bill"}, ${r.manDays} man-days.
              Finishing it from here moves the total by ${left} points.">${r.weight}%</span>`;})()}
          ${K.critical?`<span class="c bad" style="margin-left:6px">critical</span>`:""}</td>
        <td class="f n">${fmt(K.ES)}</td><td class="f n">${fmt(K.EF)}${
          K.handover&&K.handover!=="before"?`<span class="f" title="allowed to run past handover: snag clearing and papers only">*</span>`:""}</td>
        ${K.track===false?offSite():cell(pr&&pr.byPkg[K.id],K.code)}
        <td class="gz">${bar(K,pr&&pr.byPkg[K.id],1)}</td></tr>`);
      if(!openK) return;
      K.tasks.forEach(t=>{
        rows.push(`<tr class="lv2">
          <td class="nm" style="padding-left:46px">${
            t.trade?`<span class="tg tg-${esc(t.trade)}">${esc(t.trade)}</span>`:``}${esc(t.name)}
            <span class="f"> · ${t.share}%</span>
            ${t.generic?`<span class="f" title="no method statement declared for this package yet"> · generic</span>`:""}</td>
          <td class="f n">${fmt(t.ES)}</td><td class="f n">${fmt(t.EF)}</td>
          ${t.track===false?offSite():cell(pr&&pr.byTask[t.id],t.code)}
          <td class="gz">${bar(t,pr&&pr.byTask[t.id],2)}</td></tr>`);
      });
    });
  });

  const o=pr&&pr.overall;
  // THE CONTRACT DATE IS THE DEFAULT AND STAYS ON THE RECORD. The others are
  // the dates the documents themselves stated, plus a few beyond — because
  // "what would another fortnight buy" is the question a PM actually asks.
  const H=S.handover||{}, contractDate=H.contract||H.date;
  const plus=(d,n)=>new Date(Date.parse(d+"T00:00:00Z")+n*86400000).toISOString().slice(0,10);
  const HANDOVERS=(()=>{const seen={},out=[];
    const add=(d,note)=>{ if(!d||seen[d])return; seen[d]=1; out.push({date:d,note}); };
    add(contractDate,"contract");
    (H.variances||[]).forEach(v=>add(v.date,v.stated));
    [14,30,45,60].forEach(n=>add(plus(contractDate,n),"+"+n+"d"));
    return out.sort((a,b)=>a.date.localeCompare(b.date));})();
  const zoom=state.schZoom||"week";
  const c1=state.schCol1||260;

  // ---- THE DIALOG BEHIND AN ASSUMED NUMBER --------------------------------
  // Everything the engine reasoned to instead of reading is amber, and this
  // is what opens. It shows the claim, the evidence, and four ways to answer
  // it — three of them one click. Whatever comes back is kept and the
  // programme is rebuilt against it.
  const asmDlg=(()=>{
    // A CATEGORY IS NOT ONE ANSWER. Clicking "Civil work" cannot mean one
    // number, so it opens the packages under it and the answer is given on
    // the row that owns the work.
    if(state.asmCat){
      const C=(S.wbs||[]).find(c=>c.id===state.asmCat); if(!C) return "";
      const ks=C.packages.filter(k=>k.track!==false);
      return `<div class="ovl" id="asmovl"><div class="dlg">
        <h3>${esc(C.name)}</h3>
        <div class="f" style="font-size:11.4px;margin-bottom:4px">which of these do you want to set?</div>
        ${ks.map(k=>{const r=(pr&&pr.byPkg[k.id])||{};
          const where=r.inferred?"assumed from the rest of the floor":r.confirmed?"you set this":"read from the walk";
          return `<button class="opt" data-pick="${esc(k.code)}">
            <b>${esc(k.name)} <span style="float:right;color:${
              r.inferred?"var(--warn)":r.confirmed?"var(--ok)":"var(--fg)"}">${
              r.actual==null?"—":r.actual+"%"}</span></b>
            <span>${esc(where)}</span></button>`;}).join("")}
        <div style="display:flex;margin-top:14px"><a id="asmClose" class="f"
          style="margin-left:auto;cursor:pointer;font-size:12px">close</a></div>
      </div></div>`;
    }
    const code=state.asm; if(!code) return "";
    let K=null,C=null; (S.wbs||[]).forEach(c=>c.packages.forEach(k=>{if(k.code===code){K=k;C=c;}}));
    if(!K) return "";
    const r=(pr&&pr.byPkg[K.id])||{};
    const inf=r.inferred, con=r.confirmed;
    const cur = r.actual==null?0:r.actual;
    const opt=(v,t,sub)=>`<button class="opt" data-set="${v}"><b>${esc(t)}</b><span>${esc(sub)}</span></button>`;
    return `<div class="ovl" id="asmovl"><div class="dlg">
      <h3>${esc(K.name)}</h3>
      <div class="f" style="font-size:11.4px;margin-bottom:10px">${esc(C.name)} &middot; ${
        state.schDay?"as on "+fmt(state.schDay):""}</div>
      ${inf?`<div style="background:var(--card2);border:1px solid var(--warn-soft);border-radius:9px;padding:10px 12px">
        <div style="color:var(--warn);font-size:11px;letter-spacing:.04em;text-transform:uppercase">the engine assumed this</div>
        <div style="font-size:13px;margin-top:4px"><b>${inf.pct}% complete</b>, ${esc(inf.confidence)} confidence</div>
        <div style="font-size:12px;color:var(--fnt);margin-top:6px">${esc(inf.why)}</div>
      </div>`:""}
      ${con?`<div style="background:var(--card2);border:1px solid var(--ok-soft);border-radius:9px;padding:10px 12px">
        <div style="color:var(--ok);font-size:11px;letter-spacing:.04em;text-transform:uppercase">you set this</div>
        <div style="font-size:13px;margin-top:4px"><b>${con.pct}% complete</b>${
          con.on?" as on "+fmt(con.on):""}</div></div>`:""}
      ${!inf&&!con&&r.noRoute?`<div style="background:var(--card2);border:1px solid var(--warn-soft);border-radius:9px;padding:10px 12px">
        <div style="color:var(--warn);font-size:11px;letter-spacing:.04em;text-transform:uppercase">nothing can photograph this</div>
        <div style="font-size:13px;margin-top:4px"><b>carried at ${r.actual==null?0:r.actual}%</b></div>
        <div style="font-size:12px;color:var(--fnt);margin-top:6px">${esc(r.noRoute)}. The engine has no
          reading and will never get one — your answer is the only source there is.</div>
      </div>`:""}
      ${!inf&&!con&&!r.noRoute?`<div style="background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px 12px">
        <div class="f" style="font-size:11px;letter-spacing:.04em;text-transform:uppercase">read from the walk</div>
        <div style="font-size:13px;margin-top:4px"><b>${r.actual==null?"nothing seen":r.actual+"% complete"}</b>
          ${r.scored?` across ${r.scored} scored readings`:""}</div>
        <div style="font-size:12px;color:var(--fnt);margin-top:6px">This came off the site photographs.
          If the camera could not see the whole of it, say so here and your figure stands instead.</div>
      </div>`:""}
      ${(()=>{ const w=r.weight||0, a=r.actual==null?0:r.actual;
        if(!w) return "";
        return `<div style="margin-top:10px;font-size:12px;color:var(--fnt)">
          This is <b style="color:var(--fg)">${w}% of the job</b> by ${esc(S.progressBasis||"value")}${
          r.valueFrom==="its labour"?" (the bill never priced it, so it is valued at its labour)"
            :` — Rs ${Math.round((r.value||0)/1e5)} lakh of the bill`}, ${r.manDays} man-days.
          Taking it from ${a}% to finished would move the whole job by
          <b style="color:var(--fg)">${(w*(100-a)/100).toFixed(2)} points</b>.</div>`;})()}
      <div class="f" style="font-size:11.4px;margin:12px 0 2px">what is actually true?</div>
      ${inf?opt(inf.pct,"That is right","keep "+inf.pct+"% and stop marking it as an assumption"):""}
      ${opt(100,"It is fully done","100% complete")}
      ${opt(0,"It has not started","0% complete")}
      <div style="display:flex;gap:8px;align-items:center;margin-top:9px">
        <input id="asmPct" type="number" min="0" max="100" value="${cur}"
          style="width:78px;background:var(--card2);color:var(--fg);border:1px solid var(--line);
                 border-radius:8px;padding:8px 9px;font-size:12.5px">

// ---------- STEP 4 : MANPOWER ----------
// Three questions and nothing else. How many does the plan want. How many
// turned up. How many would it take from here. Everything that was on this
// page and did not answer one of those has gone.
function vCrew(){
  const M=state.MP;
  if(!M) return `<h2>Manpower</h2><div class="p"><div class="pb"><div class="e">
    manpower.json has not been built yet — run <code>node tools/manpower.js</code>.</div></div></div>`;
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmt=(x)=>{if(!x)return "—";const d=String(x).split("-");return d[2]+" "+MON[+d[1]-1];};
  const C=M.catchUp;

  // ---- day, week or month ------------------------------------------------
  // A daily curve is what a foreman works to and a monthly one is what a
  // review meeting can hold. Same numbers, three readings: a week and a month
  // show the AVERAGE people per working day in them, because a period's peak
  // flatters it — one busy Tuesday does not staff a month.
  const grain=state.mpGrain||"day";
  const wkKey=(iso)=>{const d=new Date(iso+"T00:00:00Z");
    d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10);};
  const bucketOf=(iso)=>grain==="day"?iso:grain==="week"?wkKey(iso):iso.slice(0,7)+"-01";

  const B={};
  const touch=(iso)=>{const k=bucketOf(iso);
    return B[k]=B[k]||{key:k,days:[],plan:0,planPeak:0,act:0,staff:0,actDays:0,
      need:null,needLand:null,owed:null};};
  M.daily.forEach(d=>{const b=touch(d.day);
    if(b.days.indexOf(d.day)<0) b.days.push(d.day);
    b.plan+=d.total; if(d.total>b.planPeak) b.planPeak=d.total;});
  M.actual.days.forEach(d=>{const b=touch(d);
    if(b.days.indexOf(d)<0) b.days.push(d);
    b.act+=M.actual.byDay[d].labour; b.staff+=M.actual.byDay[d].staff||0; b.actDays++;});
  // ---- and where the reports stop, what has to happen instead -------------
  // A green line that just ends is a chart that stops asking. Past the last
  // day anybody reported, it carries on as the headcount that has to turn up
  // every working day from here for the job to land — flat, because a level
  // held is a date met. It only bends when somebody reports a day and the
  // engine works out what is left.
  //
  // THE ANCHOR IS THE LAST DAY WITH EVIDENCE, not the first day of the
  // programme. Starting the requirement earlier than the last thing we know
  // would ask the site to redo work it has already done.
  const cv=(C&&C.curve)||[];
  const anchor=cv.filter(c=>c.reported).slice(-1)[0]||cv[0]||null;
  cv.forEach(c=>{const b=touch(c.day);
    if(b.days.indexOf(c.day)<0) b.days.push(c.day);
    if(b.owed==null){b.owed=c.owed;b.wdLeft=c.workingDaysLeft;}
    // flat from the anchor onwards, and nothing before it
    if(anchor&&c.day>=anchor.day){
      if(b.need==null) b.need=anchor.toHandover;
      if(b.needLand==null) b.needLand=anchor.toLanding;}});
  // A BUCKET THE PROGRAMME NEVER PLANNED FOR — a DPR pasted against a Sunday,
  // or a day past the end of the job — has no ask, and drawing that as nought
  // puts a hole in the blue line that reads as a day nobody was booked.
  const planDay={}; M.daily.forEach(d=>planDay[d.day]=d);
  const rows=Object.keys(B).sort().map(k=>{const b=B[k]; b.days.sort();
    b.planDays=b.days.filter(d=>planDay[d]).length;
    b.planAvg=b.planDays?Math.round(b.plan/b.planDays):null;
    b.actAvg=b.actDays?Math.round(b.act/b.actDays):null;
    b.staffAvg=b.actDays?Math.round(b.staff/b.actDays):null;
    return b;});

  // ---- the picture -------------------------------------------------------
  // EIGHTY TWO DAYS ACROSS NINE HUNDRED PIXELS is eleven pixels a day, which
  // is narrower than the dot somebody has to hit. The day chart gets the room
  // it needs and the panel scrolls sideways; a week or a month has few enough
  // points to fit whatever width the screen gives it.
  const n=Math.max(1,rows.length);
  const H=350,PADL=10,PADB=24,PADT=16,AXW=76;
  const W=grain==="day"?Math.max(880,PADL+16+n*26):880;
  const X=(i)=>PADL+(n===1?0:i/(n-1))*(W-PADL-16);
  // THE SCALE IS SET BY WHERE THE CATCH-UP STARTS, not by where it ends. It
  // ends at infinity — on the last working day before the date, one day has
  // to absorb everything left — so scaling to its maximum would flatten every
  // other line on the chart to nothing. Scaling to the ceiling instead puts
  // the whole red curve off the top, which is equally useless. Its opening
  // figure is the one somebody can act on, so that is the top of the chart,
  // and the tail runs off it, which is the honest picture of a requirement
  // that accelerates every day nobody delivers.
  const needBase=(C&&C.curve&&C.curve.length)?C.curve[0].toHandover:0;
  const top=Math.max(M.floor.peakCap,M.totals.peak,needBase,
    ...rows.map(r=>r.actAvg||0))*1.08;
  const Y=(v)=>H-PADB-(Math.min(v,top)/top)*(H-PADB-PADT);

  const line=(pts,col,w,dash)=>pts.length<1?"":`<polyline points="${pts.join(" ")}" fill="none"
    stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:""} stroke-linejoin="round"/>`;
  const planPts=[],actPts=[];
  rows.forEach((r,i)=>{
    if(r.planAvg!=null) planPts.push(X(i).toFixed(1)+","+Y(r.planAvg).toFixed(1));
    if(r.actAvg!=null)  actPts.push(X(i).toFixed(1)+","+Y(r.actAvg).toFixed(1));});
  // THE PROJECTION IS THE GREEN LINE, CONTINUED. Drawn as a separate stub it
  // reads as a fourth thing to learn; drawn from the last day anybody
  // reported it reads as one sentence — this is where you are, this is what
  // it has to become — and the climb between the two is the whole point.
  const needPts=[],landPts=[];let anyClipped=false;
  const lastAct=actPts[actPts.length-1];
  rows.forEach((r,i)=>{if(r.need==null)return;
    if(r.need>top)anyClipped=true;
    if(!needPts.length&&lastAct){needPts.push(lastAct);landPts.push(lastAct);}
    needPts.push(X(i).toFixed(1)+","+Y(r.need).toFixed(1));
    if(r.needLand!=null) landPts.push(X(i).toFixed(1)+","+Y(r.needLand).toFixed(1));});

  // FOUR LINES ACROSS THREE HUNDRED PEOPLE is a quarter of the floor between
  // one mark and the next, which is not a scale anybody can read a value off.
  // Step to a round number — 25, 50, 100 — about eight marks up the side.
  const niceStep=(t)=>{const raw=t/8, p=Math.pow(10,Math.floor(Math.log10(raw||1)));
    return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw)||10*p;};
  const step=niceStep(top);
  const levels=[]; for(let v=0;v<=top;v+=step) levels.push(Math.round(v));

  const grid=levels.map(v=>`<line x1="${PADL}" x2="${W-6}" y1="${Y(v)}" y2="${Y(v)}"
    stroke="var(--line)" stroke-width="1"/>`).join("");
  // the same marks again, in a gutter that does not scroll.
  // A ROUND NUMBER YIELDS TO A REAL ONE. 191 is what the floor holds and 200
  // is only tidy; printed nine people apart they overlap into an unreadable
  // smudge, and it is the tidy one that goes.
  const clash=(v)=>Math.abs(Y(v)-Y(M.floor.peakCap))<11||Math.abs(Y(v)-Y(M.floor.sustained))<11;
  const axis=levels.filter(v=>!clash(v)).map(v=>`<text x="${AXW-10}" y="${(Y(v)+3.5).toFixed(1)}"
      fill="var(--mut)" font-size="10" text-anchor="end">${v}</text>`).join("")
    + `<line x1="${AXW-1}" x2="${AXW-1}" y1="${PADT-8}" y2="${H-PADB}" stroke="var(--line)" stroke-width="1"/>`
    + `<text x="${AXW-10}" y="${(Y(M.floor.peakCap)+3.5).toFixed(1)}" fill="var(--bad)" font-size="10"
        text-anchor="end" font-weight="600">${M.floor.peakCap}</text>`
    + `<text x="${AXW-10}" y="${(Y(M.floor.sustained)+3.5).toFixed(1)}" fill="var(--warn)" font-size="10"
        text-anchor="end" font-weight="600">${M.floor.sustained}</text>`;
  // a tick wherever the month turns over, and for month view on every point
  const ticks=rows.map((r,i)=>{
    const prev=i?rows[i-1].key.slice(0,7):null;
    if(grain!=="month"&&r.key.slice(0,7)===prev) return "";
    const d=r.key.split("-");
    return `<text x="${X(i).toFixed(1)}" y="${H-6}" fill="var(--mut)" font-size="9.5"
      text-anchor="middle">${MON[+d[1]-1]}</text>`;}).join("");
  const grainBtn=(id,t)=>`<button class="opt" data-grain="${id}" style="width:auto;display:inline-block;
    margin:0 6px 0 0;padding:4px 11px;font-size:11.5px;${grain===id?"border-color:var(--acc)":""}"><b>${t}</b></button>`;

  // ---- one day, opened -----------------------------------------------------
  // The curve answers "are we short". It cannot answer "short of what, and
  // who do I ring". That is this: the plan's own ask for that day trade by
  // trade, what the DPR said turned up against it, and the number that day
  // had to carry for the date to still be there at the end of it.
  const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const longFmt=(x)=>{const d=new Date(x+"T00:00:00Z");
    return DOW[d.getUTCDay()]+" "+(+x.slice(8))+" "+MON[+x.slice(5,7)-1]+" "+x.slice(0,4);};
  // THE SIGN IS AGAINST THE PLAN, NOT THE OTHER WAY ROUND. Forty four masons
  // where the programme booked none is +44, and green. Getting this backwards
  // paints an over-manned trade red and a short one green, which is the exact
  // opposite of the phone call somebody has to make.
  // ---- what a dot says before anybody clicks it ---------------------------
  // Only which day it is. A card that answers the whole question on hover
  // covers a third of the chart and fires on every dot the pointer crosses on
  // the way somewhere else; the numbers belong behind a deliberate click.
  state.mpTip={};
  rows.forEach(r=>{
    state.mpTip[r.key]=grain==="month" ? MON[+r.key.slice(5,7)-1]+" "+r.key.slice(0,4)
      : grain==="week" ? "week of "+fmt(r.days[0])
      : longFmt(r.key).replace(/^(\w{3})\w*/, "$1");});

  const chips=(o,cmp)=>Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).map(([t,v])=>{
    const c=cmp?v-(cmp[t]||0):null;
    return `<span style="display:inline-block;background:var(--card2);border:1px solid var(--line);
      border-radius:6px;padding:2px 7px;margin:0 5px 5px 0;font-size:11.5px">${esc(t)}
      <b>${v}</b>${c!=null&&c!==0?`<span style="color:${c>0?"var(--ok)":"var(--bad)"}"> ${
        c>0?"+":""}${c}</span>`:""}</span>`;}).join("")||`<span class="f">—</span>`;

  const dayPanel=(iso)=>{
    const p=M.daily.find(d=>d.day===iso)||null;
    const a=M.actual.byDay[iso]||null;
    const c=((C&&C.curve)||[]).find(x=>x.day===iso)||null;
    const before=C&&iso<C.asOf;
    return `<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">
      <div style="font-size:13px;font-weight:600">${longFmt(iso)}</div>

      <div style="display:flex;gap:10px;margin:10px 0 2px">
        <div style="flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 11px">
          <div class="f" style="font-size:10.5px;letter-spacing:.04em;text-transform:uppercase">the plan asks for</div>
          <div style="font-size:19px;font-weight:600;margin:2px 0 6px">${p?p.total:0}<span
            class="f" style="font-size:12px;font-weight:400"> people</span></div>
          ${p?chips(p.byTrade):`<span class="f" style="font-size:11.5px">nothing is programmed for this day</span>`}
        </div>
        <div style="flex:1;background:var(--card2);border:1px solid ${a?"var(--ok-soft)":"var(--line)"};
          border-radius:9px;padding:9px 11px">
          <div class="f" style="font-size:10.5px;letter-spacing:.04em;text-transform:uppercase">turned up${
            a&&a.shifts?` · ${a.shifts.join(" + ")} shift${a.shifts.length>1?"s":""}`:""}</div>
          <div style="font-size:19px;font-weight:600;margin:2px 0 6px;color:${a?"var(--fg)":"var(--mut)"}">${
            a?a.labour:"—"}<span class="f" style="font-size:12px;font-weight:400">${
            a?" on the tools":""}</span>${a&&a.staff?`<span class="f" style="font-size:12px;font-weight:400">
            &nbsp;+ ${a.staff} staff</span>`:""}</div>
          ${a?chips(a.byTrade,p&&p.byTrade)
             :`<span class="f" style="font-size:11.5px">no DPR on record for this day</span>`}
          ${a&&a.unplaced?`<div style="color:var(--warn);font-size:11.5px;margin-top:4px">${a.unplaced}
            of them in a trade this engine does not know yet</div>`:""}
          ${a&&a.disagrees?`<div style="color:var(--warn);font-size:11.5px;margin-top:4px">the report's own
            total says ${a.stated}, its rows add to ${a.total}</div>`:""}
        </div>
      </div>

      ${c?`<div style="background:var(--card2);border:1px solid var(--bad-soft);border-radius:9px;padding:9px 11px;margin-top:8px">
        <div style="color:var(--bad);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase">if nothing is delivered until this day</div>
        <div style="font-size:12.5px;margin-top:5px">
          <b style="font-size:15px;color:${c.toHandover<=M.floor.peakCap?"var(--ok)":"var(--bad)"}">${
            c.toHandover}</b> people a day from here to still hit ${fmt(C.toHandover.date)}
          &nbsp;·&nbsp; <b>${c.toLanding}</b> a day to hit ${fmt(C.toLanding.date)}</div>
        <div class="f" style="font-size:11.5px;margin-top:4px">${c.owed.toLocaleString("en-IN")}
          man-days still owed on this morning, over ${c.workingDaysLeft} working day${
          c.workingDaysLeft===1?"":"s"}. The floor holds ${M.floor.peakCap}.</div>
        ${anchor&&c.day>anchor.day?`<div class="f" style="font-size:11.5px;margin-top:4px">
          This is the price of waiting. The dashed line on the chart is
          <b style="color:var(--fg)">${anchor.toHandover}</b>, which is what it takes starting from
          ${fmt(anchor.day)} — every working day that passes unreported pushes this figure up.</div>`:""}
      </div>`:before?`<div class="f" style="font-size:11.5px;margin-top:8px">This day is before the
        ${fmt(C.asOf)} walk, so there is no catch-up figure for it — the engine only knows where the
        site stood on the day it was last photographed.</div>`:""}

      <div style="font-size:12.3px;color:var(--fnt);margin-top:9px">${(()=>{
        if(!a&&!c) return "Nothing to say about this day yet: no report was pasted for it.";
        if(!a) return "No DPR was pasted for this day, so nothing came off the pile — the red figure "+
          "above assumes this day delivered nothing, because nobody said otherwise.";
        const short=c?c.toHandover-a.labour:null;
        const vsPlan=p?a.labour-p.total:null;
        // A TRADE NOBODY SENT HAS NO CHIP, because chips are drawn off what
        // turned up. It is the one that matters most, so it is named here.
        const under=p?Object.keys(p.byTrade).filter(t=>(a.byTrade[t]||0)<p.byTrade[t])
          .sort((x,y)=>(p.byTrade[y]-(a.byTrade[y]||0))-(p.byTrade[x]-(a.byTrade[x]||0))):[];
        const gaps=under.slice(0,4).map(t=>t+" short "+(p.byTrade[t]-(a.byTrade[t]||0))+
          ((a.byTrade[t]||0)===0?" (nobody)":""));
        return (vsPlan!=null?(vsPlan>=0?"<b>"+a.labour+" on the tools against the "+p.total+
            " the programme booked</b>, "+vsPlan+" more than it asked for. "
          :"<b>"+a.labour+" on the tools against the "+p.total+" the programme booked</b>, "+
            (-vsPlan)+" short. "):"")+
          (gaps.length?"By trade: "+gaps.join(", ")+
            (under.length>4?" and "+(under.length-4)+" more":"")+". ":"")+
          (short!=null&&short>0?"Against the date it is "+short+" short — a day at this strength "+
            "pushes tomorrow's requirement up, not down.":short!=null?"That is at or above what the "+
            "date needs, so the requirement falls tomorrow.":"");})()}</div>
    </div>`;};

  const mpDlg=()=>{
    const k=state.mpDay; if(!k) return "";
    const b=B[k]; if(!b) return "";
    const one=b.days.length===1;
    return `<div class="ovl" id="mpovl"><div class="dlg" style="max-width:660px">
      <h3>${one?"That day":(grain==="week"?"Week of ":"")+fmt(b.days[0])+" → "+fmt(b.days[b.days.length-1])}</h3>
      ${one?"":`<div class="f" style="font-size:11.4px">${b.planDays} working day${b.planDays===1?"":"s"} ·
        the plan averages <b style="color:var(--fg)">${b.planAvg}</b> people a day and peaks at
        <b style="color:var(--fg)">${b.planPeak}</b>${b.actAvg!=null?` · the DPR averages
        <b style="color:var(--fg)">${b.actAvg}</b> across ${b.actDays} reported day${
        b.actDays===1?"":"s"}`:" · no DPR on record for any day in it"}</div>`}
      <div style="max-height:58vh;overflow:auto;margin-top:2px">
        ${b.days.map(dayPanel).join("")}
      </div>
      <div style="display:flex;margin-top:12px"><a id="mpClose" class="f"
        style="margin-left:auto;cursor:pointer;font-size:12px">close</a></div>
    </div></div>`;};

  return `<h2>Manpower</h2>
  <p class="sub">${esc(M.shift?M.shift.name.toLowerCase()+", "+M.shift.fronts+" gangs per trade":"")} ·
    this floor holds ${M.floor.sustained} people comfortably and ${M.floor.peakCap} at the finishing peak.</p>

  ${C?`<div class="p"><div class="pb" style="padding:0"><div class="grid">
    <div class="g"><div class="v">${C.workLeft.toLocaleString("en-IN")}</div>
      <div class="k">man-days of work left, at ${C.donePct}% done on ${fmt(C.asOf)}</div></div>
    <div class="g"><div class="v" style="color:${C.toHandover.possible?"var(--ok)":"var(--bad)"}">${
      C.toHandover.perDay||"—"}</div>
      <div class="k">people a day to finish by ${fmt(C.toHandover.date)}, over ${C.toHandover.workingDays} working days</div></div>
    <div class="g"><div class="v" style="color:${C.toLanding.possible?"var(--ok)":"var(--bad)"}">${
      C.toLanding.perDay||"—"}</div>
      <div class="k">people a day to finish by ${fmt(C.toLanding.date)}, where the programme lands</div></div>
    <div class="g"><div class="v">${M.floor.peakCap}</div>
      <div class="k">the most this floor can hold, whatever anybody hires</div></div>
  </div></div>
  ${!C.toHandover.possible?`<div class="pb" style="border-top:1px solid var(--line);padding-top:9px">
    <div class="e" style="border:0;padding:0;color:${C.toLanding.possible?"var(--warn)":"var(--bad)"}">
    ${C.toHandover.perDay} people cannot stand on ${M.floor.sqft.toLocaleString("en-IN")} sqft — the floor
    holds ${M.floor.peakCap}, so ${fmt(C.toHandover.date)} cannot be bought with people.
    ${C.toLanding.possible?`${fmt(C.toLanding.date)} can: ${C.toLanding.perDay} a day is inside the ceiling,
    though it is ${Math.round(C.toLanding.perDay/M.floor.sustained*10)/10}× what this floor works at
    comfortably and holds there for ${C.toLanding.workingDays} working days.`
    :`Neither date can. This is not a resourcing problem any more; the date moves or the scope does.`}</div></div>`:""}
  </div>`:""}

  <div class="p"><div class="ph"><div><h3>People on the floor</h3>
    <p>Blue is what the programme asks for. Green solid is what the daily reports say turned up — trade
    labour only, since the programme never books a project manager. Where the reports stop, green
    dashed carries on as the headcount that has to turn up every working day from here for the job to
    land. Click any dot for that day.</p></div>
    <div style="white-space:nowrap">${grainBtn("day","Day")}${grainBtn("week","Week")}${grainBtn("month","Month")}</div></div>
    <div class="pb" style="padding:0">
      <div class="mpouter">
      <svg class="mpaxis" viewBox="0 0 ${AXW} ${H}" width="${AXW}" height="${H}">${axis}</svg>
      <div class="mpwrap" style="margin-left:${AXW}px"><div class="mptip" id="mptip"></div>
      <svg viewBox="0 0 ${W} ${H}" style="${grain==="day"?`width:${W}px`:"width:100%"};height:${
        H}px;display:block">
        ${grid}${ticks}
        <line x1="${PADL}" x2="${W-6}" y1="${Y(M.floor.peakCap)}" y2="${Y(M.floor.peakCap)}"
          stroke="var(--bad)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="${PADL}" x2="${W-6}" y1="${Y(M.floor.sustained)}" y2="${Y(M.floor.sustained)}"
          stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 3"/>
        ${line(landPts,"#c9a227",1.8,"2 3")}
        ${line(needPts,"var(--ok)",2,"5 3")}
        ${line(planPts,"var(--acc)",2)}
        ${line(actPts,"var(--ok)",2.5)}
        ${rows.map((r,i)=>{const x=X(i).toFixed(1);
          const band=(W-PADL-16)/n;
          // THE TOOLTIP HANGS OFF ONE OF THESE, and it must not be a dot that
          // was clamped to the top of the chart — the catch-up figure often
          // is, which would peg every hover card to the ceiling of the panel.
          // What turned up anchors it if there is a reading, the plan if not.
          const anchor=r.actAvg!=null?"act":r.planAvg!=null?"plan":"need";
          const dot=(id,v,col,rad)=>v==null?"":`<circle class="halo" cx="${x}" cy="${Y(v).toFixed(1)}"
              r="${rad+4.5}" fill="none" stroke="${col}" stroke-width="1.4"/>
            <circle${id===anchor?' class="anchor"':""} cx="${x}" cy="${Y(v).toFixed(1)}" r="${rad}"
              fill="${col}" stroke="var(--card)" stroke-width=".8"/>`;
          return `<g data-mpday="${r.key}">
            <rect class="hit" x="${(X(i)-band/2).toFixed(1)}" y="${PADT}" width="${band.toFixed(1)}"
              height="${H-PADB-PADT}" fill="transparent"/>
            ${dot("need",r.need,"var(--ok)",2.6)}
            ${dot("plan",r.planAvg,"var(--acc)",grain==="day"?2.8:3.4)}
            ${dot("act",r.actAvg,"var(--ok)",3.6)}
          </g>`;}).join("")}
        ${anyClipped?`<text x="${PADL+6}" y="${PADT+10}" fill="var(--bad)" font-size="10.5">the dashed line
          runs off the top of this chart — it asks for more people than the floor can hold</text>`:""}
      </svg></div></div>
      <div style="display:flex;gap:14px;font-size:11.3px;color:var(--mut);padding:7px 0 0;flex-wrap:wrap">
        <span><i style="display:inline-block;width:14px;height:2px;background:var(--acc);vertical-align:middle"></i>
          the plan wants</span>
        <span><i style="display:inline-block;width:14px;height:2px;background:var(--ok);vertical-align:middle"></i>
          ${M.actual.any?"actually turned up":"no DPR pasted yet"}</span>
        <span><i style="display:inline-block;width:14px;height:2px;background:var(--ok);vertical-align:middle;
          opacity:.75"></i> what has to turn up from here for ${fmt(C&&C.toHandover.date)}</span>
        <span><i style="display:inline-block;width:14px;height:2px;background:#c9a227;vertical-align:middle"></i>
          and for ${fmt(C&&C.toLanding.date)}</span>
        <span><i style="display:inline-block;width:14px;height:0;border-top:1px dashed var(--bad);
          vertical-align:middle"></i> ${M.floor.peakCap} — the most this floor holds</span>
        <span><i style="display:inline-block;width:14px;height:0;border-top:1px dashed var(--warn);
          vertical-align:middle"></i> ${M.floor.sustained} — comfortable</span>
        ${grain!=="day"?`<span style="margin-left:auto">${grain==="week"?"week":"month"} figures are the
          average people per working day</span>`:""}
      </div>
    </div>
  </div>
  ${mpDlg()}

  <div class="p"><div class="ph"><div><h3>Paste a DPR</h3>
    <p>Any shape: copied out of a PDF, pasted from Excel, or typed. It needs a date and rows of
    trade and number. ${M.actual.any?M.actual.days.length+" day"+(M.actual.days.length===1?"":"s")+
    " on record so far.":"Nothing on record yet, so the green line has nothing to draw."}</p></div></div>
    <div class="pb">
      <textarea id="dprText" rows="5" placeholder="Date: 10.08.2026&#10;1  Mason        12&#10;2  Carpenter    18&#10;3  Electrician  14&#10;   TOTAL        44"
        style="width:100%;background:var(--card2);color:var(--fg);border:1px solid var(--line);
        border-radius:9px;padding:10px 12px;font-size:12px;font-family:inherit;resize:vertical"></textarea>
      <div style="display:flex;gap:10px;align-items:center;margin-top:9px">
        <button class="opt" id="dprSave" style="width:auto;margin:0;padding:8px 16px"><b>Read it</b></button>
        <span class="f" style="font-size:11.4px">${state.dprSaid||"the date is picked out of the text; trades are matched on how a site names them"}</span>
      </div>
      ${M.actual.any?`<div style="margin-top:12px">
        ${M.actual.days.slice().reverse().map(d=>{const x=M.actual.byDay[d];
          return `<div style="display:flex;gap:10px;align-items:baseline;font-size:12px;padding:4px 0;
            border-top:1px solid var(--line)">
            <b style="width:64px">${fmt(d)}</b>
            <b style="width:36px;text-align:right">${x.labour}</b>
            <span class="f" style="width:62px;text-align:right">${x.staff?"+"+x.staff+" staff":""}</span>
            <span class="f" style="width:64px">${(x.shifts||[]).join("+")}</span>
            <span class="f" style="flex:1">${Object.entries(x.byTrade).sort((a,b)=>b[1]-a[1])
              .map(([t,n])=>t+" "+n).join(" · ")}${x.unplaced?`  <span style="color:var(--warn)">+${
              x.unplaced} not placed</span>`:""}</span>
            ${x.disagrees?`<span class="c warn" title="the report's own total says ${x.stated}">totals differ</span>`:""}
            <a data-dprdel="${d}" class="f" style="cursor:pointer">remove</a></div>`;}).join("")}
      </div>`:""}
    </div>
  </div>

  <div class="p"><div class="ph"><div><h3>Which trade, and when</h3>
    <p>Peak is the most of that trade the programme needs on any one day.</p></div></div>
    <div class="pb" style="padding:0">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr class="f" style="font-size:10.6px;letter-spacing:.04em;text-transform:uppercase">
          <td style="padding-bottom:5px">trade</td><td class="n">peak</td><td class="n">man-days</td>
          <td style="padding-left:14px">on the floor</td>
          ${M.actual.any?`<td class="n" style="padding-left:14px">latest DPR</td>`:""}</tr>
        ${M.byTrade.map(t=>{
          const last=M.actual.any?M.actual.byDay[M.actual.days[M.actual.days.length-1]]:null;
          const got=last?(last.byTrade[t.trade]||0):null;
          return `<tr><td style="padding:4px 0">${esc(t.trade)}</td>
          <td class="n"><b>${t.peak}</b></td>
          <td class="n">${t.manDays.toLocaleString("en-IN")}</td>
          <td style="padding-left:14px" class="f">${fmt(t.from)} → ${fmt(t.to)}</td>
          ${M.actual.any?`<td class="n" style="padding-left:14px;color:${

            got===null?"—":got}</td>`:""}</tr>`;}).join("")}
      </table>
    </div>
  </div>`;
}

    Pins ${A.counts.unframed.join(", ")} were walked and photographed and can never be scored — no design

  <div class="p"><div class="pb" style="padding:0 0 10px">
    <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">

 {k:"3D design",            re:/3d|render|walkthrough|view/i,          w:4},
 {k:"Sales KT note",        re:/\bkt\b|handover|briefing/i,            w:4},
 {k:"DBR",                  re:/dbr|design basis/i,                    w:3},
 {k:"Tender / RFP / RFQ",   re:/tender|rfp|rfq|quotation/i,            w:3},
 {k:"Fit-out guidelines",   re:/fit.?out|guideline|manual/i,           w:3},

];
const DYNAMIC_INPUTS = [
 {k:"Site photos / pin walk",re:/photo|pin|walk|site/i,                w:8},
